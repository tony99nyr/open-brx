<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BRX — 2-Tagger Deathmatch</title>
<style>
  :root{ --bg:#0c1016; --panel:#141b24; --line:#25313f; --ink:#e8eef5; --dim:#8aa0b4;
    --accent:#39b4ff; --ok:#2ecc71; --bad:#ff5252; --warn:#ffb020;
    --blue:#3a86ff; --yellow:#ffd23f; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,Roboto,sans-serif;
    padding:12px;padding-bottom:36px}
  h1{font-size:17px;margin:0 0 8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  button{flex:1 1 auto;min-width:120px;min-height:50px;border:1px solid var(--line);border-radius:10px;
    background:#1b2531;color:var(--ink);font-size:15px;font-weight:600}
  button:active{transform:translateY(1px)} button:disabled{opacity:.4}
  button.primary{background:var(--accent);color:#04121e;border-color:var(--accent)}
  button.danger{background:#7a1f2b;border-color:#7a1f2b}
  label{font-size:12px;color:var(--dim)} input{width:64px;min-height:44px;background:#0e141b;
    border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:0 8px;font-size:15px;text-align:center}
  .players{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .p{border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--panel)}
  .p.A{border-color:var(--blue)} .p.B{border-color:var(--yellow)}
  .p .nm{font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  .p .batt{font-size:11px;color:var(--dim)}
  .p .badge{font-size:11px;padding:1px 8px;border-radius:999px;font-weight:700}
  .badge.alive{background:#153a26;color:var(--ok)} .badge.dead{background:#3a2530;color:var(--bad)}
  .bar{height:10px;background:#0e141b;border-radius:6px;overflow:hidden;margin:6px 0 2px}
  .bar > i{display:block;height:100%;background:var(--ok);transition:width .15s}
  .bar.armor > i{background:var(--warn)}
  .kv{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px}
  .kv b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .score{text-align:center;font-size:13px;color:var(--dim);margin:8px 0}
  .score b{font-size:26px;font-variant-numeric:tabular-nums}
  .score .a{color:var(--blue)} .score .b{color:var(--yellow)}
  #log{background:#080c11;border:1px solid var(--line);border-radius:10px;height:170px;overflow:auto;
    padding:8px;font:11.5px/1.4 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;margin-top:8px}
  .li{color:var(--dim)} .lk{color:var(--ok);font-weight:700} .le{color:var(--bad)} .lr{color:#7aa2c0}
  .note{font-size:12px;color:var(--dim)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;z-index:50}
  .modal[hidden]{display:none}
  .sheet{background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;
    width:100%;max-height:82vh;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .sheet-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px}
  #pickList{display:flex;flex-direction:column;gap:8px}
  button.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;
    min-height:54px;padding:8px 12px}
  button.pick .sfx{color:var(--accent);font-variant-numeric:tabular-nums;font-size:13px}
  button.pick .rssi{color:var(--dim);font-size:12px;min-width:40px;text-align:right}
  button.pick .used{color:var(--warn);font-size:11px}
</style>
</head>
<body>
  <h1>BRX — 2-Tagger Deathmatch <span id="status" class="note">(idle)</span></h1>

  <div class="row">
    <button id="setA">Set Gun A (blue)</button>
    <button id="setB">Set Gun B (yellow)</button>
  </div>
  <div class="row" style="align-items:center">
    <label>Respawn s <input id="respawn" type="number" value="8" min="1"></label>
    <label>Frag limit <input id="frag" type="number" value="0" min="0"></label>
    <button id="start" class="primary" disabled>Start game</button>
    <button id="end" class="danger" disabled>End</button>
  </div>

  <div class="score"><span class="a" id="scoreA">0</span> <b>—</b> <span class="b" id="scoreB">0</span>
    <span id="winner"></span></div>

  <div class="players">
    <div class="p A" id="cardA">
      <div class="nm"><span id="nameA">Gun A —</span><span class="badge dead" id="stA">—</span></div>
      <div class="batt" id="battA"></div>
      <div class="bar"><i id="hpA" style="width:0%"></i></div>
      <div class="bar armor"><i id="arA" style="width:0%"></i></div>
      <div class="kv"><span>HP <b id="hpvA">0</b></span><span>AR <b id="arvA">0</b></span>
        <span>AMMO <b id="amA">0</b></span></div>
      <div class="kv"><span>K <b id="kA">0</b></span><span>D <b id="dA">0</b></span></div>
    </div>
    <div class="p B" id="cardB">
      <div class="nm"><span id="nameB">Gun B —</span><span class="badge dead" id="stB">—</span></div>
      <div class="batt" id="battB"></div>
      <div class="bar"><i id="hpB" style="width:0%"></i></div>
      <div class="bar armor"><i id="arB" style="width:0%"></i></div>
      <div class="kv"><span>HP <b id="hpvB">0</b></span><span>AR <b id="arvB">0</b></span>
        <span>AMMO <b id="amB">0</b></span></div>
      <div class="kv"><span>K <b id="kB">0</b></span><span>D <b id="dB">0</b></span></div>
    </div>
  </div>

  <div class="row"><button id="clearLog" style="min-height:38px">Clear log</button></div>
  <div id="log"></div>

  <div id="picker" class="modal" hidden>
    <div class="sheet">
      <div class="sheet-h"><span id="pickTitle">Select a tagger</span>
        <button id="pickCancel" style="flex:0 0 auto;min-width:76px;min-height:40px">Cancel</button></div>
      <div id="pickStatus" class="note">scanning…</div>
      <div id="pickList"></div>
      <div class="note">A tagger only appears while it's awake and not already connected to something
        else. If yours isn't here, power-cycle it and it'll pop up within a couple seconds.</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
