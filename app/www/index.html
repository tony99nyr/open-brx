<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>BRX Combat HUD</title>
<style>
@font-face{font-family:'Saira Condensed';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/saira-condensed-600.ttf') format('truetype')}
@font-face{font-family:'Saira Condensed';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/saira-condensed-700.ttf') format('truetype')}
</style>
<style>
/* ============ tokens (Phone HUD v2 holo theme) ============ */
:root{
  /* team-red is a crimson-rose, hue-shifted off the alarm red (--bad #ff5252) so a red-team player's accents don't read as danger (design review #14) */
  --team-blue:#3a86ff;--team-yellow:#ffd23f;--team-red:#f43f5e;--team-green:#2ecc71;
  --team:var(--team-blue);--team-ink:#04121e;
  --num:#eef9ff;--glow:#5fd6ff;--mut:#7fa0b8;
  --plate:rgba(12,28,44,.85);--plate2:rgba(4,12,20,.9);--edge:#2a4e6e;
  --health:#39e07c;--armor:#7fd4ff;--shield:#24d9c4;--warn:#ffb020;--bad:#ff5252;--ok:#39e07c;
  --fd:'Saira Condensed',sans-serif;--fl:'Chakra Petch',sans-serif;
  --bg:radial-gradient(ellipse 120% 90% at 50% 45%,#0b1220 0%,#05080d 60%,#02040a 100%);
}
/* Bench 2026-09-18 (Tony): "the contrast on night mode is a little too extreme, the very thin font is
   hard to read at all". The answer is WEIGHT, not brightness: night ops is dim red on black on purpose,
   to keep a player's night vision and to stop the screen giving their position away, so lifting the
   luminance would undo the mode. The muted tone was the worst of it (#5a1f1f on black is nearly gone),
   so it comes up to a readable red, the numbers come up a little, and the thin weights get body below.
   HUD QA R2-12 (2026-09-24): the muted tier measured 2.6:1. Text under 14 px needs 4.5:1, so --mut is #cc4e4e (4.7:1 on a
   night plate) and --num comes up to #d65454 (5.2:1) to stay the brighter of the two. Hierarchy is size and weight. */
[data-env="night"]{--num:#d65454;--glow:transparent;--mut:#cc4e4e;--plate:transparent;--plate2:transparent;--edge:#2a1010;
  --health:#c05c5c;--armor:#a67a2a;--team:#6b2a2a;--team-ink:#f08080;--warn:#a67a2a;--bad:#d65454;--ok:#57802f;--bg:#000}   /* R2-12: every text ink >= 4.5:1 on a night plate */
/* Thin strokes are what actually fails at low contrast, so nothing under 500 survives the night skin. */
[data-env="night"] .hud,[data-env="night"] .hud *{font-weight:600}
[data-env="night"] .tab,[data-env="night"] b,[data-env="night"] .hud .num{font-weight:700}
[data-team="blue"]{--team:var(--team-blue);--team-ink:#04121e}
[data-team="yellow"]{--team:var(--team-yellow);--team-ink:#1a1400}
[data-team="red"]{--team:var(--team-red);--team-ink:#1a0404}
[data-team="green"]{--team:var(--team-green);--team-ink:#041a0c}
[data-env="night"][data-team]{--team:#5a2222;--team-ink:#f08080}   /* R2-12: black on the night team fill was 1.7:1 */
[data-env="night"] .plate{background:#0a0303;border-color:#3a1414}[data-env="night"] .plate.slot .thumb{border-color:#3a1414}   /* the kit stays readable at night (#24) */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#030407;color:var(--num);font-family:var(--fl);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}   /* F126: WKWebView auto-inflates text in a scrollable block (the diag panel) unless this is pinned — the HUD is a fixed 844x390 design, so ANY inflation is a bug */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#030407;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);box-sizing:border-box}   /* a status bar / notch never covers the frame's corners (device report 2026-09-04) */
#frame{position:relative;flex:0 0 844px;width:844px;height:390px;transform-origin:center center;overflow:hidden;background:var(--bg);color:var(--num)}   /* flex:0 0 — #stage is a flex row and a phone narrower than 844 CSS px shrank the frame BEFORE scaling it, reflowing every screen (review 2026-09-03 #6/#7/#13/#18/#22) */
#frame *{scrollbar-width:none}#frame *::-webkit-scrollbar{display:none}#diag,#diag *{scrollbar-width:auto}#diag::-webkit-scrollbar,#diag *::-webkit-scrollbar{display:block}   /* the desktop diagnostics panel keeps its scrollbars */   /* touch UI: desktop scrollbars ate 15px inside every scroller and wrapped rows (#2/#10) */   /* color resolved INSIDE the frame so night's --num applies to inherited text */
#hud,#overlay,#chips{position:absolute;inset:0}
#hud{z-index:1}#overlay{z-index:3;pointer-events:none}#chips{z-index:4;pointer-events:none}
#diag{z-index:6}
.tab{font-variant-numeric:tabular-nums}
.fd{font-family:var(--fd)}
.it{font-style:italic;font-weight:700}
.skew{transform:skewX(-12deg)}.unskew{display:inline-block;transform:skewX(12deg)}
.skew8{transform:skewX(-8deg)}.unskew8{display:block;transform:skewX(8deg)}
.skew6{transform:skewX(-6deg)}.unskew6{display:inline-block;transform:skewX(6deg)}
.skew10{transform:skewX(-10deg)}.unskew10{display:inline-block;transform:skewX(10deg)}
button{font-family:var(--fd);border:0;cursor:pointer;color:inherit;background:none;padding:0}
/* Bench 2026-09-16: obvious press feedback for EVERY tappable thing, so a tap always reads back.
   `.tap-press` is set by the delegated pointerdown/up pair in hud.js (constructor comment); `:active`
   stays too, for a mouse in a desktop browser. `scale`/filter only (the `scale` property, so a skewed button keeps its skew), no layout-shifting property,
   and the transition (not the state change itself) backs off under prefers-reduced-motion. Disabled /
   aria-disabled controls are excluded so a locked tile never looks pressed. */
button:not(:disabled):not([aria-disabled="true"]):active,
[data-act]:active,[role="button"]:active,
.tap-press{filter:brightness(1.4) contrast(1.05);scale:.95}
button,[data-act],[role="button"]{transition:scale 70ms ease-out,filter 70ms ease-out}
@media (prefers-reduced-motion:reduce){button,[data-act],[role="button"]{transition:none}}

/* ============ ambient ============ */
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 4px);pointer-events:none}
.edgeglow{position:absolute;inset:0;box-shadow:inset 0 0 120px -40px var(--team);pointer-events:none}
.strip{position:absolute;top:0;bottom:0;width:5px;background:linear-gradient(180deg,transparent,var(--team),transparent);pointer-events:none}
.strip.l{left:0}.strip.r{right:0}
[data-env="night"] .edgeglow,[data-env="night"] .strip,[data-env="night"] .scan{display:none}

/* ============ HUD alive ============ */
.clockplate{position:absolute;top:26px;left:50%;transform:translateX(-50%) skewX(-12deg);background:var(--plate);border:1px solid var(--edge);padding:4px 26px}
.clockplate .in{transform:skewX(12deg);display:flex;align-items:baseline;gap:10px}
.clockplate .t{font-family:var(--fd);font-weight:700;font-size:30px;letter-spacing:.04em;text-shadow:0 0 18px color-mix(in srgb,var(--glow) 55%,transparent)}
.clockplate .m{font-size:11px;letter-spacing:.24em;color:var(--mut);font-weight:600}
.ident{position:absolute;top:28px;left:34px;display:flex;align-items:center;gap:8px}
.ident .arrow{width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent;border-left:14px solid var(--team)}
.ident .cs{font-family:var(--fd);font-style:italic;font-weight:700;font-size:20px;letter-spacing:.1em}
.ident .sq{font-size:11px;letter-spacing:.2em;color:var(--team);font-weight:700}
.topright{position:absolute;top:26px;right:48px;display:flex;align-items:center;gap:16px;font-size:13px;color:var(--mut);font-weight:600;white-space:nowrap}
.topright .link{display:flex;align-items:center;gap:5px}
.topright button.mclink{font:inherit;color:inherit;letter-spacing:inherit;pointer-events:auto;position:relative;padding:0}
.topright button.mclink::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px}   /* the tap target; the visual stays a dot + label */
.topright .dot{width:9px;height:9px;background:var(--ok);border-radius:50%;box-shadow:0 0 8px var(--ok)}
.topright .dot.off{background:var(--bad);box-shadow:0 0 8px var(--bad);animation:blink .7s infinite}
.topright .dot.ws{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.topright .dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}   /* HUD QA R2-02: the link is up, the gun's pools are wrong (F341) */
.batt{display:flex;align-items:center;gap:5px}
.batt .shell{width:24px;height:11px;border:1.5px solid var(--mut);border-radius:2px;position:relative;display:inline-block}
.batt .fill{position:absolute;inset:2px;background:var(--ok)}
/* (S21, 2026-09-12: the CAM look-through chip is gone from the HUD. The camera PERMISSION and the QR join
   scanner stay — only the see-through-the-phone button went.) */
.stats{position:absolute;top:64px;right:48px;display:flex;gap:18px;font-size:13px;letter-spacing:.08em;color:var(--mut);font-weight:700;align-items:baseline;white-space:nowrap}   /* legible at arm's length (#14): 13/22 instead of 12/15 */
.stats b{color:var(--num);font-family:var(--fd);font-size:22px;font-weight:700;margin-left:4px}
.stats b.mut{color:var(--mut)}
.stats .mc{color:var(--ok);font-size:11px;vertical-align:top;font-weight:700}
.reticle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:6px;height:6px;border:1px solid var(--mut);border-radius:50%;opacity:.55}
.vitals{position:absolute;left:36px;bottom:32px;display:flex;flex-direction:column;gap:7px;width:300px}
.vitals .nums{display:flex;align-items:baseline;gap:10px}
.vitals .hp{font-family:var(--fd);font-style:italic;font-weight:700;font-size:84px;line-height:.8;text-shadow:0 0 24px color-mix(in srgb,var(--health) 50%,transparent)}
.vitals .hp.low{color:var(--bad);text-shadow:0 0 28px rgba(255,60,60,.7)}   /* QA-10: the number itself never blinks (it read at 20% half the time); the vignette and the bar pulse instead */
.vitals .sh{font-family:var(--fd);font-weight:700;font-size:24px;color:var(--armor)}
.vitals .sh.zero{color:var(--mut)}
.bar{height:14px;transform:skewX(-18deg);background:var(--plate2);border:1px solid var(--edge);padding:2px}
.bar.low{border-color:var(--bad);animation:hudglow 1s infinite}
.bar > i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--health) 0 22px,transparent 22px 26px);box-shadow:0 0 12px color-mix(in srgb,var(--health) 60%,transparent);transition:width .15s}
.bar.low > i{background:repeating-linear-gradient(90deg,var(--bad) 0 22px,transparent 22px 26px);box-shadow:0 0 12px rgba(255,60,60,.7)}
.bar.armor{height:9px;width:78%}
.bar.armor > i{background:repeating-linear-gradient(90deg,var(--armor) 0 34px,transparent 34px 38px);box-shadow:none}
/* ---- A56 powerups (docs/spec/powerups.md). Every piece takes the ITEM's own colour (`--item`, a literal #rrggbb set
   inline by hud.js); night overrides it to the dim red below. Type floors: labels 11 px, actions 14 px. ---- */
/* bottom 12 (polish r1 UX M1, r2: at least 4 px clear): below the QA-04 hit weapon line (.hitwpn, top 296) and the hit tag above it, so a hit taken
   at a station never covers the hint; at night the NIGHT OPS label steps aside for it (hud.js). */
.puhint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);pointer-events:none}
.nightlab.pu{display:none!important}
.puhint:empty{display:none}
/* The band between the vitals (right edge 336) and the frame's centre is 86 px, so the hint is at most 166 px wide and
   WRAPS rather than grows: a long name or STATION NOT ANSWERING takes a second line upward, never the vitals' space. */
.puhint .pu{box-sizing:border-box;display:flex;align-items:center;gap:8px;width:max-content;max-width:166px;padding:6px 11px 7px;background:color-mix(in srgb,var(--item) 14%,rgba(3,6,10,.82));border:1px solid color-mix(in srgb,var(--item) 70%,transparent)}
.puhint .put{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.puhint .pua{font-family:var(--fd);font-weight:700;font-size:17px;line-height:1.02;letter-spacing:.08em;color:var(--num)}
.puhint .pul{font-size:11px;line-height:1.2;font-weight:700;letter-spacing:.14em;color:var(--item)}
.puhint .pu[data-kind="no_answer"]{border-color:var(--warn)}.puhint .pu[data-kind="no_answer"] .pua{color:var(--warn);font-size:15px}
.puhint .pu[data-kind="taken"] .pua,.puhint .pu[data-kind="taken_by"] .pua{font-size:15px}
.puhint .pu[data-kind="granted"] .pua{color:var(--item);font-style:italic;font-size:20px}
.puring{--p:0;flex:none;width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--item) calc(var(--p) * 360deg),rgba(255,255,255,.12) 0);display:grid;place-items:center}
.puring i{width:29px;height:29px;border-radius:50%;background:#04070c}
/* ---- The shield meter: the Visor (Tony 2026-09-24; src/hud/shieldmeter.js). A long strip on the top edge, draining from both
   ends to the centre; health is not on it (it stays bottom left); the clock, the identity block and the chips stay put. No text, no numbers:
   the bar tells it. Day: Halo blue shield, a lime overshield layer on top, red when low;
   broken = the empty track pulses red and the frame is tinted; the delay = a faint fill creeping along the track; the refill =
   a rising sweep. Night (spec B4): red only; the overshield is brighter and double-railed; the one motion is a slow red pulse.
   Top 2 + a 16 px strip ends at 18 (Tony: between the 11 px candidate and 21), clear of the clock plate (26, night 28) and the identity block (28). ---- */
.svm{--svc:#3cb6ff;--svc2:#b3e8ff;--svos:#b8ff3a;--svbad:#ff4848;--svtrk:rgba(3,10,22,.9);--svedge:#2f5f86;
  position:absolute;left:50%;top:2px;width:520px;height:16px;transform:translateX(-50%);pointer-events:none;z-index:2}
.svtint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;box-shadow:inset 0 0 130px -30px rgba(255,40,40,.62),inset 0 0 0 2px rgba(255,72,72,.5)}
.alive.sv-down .svtint{opacity:1}
.svbar{position:absolute;left:0;right:0;top:0;height:16px;background:var(--svtrk);border:1px solid var(--svedge);overflow:hidden;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,12px 100%)}
.svbar > i{position:absolute;top:2px;bottom:2px;left:50%;transform:translateX(-50%);width:var(--w);max-width:calc(100% - 4px)}
.svbar > i.svseg{top:0;bottom:0;left:0;transform:none;width:100%;max-width:none;background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 4px),var(--svtrk) calc(20% - 4px) 20%)}
.svbar > i.svdly{top:auto;bottom:2px;height:4px;background:color-mix(in srgb,var(--svc2) 75%,transparent);transition:width .25s linear;overflow:hidden}   /* a rail along the bottom, over the fill */
.svm[data-wait] .svbar > i.svdly::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,#fff 50%,transparent 60%);animation:svsweep 1.6s linear infinite}
.svgh{background:var(--svc2);opacity:.6;transition:width .5s ease-in .25s}
.svfl{background:linear-gradient(180deg,var(--svc2),var(--svc) 48%);box-shadow:0 0 10px var(--svc);transition:width .28s linear;overflow:hidden}
.svm[data-raf] .svfl,.svm[data-raf] .svgh{transition:none}   /* F349: the refill moves every frame (shieldmeter.js fillFrame) */
.svos{background:linear-gradient(180deg,#eeffc2,var(--svos) 52%);box-shadow:0 0 12px var(--svos);transition:width .2s linear}
.svm[data-s="charge"] .svfl::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%);animation:svsweep .7s linear infinite}
@keyframes svsweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}   /* transform, not left: no layout per frame */
.svm[data-s="low"] .svfl{background:var(--svbad);box-shadow:0 0 10px var(--svbad)}
.svm[data-s="down"] .svbar{border-color:var(--svbad);animation:svdown 1.1s ease-in-out infinite alternate}
@keyframes svdown{from{background:color-mix(in srgb,var(--svbad) 12%,var(--svtrk))}to{background:color-mix(in srgb,var(--svbad) 55%,var(--svtrk))}}
.svm.hit .svbar{animation:svflick .36s linear}
.svm.hit .svfl,.svm.hit .svos{animation:svflash .4s ease-out}
@keyframes svflick{0%,40%,80%{border-color:var(--svc2)}20%,60%,100%{border-color:var(--svedge)}}
@keyframes svflash{0%{filter:brightness(2.2) saturate(.5)}100%{filter:none}}
/* night: the same shape in red; the overshield brighter and double-railed; the one motion is the broken track's slow red pulse */
[data-env="night"] .svm{--svc:#9c3434;--svc2:#c9484a;--svos:#f06a5c;--svbad:#e0524c;--svtrk:#0c0303;--svedge:#3a1414}
[data-env="night"] .svm *,[data-env="night"] .svm{animation:none!important}
[data-env="night"] .svm[data-s="down"] .svbar{animation:svdownN 1.2s ease-in-out infinite alternate!important}
@keyframes svdownN{from{background:#140404}to{background:#4a1414}}
[data-env="night"] .svfl,[data-env="night"] .svm[data-s="low"] .svfl{box-shadow:none}
[data-env="night"] .svgh{opacity:.35}
[data-env="night"] .svos{background:transparent;border-top:3px solid var(--svos);border-bottom:3px solid var(--svos);box-shadow:none}
[data-env="night"] .svbar > i.svdly{background:#e0524c}   /* brighter than the #9c3434 fill it crosses (#7a2626 was about 1.3:1) */
[data-env="night"] .svbar > i.svdly::after,[data-env="night"] .svm .svfl::after{display:none;animation:none!important}   /* `.svm *` does not reach a pseudo-element */
[data-env="night"] .svm.hit .svbar{border-color:var(--svc2)}
[data-env="night"] .svtint{transition:none;box-shadow:inset 0 0 0 3px #6e1f1f}
/* the held item sits ABOVE the ammo column, out of its flow, so the column never grows up into the callout band */
.puheld{position:absolute;right:0;bottom:calc(100% + 8px)}
.puheld:empty{display:none}
.puchip{display:flex;align-items:center;gap:8px;padding:3px 10px;border:1px solid color-mix(in srgb,var(--item) 60%,transparent);background:color-mix(in srgb,var(--item) 12%,transparent);transform:skewX(-12deg)}
.puchip > *{transform:skewX(12deg)}
.puchip .sw{display:block;width:6px;height:16px;background:var(--item)}
.puchip .nm{font-family:var(--fd);font-weight:700;font-size:14px;letter-spacing:.14em;color:var(--item)}
.puchip b{font-family:var(--fd);font-weight:700;font-size:20px;line-height:1;color:var(--num)}
.puchip.on{border-color:var(--item);box-shadow:0 0 16px -6px var(--item)}
.puchip{white-space:nowrap}.puchip .sel{font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.08em;color:var(--item);opacity:.8}   /* A56: SELECT toggles the trigger */
.ammo{position:absolute;right:36px;bottom:32px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ammo .nums{display:flex;align-items:baseline;gap:8px}
.ammo .mag{font-family:var(--fd);font-style:italic;font-weight:700;font-size:84px;line-height:.8;text-shadow:0 0 24px color-mix(in srgb,var(--glow) 50%,transparent)}
.ammo .mag.warn{color:var(--warn);text-shadow:0 0 24px rgba(255,176,32,.6)}
.ammo .res{font-family:var(--fd);font-weight:600;font-size:26px;color:var(--mut);display:flex;align-items:center}
/* Bench 2026-09-17: NOT ENOUGH ENERGY is now a secondary note, never a second big prompt beside
   OUT OF ENERGY/RECHARGE -- one small line under the digits, right-aligned like the rest of the column. */
.ammo .enote{font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--warn)}
.pips{display:flex;gap:4px}
/* `> i`, not `i`: this styles the discrete bullet pips only (direct children of #pips). A descendant
   `.pips i` also matched the ammo/energy bar's OWN fill `<i>` two levels down (`.pips > .bar > i`) at equal
   specificity, and — being later in the stylesheet — won, forcing that fill to a fixed 20px box-border-box
   height instead of the `height:100%` `.bar > i` gives it. Since its container's content-box (after the
   frame's own border+padding) is only 14px tall, the fill overflowed the frame by ~3px at the bottom
   (bench 2026-09-17, Tony: "the segment pips do not fit inside the energy bar"). Scoping to a direct child
   fixes both the energy bar AND the big-mag ammo bar the same bug quietly broke. */
.pips > i{width:8px;height:20px;background:var(--num);transform:skewX(-14deg)}
.pips > i.spent{opacity:.25}.pips > i.warn{background:var(--warn)}
/* Bench 2026-09-17: past AMMO_PIP_MAX (hud.js) rounds no longer read as individual bullets, so the
   gauge becomes one continuous bar instead — the exact count is still the digits beside it. */
.pips .bar.ammobar{height:20px;width:180px;transform:skewX(-14deg)}
.pips .bar.ammobar>i{background:var(--num);box-shadow:none}
.pips .bar.ammobar.warn>i{background:var(--warn)}
/* Bench 2026-09-17: an energy weapon's magazine is a charge, not rounds (isEnergyWeapon in hud.js) — a
   segmented "cell" fill instead of the ammo bar's solid one, so the two gauges never look the same. */
.pips .bar.energy{height:20px;width:180px;transform:skewX(-14deg);border-color:var(--glow)}
.pips .bar.energy>i{background:repeating-linear-gradient(90deg,var(--glow) 0 18px,transparent 18px 22px);box-shadow:0 0 10px color-mix(in srgb,var(--glow) 55%,transparent)}
.pips .bar.energy.warn>i{background:repeating-linear-gradient(90deg,var(--warn) 0 18px,transparent 18px 22px);box-shadow:0 0 10px rgba(255,176,32,.6)}
/* Bench 2026-09-17: "25% /80" read as a percentage beside a round count on a weapon with no rounds. An
   energy weapon's `#res` now holds one pill per FULL spare cell, plus a dimmer half-filled pill for a part
   cell (hud.js `_resText`) — never digits. A bullet weapon is untouched: `#res` stays plain `/reserve` text. */
.res .cells{display:flex;gap:4px}   /* 4px, not 3: at 9px wide, three pills a hair apart read as one segmented bar */
/* Bench 2026-09-18 (Tony), second pass: "i like the amber pill", then "it still needs polish". A spare
   charge is an OBJECT, and an object does not change material when it empties. So the casing, the cap and
   the highlight belong to `.cell` and never move; the only thing `.partial` changes is how far the charge
   stands up inside it. Amber also keeps it clear of the cyan readout beside it.
   The charge rises from the BASE (180deg), which is what separates a canister from the horizontal bar
   above it; `--fill` defaults to 100%, so a full canister and a part-full one are the same rule. */
.res .cells .cell{position:relative;overflow:hidden;width:9px;height:17px;border-radius:3px;border:1px solid color-mix(in srgb,var(--warn) 80%,transparent);background:linear-gradient(180deg,transparent 0 calc(100% - var(--fill,100%)),color-mix(in srgb,var(--warn) 90%,#000) calc(100% - var(--fill,100%)) 100%),#150d01;box-shadow:0 0 5px color-mix(in srgb,var(--warn) 35%,transparent)}
.res .cells .cell::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:color-mix(in srgb,var(--warn) 85%,#fff);border-bottom:1px solid rgba(0,0,0,.45)}   /* the cap: metal, so it stays lit on an almost empty canister */
.res .cells .cell::after{content:'';position:absolute;left:1px;top:5px;bottom:2px;width:2px;border-radius:1px;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.05))}   /* the highlight is on the glass, not on the charge */
.res .cells .cell.partial{box-shadow:0 0 3px color-mix(in srgb,var(--warn) 20%,transparent)}   /* a dimmer glow, never a dimmer object */
/* Bench 2026-09-17 (match 592e444eff): the build-up bar for a weapon that heats, shown only once heat > 0
   has been seen this life (hud.js `_heatBar`/`heatEverSeen`) — a weapon that never heats never draws one. */
.heat{height:5px;width:140px;background:var(--plate2);border:1px solid var(--edge);margin-top:2px}
.heat>i{display:block;height:100%;background:var(--num);width:0;transition:width .1s}
.heat.hot>i{background:var(--bad);box-shadow:0 0 8px rgba(255,60,60,.6)}
/* The full-frame OVERHEAT takeover (Tony: large and unmissable, but never over the vitals/ammo readout —
   both live in the bottom corners, this sits high, and is translucent besides). `pointer-events:none`
   throughout: it must never block a tap. `#frame *{animation:none!important}` under prefers-reduced-motion
   (line ~346) already gives this a static glow for free — nothing extra to write here for that.
   Bench review 2026-09-19: at 63% the word sat under the centre reticle slot, which is fine on its own, but
   a Toxin Rifle smoke tell (`.aimfx`, S53) also lives in that slot and is tall enough (word + sub-line +
   countdown + clear-bar) to run into the word when both fire together (measured ~25px at 891x411). The word
   moves to 74%: still well clear of the vitals/ammo columns (they sit off to the sides, not below it), and
   `.aimfx.tight` (below) drops its own height a little from the other side so the gap holds at every
   viewport this suite checks. */
.heatvig{position:absolute;inset:0;box-shadow:inset 0 0 170px -20px rgba(255,120,20,.55);animation:heatpulse 1.1s infinite;pointer-events:none}
.heatword{position:absolute;left:50%;top:74%;transform:translate(-50%,-50%);font-family:var(--fd);font-style:italic;font-weight:700;font-size:40px;letter-spacing:.3em;color:var(--warn);text-shadow:0 0 30px rgba(255,140,20,.7);pointer-events:none;animation:heatpulse 1.1s infinite;white-space:nowrap}
@keyframes heatpulse{0%,100%{opacity:.78}50%{opacity:1}}
.reload.hot{background:var(--bad);color:#fff}
/* Field 2026-08-30: at 11px muted this was unreadable at a glance and Tony could not tell which
   weapon was equipped. It is primary information, so it is sized like primary information. */
.ammo .wn{font-family:var(--fd);font-weight:700;font-size:24px;letter-spacing:.14em;color:var(--ink);display:flex;align-items:baseline;gap:8px;text-shadow:0 0 16px color-mix(in srgb,var(--glow) 35%,transparent)}
.ammo .wn .slot{font-size:11px;font-weight:600;letter-spacing:.22em;color:var(--mut)}
/* ALT weapon swap: the gun will not fire until it finishes, so say so, centre-screen and unmissable. */
.swapping{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:6;pointer-events:none}
.swapping .big{font-family:var(--fd);font-style:italic;font-weight:700;font-size:52px;letter-spacing:.06em;color:var(--warn);text-shadow:0 0 30px rgba(255,176,32,.55);animation:swapPulse .5s ease-in-out infinite alternate}
.swapping .sub{font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.26em;color:var(--mut)}
.swapping .track{width:210px;height:4px;background:rgba(255,255,255,.14);overflow:hidden}
.swapping .track i{display:block;height:100%;background:var(--warn);width:0}
@keyframes swapPulse{from{opacity:.55}to{opacity:1}}
.reload{transform:skewX(-12deg);background:var(--warn);color:#1a1200;font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:.26em;padding:3px 18px;animation:blink .7s infinite}
.reload.solid{animation:none}
/* Bench 2026-09-17: a reload gives nothing back once the reserve is also empty, so this reads OUT OF
   AMMO instead of RELOAD (never both) — see hud.js `_live()`'s `outOfAmmo`. */
.reload.out{background:var(--bad);color:#fff}
.firevig{position:absolute;inset:0;box-shadow:inset 0 0 140px -20px rgba(255,40,40,.55);animation:hudglow 1s infinite;pointer-events:none}
/* QA-03 (2026-09-23): TAKING FIRE ends at y=200 and the hit stack (.hit .hc) starts at y=212, a fixed 12 px gap, so the
   damage number can never be drawn over the word. The word sits ABOVE its dot, which stays where the reticle is. */
.takingfire{position:absolute;left:50%;bottom:calc(100% - 200px);transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:10px}
.takingfire .r{width:6px;height:6px;border:1px solid var(--bad);border-radius:50%}
.takingfire .t{font-family:var(--fd);font-style:italic;font-weight:700;font-size:22px;letter-spacing:.3em;color:var(--bad);text-indent:.3em;animation:blink .5s infinite}
.battwarn{position:absolute;top:96px;right:48px;font-size:11px;letter-spacing:.16em;color:var(--warn);font-weight:700}
/* F288: the engine's gun-health verdict used to stop at MC. Keep the player warning in the quiet lane below
   the header, above the reticle, and use words as well as colour. It never takes taps from the match HUD. */
.gunwarn{position:absolute;z-index:5;left:50%;top:100px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:14px;min-width:260px;max-width:calc(100% - 110px);padding:6px 16px 7px;border:1px solid currentColor;background:rgba(12,10,8,.9);pointer-events:none;text-align:center;white-space:nowrap}
.gunwarn b{font-family:var(--fd);font-style:italic;font-size:18px;letter-spacing:.18em;line-height:1}
.gunwarn span{font-size:14px;font-weight:700;letter-spacing:.1em;line-height:1.2}
.gunwarn.warn{color:var(--warn);box-shadow:0 0 18px rgba(255,176,32,.18)}
.gunwarn.danger{color:var(--bad);box-shadow:0 0 20px rgba(255,60,60,.25)}
/* This is a fault, not ambient HUD chrome: night mode still has to meet text contrast. The normal night
   tokens are intentionally dim enough for peripheral labels, but too dim for this corrective action. */
[data-env="night"] .gunwarn.warn{color:#e0a143;background:rgba(8,3,3,.96)}
[data-env="night"] .gunwarn.danger{color:#ef6868;background:rgba(8,3,3,.96)}
#frame[data-gun-health] #chips{display:none}   /* this fault replaces WEAPONS HOT / link pills in their lane */
/* S16: the poison pill sits just above the health it drains. Chartreuse, not the health green, and it names itself in
   words with a glyph, so colour is never the only signal. A plain fade-free fill: no pulse, no flash. */
.fxbar{position:absolute;left:36px;bottom:150px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
.fx.poison{display:grid;grid-template-columns:auto auto auto;grid-template-rows:auto auto auto;column-gap:8px;row-gap:2px;align-items:baseline;padding:6px 12px 7px;background:rgba(20,28,4,.82);border:1px solid #c8f03a;color:#e4ff7a;min-width:190px}
.fx.poison .g{font-size:20px;line-height:1;grid-row:1}
.fx.poison .k{font-family:var(--fd);font-style:italic;font-weight:700;font-size:20px;letter-spacing:.14em}
.fx.poison .t{font-family:var(--fd);font-weight:700;font-size:22px;justify-self:end}
.fx.poison .s{grid-column:1 / -1;font-size:11px;letter-spacing:.14em;font-weight:700;color:#c8f03a}
.fx.poison .drain{grid-column:1 / -1;display:block;height:4px;background:rgba(200,240,58,.2)}
.fx.poison .drain b{display:block;height:100%;background:#c8f03a}
/* S53: the smoke tell takes the reticle's place, because the reticle is exactly what the smoke has made useless.
   A grey haze plate, never a bright flash: the S53 row names it SMOKE, not a flashbang. */
.aimfx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 18px 9px;background:rgba(150,160,170,.28);border:1px solid rgba(220,228,236,.55);pointer-events:none;white-space:nowrap}
.aimfx .k{font-family:var(--fd);font-style:italic;font-weight:700;font-size:30px;letter-spacing:.3em;text-indent:.3em;color:#eef3f7;line-height:1}
.aimfx .s{font-size:12px;letter-spacing:.2em;font-weight:700;color:#d6dde3}
.aimfx .t{font-family:var(--fd);font-weight:700;font-size:20px;color:#eef3f7}
/* `.tight`: hud.js adds this alongside the reticle-slot tell whenever OVERHEAT is also showing (`_live()`'s
   `overheating`). The two full-screen takeovers share the same vertical lane, so the sub-line goes (the
   player still gets the reason word and the countdown) and the padding tightens, to hold the gap to the
   OVERHEAT word open at every viewport (`app/tools/screens.mjs`, "the word and the smoke tell do not
   overlap while both are up"). Day-only change of degree: night is already this compact everywhere else. */
.aimfx.tight{gap:2px;padding:5px 18px 6px}
.aimfx.tight .s{display:none}
.fx.poison .t small,.aimfx .t small{font-size:11px;letter-spacing:.14em;margin-left:4px;font-weight:700}
.aimfx .clr{display:block;width:160px;height:4px;background:rgba(238,243,247,.2)}
.aimfx .clr b{display:block;height:100%;background:#eef3f7}
/* (S21, 2026-09-12: the camera look-through is gone — the #cam layer, the `cam-on`/`#frame.cam` rules and
   the scrims that only existed under it went with the chip. The QR join scanner is unrelated and stays.) */

/* ============ QA lane B (2026-09-23): the live HUD ============ */
/* QA-02: values the gun no longer confirms. With the gun link down, HP, armour and ammo are the last numbers the gun sent:
   dimmed, and tagged STALE in words, so a frozen number never reads as live. An MC drop marks only what MC feeds (K, A). */
.staletag{align-self:center;font-family:var(--fl);font-style:normal;font-size:14px;font-weight:700;letter-spacing:.2em;padding:2px 8px;border:1.5px solid var(--bad);color:var(--bad);line-height:1.1;white-space:nowrap}
.gunstale .vitals .hp,.gunstale .vitals .sh,.gunstale .svm,.gunstale .vitals .bar,.gunstale .ammo .mag,.gunstale .ammo .res,.gunstale .ammo .pips,.gunstale .ammo .heat{opacity:.35;text-shadow:none;filter:grayscale(.6)}
.mcstale #st-K,.mcstale #st-A,.mcstale #st-ACC{opacity:.45}   /* only what MC feeds: D is this phone's own count (polish round 1) */
.pooltag{align-self:flex-start;font-family:var(--fl);font-size:14px;font-weight:700;letter-spacing:.14em;padding:3px 9px;border:1.5px solid var(--warn);color:var(--warn);background:rgba(20,12,0,.75);white-space:nowrap}   /* HUD QA R2-02 (F341): the gun cannot be killed; the host must FORCE RESPAWN */
.poolwrong .vitals .hp,.poolwrong .vitals .sh{color:var(--warn);text-shadow:none}
[data-env="night"] .pooltag{border-color:#c98a2e;color:#c98a2e;background:#000}
[data-env="night"] .poolwrong .vitals .hp,[data-env="night"] .poolwrong .vitals .sh{color:#c98a2e}
.stats .staletag{font-size:11px;padding:1px 6px}
/* the link-lost bar on the live HUD: solid red, 16 px, steady (hud.js `_chips`, `.gunlost`) */
.pill.bad.gunlost{animation:none;font-size:16px;letter-spacing:.16em;padding:8px 22px;background:var(--bad);border-color:var(--bad);color:#1a0404;position:relative}
.chipbar button.pill{position:relative}
.chipbar button.pill::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;transform:translateY(-50%);height:56px}   /* QA-11: 56 frame px tall = 44 px after the SE 0.79 scale */
.clockplate::after,.ident::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;transform:translateY(-50%);height:56px}
/* QA-06/QA-10: low HP says so in words too, in both skins (at night the number is red anyway) */
.lowtag{align-self:center;font-family:var(--fl);font-style:normal;font-size:14px;font-weight:700;letter-spacing:.2em;padding:2px 8px;background:var(--bad);color:#1a0404;line-height:1.1}
/* 2026-09-19 respawn rules: a station respawn's 2 s visible protection, in the reticle's slot */
.spawnshield{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 20px 9px;border:1.5px solid var(--shield);background:color-mix(in srgb,var(--shield) 16%,rgba(3,6,10,.8));pointer-events:none;white-space:nowrap}
.spawnshield .k{font-family:var(--fd);font-style:italic;font-weight:700;font-size:28px;letter-spacing:.24em;text-indent:.24em;color:var(--shield);line-height:1}
.spawnshield .s{font-size:12px;letter-spacing:.2em;font-weight:700;color:var(--num)}
/* F15: an EMP stun, the gun disarmed; takes the centre slot over smoke and recoil */
.aimfx.stun{background:rgba(255,176,32,.16);border-color:var(--warn)}
.aimfx.stun .k,.aimfx.stun .t{color:var(--warn)}
/* ============ night ============ */
[data-env="night"] .clockplate{border:0;background:none;top:28px}
[data-env="night"] .clockplate .t{font-size:22px;font-weight:600;color:var(--num);text-shadow:none}   /* QA-22: --mut measured 2.7:1; --num is 4.5:1 */
[data-env="night"] .clockplate .m,[data-env="night"] .ident,[data-env="night"] .reticle{display:none}
/* Bench 2026-09-17: `.pips` itself must NOT go with the list above — it is also the ammo/energy bar's
   container, and the bar has to keep reading at night (Tony). Only the discrete bullet-pip `<i>` children
   declutter; a `.bar` (ammo or energy) inside `.pips` is a direct child `<div>`, never matched by `> i`. */
[data-env="night"] .pips > i{display:none}
/* The bar's own night look: flat like the HP/armor strips (no skew, no border-box frame), but it keeps its
   own colour coding (glow/num, not health) so it never reads as a vitals bar. Selectors here out-specify
   the day rules (`[data-env="night"]` + 3 classes) so nothing is left to an accidental cascade order. */
[data-env="night"] .pips .bar.ammobar,[data-env="night"] .pips .bar.energy{height:6px;width:140px;transform:none;border:0;padding:0;background:#120505}
[data-env="night"] .pips .bar.ammobar>i,[data-env="night"] .pips .bar.energy>i{background:var(--num);box-shadow:none}
[data-env="night"] .pips .bar.ammobar.warn>i,[data-env="night"] .pips .bar.energy.warn>i{background:var(--warn)}
/* The reserve canisters and the heat bar read the same dim palette as everything else at night — no glow bloom.
   Bench 2026-09-18: the old night rule painted a part-full canister at a HARD-CODED 50%, so 3 rounds and 39
   looked identical — the day bug Tony reported, still live behind this selector. It reads `--fill` too now. */
[data-env="night"] .res .cells .cell{background:linear-gradient(180deg,transparent 0 calc(100% - var(--fill,100%)),var(--num) calc(100% - var(--fill,100%)) 100%),#0d0303;border-color:var(--num);box-shadow:none}
[data-env="night"] .res .cells .cell::before{background:var(--num);border-bottom-color:rgba(0,0,0,.6)}   /* the cap needs its dark seam at night too, or a full canister is just a red rectangle */
[data-env="night"] .res .cells .cell::after{background:linear-gradient(180deg,rgba(255,255,255,.2),transparent)}
[data-env="night"] .res .cells .cell.partial{box-shadow:none}
[data-env="night"] .heat{border-color:var(--edge)}
[data-env="night"] .heat>i{background:var(--num);box-shadow:none}
[data-env="night"] .heat.hot>i{background:var(--num);box-shadow:none}
/* The OVERHEAT takeover stays VISIBLE at night (unlike `.firevig`, which night just turns off) but drops to
   the dim night palette — no bright flash, and (matching the "light discipline" rule already applied to
   `.swapping .big` above) no pulse either: a pulsing glow would locate the player from a distance. */
[data-env="night"] .heatvig{box-shadow:inset 0 0 70px -10px var(--num);animation:none}
/* Bench 2026-09-17: `.reload.hot`/`.reload.out` were still solid bright red with white text at night --
   the one light-discipline miss in this block. Dark fill, `var(--num)` text, no glow, same as everywhere else here. */
[data-env="night"] .reload.hot,[data-env="night"] .reload.out{background:#2a0c0c;color:var(--num)}
/* Bench 2026-09-17: the plain RELOAD/RECHARGE prompt (no `.hot`/`.out`) still blinked bright amber at
   0.7 s -- the same light-discipline miss as the line above, for the one case it missed. This selector
   is less specific than `.reload.hot`/`.reload.out` (one class vs two), so it never overrides them. */
[data-env="night"] .reload{background:#2a0c0c;color:var(--num);animation:none}
/* Bench 2026-09-17: the word sat at top 26%, right across the chip bar (top 100 px), so WEAPONS HOT covered its
   centre. At 74% (moved from 63% on 2026-09-19, see the comment above `.heatword`) it sits below the reticle
   and TAKING FIRE slot, between the vitals and ammo columns (both off to the side, never under it). */
[data-env="night"] .heatword{color:var(--num);text-shadow:none;font-size:22px;animation:none}
/* S16/S53 at night: both tells stay (a player must still know why they are dying or missing) but in the dim red
   palette on a near-black fill, no glow, no pulse, like the OVERHEAT word above. */
[data-env="night"] .fx.poison{background:#120505;border-color:var(--edge);color:var(--num)}
[data-env="night"] .fx.poison .s{color:var(--mut)}
[data-env="night"] .fx.poison .drain,[data-env="night"] .aimfx .clr{background:#2a1010}
[data-env="night"] .fx.poison .drain b,[data-env="night"] .aimfx .clr b{background:var(--num)}
[data-env="night"] .aimfx{background:#120505;border-color:var(--edge)}
[data-env="night"] .aimfx .k{font-size:22px;color:var(--num)}
[data-env="night"] .aimfx .s{color:var(--mut)}
[data-env="night"] .aimfx .t{color:var(--num)}
/* night ops strips the chrome, but which gun you are holding is not chrome — keep it, unlit */
[data-env="night"] .ammo .wn{font-size:17px;color:var(--num);text-shadow:none}
[data-env="night"] .ammo .wn .slot{display:none}
/* night ops is light discipline: a 52px pulsing amber overlay would locate the player */
[data-env="night"] .swapping .big{font-size:22px;color:var(--num);text-shadow:none;animation:none}
[data-env="night"] .swapping .sub,[data-env="night"] .swapping .track{display:none}
[data-env="night"] .vitals .hp{font-style:normal;font-size:76px;text-shadow:none;animation:none;color:var(--num)}
[data-env="night"] .vitals .sh{font-size:30px;color:var(--armor);text-shadow:none}   /* QA-22: the armour number stays at night */
[data-env="night"] .vitals .sh.zero{color:var(--mut)}
[data-env="night"] .bar{height:5px;transform:none;border:0;padding:0;background:#120505}
[data-env="night"] .bar > i{background:var(--health);box-shadow:none}
[data-env="night"] .bar.armor{height:4px;width:70%}[data-env="night"] .bar.armor > i{background:var(--armor)}
/* A56 at night: the item's colour gives way to the dim red, nothing glows, the ring is flat */
[data-env="night"] .puhint .pu,[data-env="night"] .puchip{--item:var(--num)!important}   /* R2-12: the station hints read at 4.5:1 */
[data-env="night"] .puhint .pu{background:#0d0303;border-color:#3a1414}[data-env="night"] .puring{background:conic-gradient(#c9484a calc(var(--p) * 360deg),#2a1010 0)}
[data-env="night"] .puchip{background:transparent;border-color:#3a1414;box-shadow:none}
[data-env="night"] .ammo .mag{font-style:normal;font-size:76px;text-shadow:none;color:var(--num)}
[data-env="night"] .ammo .res{font-size:20px;color:var(--num)}   /* QA-22: "/384" was --mut, 2.7:1 */
[data-env="night"] .stats{display:flex;top:30px;left:36px;right:auto;bottom:auto;font-size:11px;letter-spacing:.24em}   /* was stacked on .ammo's corner (brx-opus night audit 2026-08-26) */
.nightlab{display:none;position:absolute;bottom:34px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.34em;color:var(--mut);font-weight:600}
[data-env="night"] .nightlab{display:block}
[data-env="night"] .hplab{display:inline;font-size:11px;letter-spacing:.24em;color:var(--mut);font-weight:600}
.hplab{display:none}

/* ============ moments (overlay) ============ */
.mo{position:absolute;inset:0}
.tminus{background:#04070c}
.tminus .hz{position:absolute;left:0;right:0;height:26px;background:repeating-linear-gradient(-45deg,var(--warn) 0 22px,#0a0a0a 22px 44px);opacity:.9;animation:hzin .25s ease-out}
.tminus .hz.t{top:0}.tminus .hz.b{bottom:0}
.tminus .glow{position:absolute;inset:0;box-shadow:inset 0 0 160px -40px var(--team)}
.tminus .c{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);display:flex;align-items:center;gap:44px}
.tminus .lab{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tminus .lab .h{font-family:var(--fd);font-style:italic;font-weight:700;font-size:26px;letter-spacing:.3em;color:var(--warn);white-space:nowrap}
.tminus .lab .s{font-size:12px;letter-spacing:.2em;color:var(--mut);font-weight:600;white-space:nowrap}

   DOWN) and HILL CAPTURED / HILL LOST (hud.js `_co`). A short band under the clock, clear of the vitals and the ammo,
   so the live HUD stays readable behind it. The name is the headline; --co says who went down. */
.co{pointer-events:none}

.down{background:radial-gradient(ellipse 120% 90% at 50% 45%,#160709 0%,#0b0305 60%,#040102 100%);animation:redflood .3s ease-out}

.down .ghost .l{position:absolute;left:36px;bottom:32px;font-family:var(--fd);font-style:italic;font-weight:700;font-size:84px;line-height:.8}
.down .ghost .r{position:absolute;right:36px;bottom:32px;font-family:var(--fd);font-style:italic;font-weight:700;font-size:84px;line-height:.8}

/* scanner mode: the title slowly alternates DOWN ⇄ RESPAWN AT STATION (a 6 s crossfade cycle — teaches the mechanic, far below any flicker band) */
.down .tt{position:relative;display:block;height:64px;min-width:260px}
.down .tt .t{position:absolute;right:0;top:0;line-height:1;white-space:nowrap;animation:downA 6s ease-in-out infinite}

.down .n{font-family:var(--fd);font-style:italic;font-weight:700;font-size:170px;line-height:1.24;animation:heartbeat 1s infinite;text-indent:-.06em}   /* text-indent, not a transform (the heartbeat owns that) and not a margin (a centred flex item only takes half of one): the italic face leans INSIDE its fixed .d cells, so the ink sat ~19px right of the label under it. The element box — and so the F115 width step — is untouched. */   /* F115: line-height .8 stood the glyphs 73px taller than their own box, so the digits sat on the label under them. 1.24 IS the glyph box. */
.down .n .d{display:inline-block;width:.56em;text-align:center;font-style:inherit;font-weight:inherit}   /* F115: `font-variant-numeric:tabular-nums` is a LIE in this face — "11" measured 113px and "88" 178px, so the centred column re-laid-out on every tick UNDER a running transform animation and the digits tore. One fixed-width cell per digit, wider than the widest glyph. */

.gunlocked .wash{position:absolute;inset:0;box-shadow:inset 0 0 180px -28px rgba(255,45,45,.52)}

/* RELOADING takeover (#15): the gun refuses fire until the mag is back; the HUD says so, big, for the weapon's reload time. */
.reloading{background:rgba(3,5,10,.82);animation:hitin .12s ease-out;pointer-events:none}

.hit{pointer-events:none}
.hit .vig{position:absolute;inset:0;box-shadow:inset 0 0 200px -20px rgba(255,40,40,.85);background:radial-gradient(ellipse 130% 100% at 50% 50%,transparent 45%,rgba(120,0,0,.35) 100%);animation:hitin .12s ease-out}

   a small LAST HIT line until 5 s. The hit flash itself is gone in 700 ms. */
.hitwpn{pointer-events:none}
.hitwpn .hw{position:absolute;top:296px;left:50%;transform:translateX(-50%);font:700 17px var(--fl);letter-spacing:.08em;color:var(--num);text-shadow:0 1px 3px #000;white-space:nowrap}
