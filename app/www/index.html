<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>BRX Combat HUD</title>
<!-- TODO(field): self-host these two faces (no internet on the field) — see app/README.md -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,600;0,700;1,600;1,700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ tokens (Phone HUD v2 holo theme) ============ */
:root{
  /* team-red is a crimson-rose, hue-shifted off the alarm red (--bad #ff5252) so a red-team player's accents don't read as danger (design review #14) */
  --team-blue:#3a86ff;--team-yellow:#ffd23f;--team-red:#f43f5e;--team-green:#2ecc71;
  --team:var(--team-blue);--team-ink:#04121e;
  --num:#eef9ff;--glow:#5fd6ff;--mut:#7fa0b8;
  --plate:rgba(12,28,44,.85);--plate2:rgba(4,12,20,.9);--edge:#2a4e6e;
  --health:#39e07c;--armor:#7fd4ff;--warn:#ffb020;--bad:#ff5252;--ok:#39e07c;
  --fd:'Saira Condensed',sans-serif;--fl:'Chakra Petch',sans-serif;
  --bg:radial-gradient(ellipse 120% 90% at 50% 45%,#0b1220 0%,#05080d 60%,#02040a 100%);
}
[data-env="night"]{--num:#b23b3b;--glow:transparent;--mut:#5a1f1f;--plate:transparent;--plate2:transparent;--edge:#1a0a0a;
  --health:#7a3a3a;--armor:#7a5a1f;--team:#5a2222;--team-ink:#000;--warn:#7a5a1f;--bad:#b23b3b;--ok:#4a6b2f;--bg:#000}
[data-team="blue"]{--team:var(--team-blue);--team-ink:#04121e}
[data-team="yellow"]{--team:var(--team-yellow);--team-ink:#1a1400}
[data-team="red"]{--team:var(--team-red);--team-ink:#1a0404}
[data-team="green"]{--team:var(--team-green);--team-ink:#041a0c}
[data-env="night"][data-team]{--team:#5a2222;--team-ink:#000}
[data-env="night"] .plate{background:#0a0303;border-color:#3a1414}[data-env="night"] .plate.slot .thumb{border-color:#3a1414}   /* the kit stays readable at night (#24) */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#030407;color:var(--num);font-family:var(--fl);overflow:hidden;overscroll-behavior:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#030407}
#frame{position:relative;flex:0 0 844px;width:844px;height:390px;transform-origin:center center;overflow:hidden;background:var(--bg);color:var(--num)}   /* flex:0 0 — #stage is a flex row and a phone narrower than 844 CSS px shrank the frame BEFORE scaling it, reflowing every screen (review 2026-09-03 #6/#7/#13/#18/#22) */
#frame *{scrollbar-width:none}#frame *::-webkit-scrollbar{display:none}#diag,#diag *{scrollbar-width:auto}#diag::-webkit-scrollbar,#diag *::-webkit-scrollbar{display:block}   /* the desktop diagnostics panel keeps its scrollbars */   /* touch UI: desktop scrollbars ate 15px inside every scroller and wrapped rows (#2/#10) */   /* color resolved INSIDE the frame so night's --num applies to inherited text */
html.cam-on,html.cam-on body{background:transparent!important}
#frame.cam{background:transparent}
#hud,#overlay,#chips,#cam{position:absolute;inset:0}
#cam{z-index:0;background:transparent;display:none}
#frame.cam #cam{display:block}
#hud{z-index:1}#overlay{z-index:3;pointer-events:none}#chips{z-index:4;pointer-events:none}
#diag{z-index:6}
.tab{font-variant-numeric:tabular-nums}
.fd{font-family:var(--fd)}
.it{font-style:italic;font-weight:700}
.skew{transform:skewX(-12deg)}.unskew{display:inline-block;transform:skewX(12deg)}
.skew8{transform:skewX(-8deg)}.unskew8{display:block;transform:skewX(8deg)}
.skew6{transform:skewX(-6deg)}.unskew6{display:inline-block;transform:skewX(6deg)}
.skew10{transform:skewX(-10deg)}.unskew10{display:inline-block;transform:skewX(10deg)}
button{font-family:var(--fd);border:0;cursor:pointer;color:inherit;background:none;padding:0}
button:active{filter:brightness(1.15)}

/* ============ ambient ============ */
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 4px);pointer-events:none}
.edgeglow{position:absolute;inset:0;box-shadow:inset 0 0 120px -40px var(--team);pointer-events:none}
.strip{position:absolute;top:0;bottom:0;width:5px;background:linear-gradient(180deg,transparent,var(--team),transparent);pointer-events:none}
.strip.l{left:0}.strip.r{right:0}
[data-env="night"] .edgeglow,[data-env="night"] .strip,[data-env="night"] .scan{display:none}

/* ============ HUD alive ============ */
.clockplate{position:absolute;top:26px;left:50%;transform:translateX(-50%) skewX(-12deg);background:var(--plate);border:1px solid var(--edge);padding:4px 26px}
.clockplate .in{transform:skewX(12deg);display:flex;align-items:baseline;gap:10px}
.clockplate .t{font-family:var(--fd);font-weight:700;font-size:30px;letter-spacing:.04em;text-shadow:0 0 18px color-mix(in srgb,var(--glow) 55%,transparent)}
.clockplate .m{font-size:10px;letter-spacing:.24em;color:var(--mut);font-weight:600}
.ident{position:absolute;top:28px;left:34px;display:flex;align-items:center;gap:8px}
.ident .arrow{width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent;border-left:14px solid var(--team)}
.ident .cs{font-family:var(--fd);font-style:italic;font-weight:700;font-size:20px;letter-spacing:.1em}
.ident .sq{font-size:10px;letter-spacing:.2em;color:var(--team);font-weight:700}
.topright{position:absolute;top:26px;right:48px;display:flex;align-items:center;gap:16px;font-size:13px;color:var(--mut);font-weight:600;white-space:nowrap}
.topright .link{display:flex;align-items:center;gap:5px}
.topright button.mclink{font:inherit;color:inherit;letter-spacing:inherit;pointer-events:auto;position:relative;padding:0}
.topright button.mclink::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px}   /* the tap target; the visual stays a dot + label */
.topright .dot{width:9px;height:9px;background:var(--ok);border-radius:50%;box-shadow:0 0 8px var(--ok)}
.topright .dot.off{background:var(--bad);box-shadow:0 0 8px var(--bad);animation:blink .7s infinite}
.topright .dot.ws{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.batt{display:flex;align-items:center;gap:5px}
.batt .shell{width:24px;height:11px;border:1.5px solid var(--mut);border-radius:2px;position:relative;display:inline-block}
.batt .fill{position:absolute;inset:2px;background:var(--ok)}
.camchip{border:1px solid var(--edge);color:var(--mut);font-size:12px;font-weight:700;letter-spacing:.16em;padding:5px 14px;transform:skewX(-10deg);pointer-events:auto;min-height:32px;position:relative}
/* ≥44px glove-tap hit area without growing the 32px visual (in-element pseudo extends the click box) */
.camchip::after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:44px;min-width:44px}
.camchip.on{background:var(--glow);color:#04121e;border-color:var(--glow)}
.stats{position:absolute;top:64px;right:48px;display:flex;gap:18px;font-size:13px;letter-spacing:.08em;color:var(--mut);font-weight:700;align-items:baseline;white-space:nowrap}   /* legible at arm's length (#14): 13/22 instead of 12/15 */
.stats b{color:var(--num);font-family:var(--fd);font-size:22px;font-weight:700;margin-left:4px}
.stats b.mut{color:var(--mut)}
.stats .mc{color:var(--ok);font-size:11px;vertical-align:top;font-weight:700}
.reticle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:6px;height:6px;border:1px solid var(--mut);border-radius:50%;opacity:.55}
.vitals{position:absolute;left:36px;bottom:32px;display:flex;flex-direction:column;gap:7px;width:300px}
.vitals .nums{display:flex;align-items:baseline;gap:10px}
.vitals .hp{font-family:var(--fd);font-style:italic;font-weight:700;font-size:84px;line-height:.8;text-shadow:0 0 24px color-mix(in srgb,var(--health) 50%,transparent)}
.vitals .hp.low{color:var(--bad);text-shadow:0 0 28px rgba(255,60,60,.7);animation:blink 1s infinite}
.vitals .sh{font-family:var(--fd);font-weight:700;font-size:24px;color:var(--armor)}
.vitals .sh.zero{color:var(--mut)}
.bar{height:14px;transform:skewX(-18deg);background:var(--plate2);border:1px solid var(--edge);padding:2px}
.bar.low{border-color:var(--bad)}
.bar > i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--health) 0 22px,transparent 22px 26px);box-shadow:0 0 12px color-mix(in srgb,var(--health) 60%,transparent);transition:width .15s}
.bar.low > i{background:repeating-linear-gradient(90deg,var(--bad) 0 22px,transparent 22px 26px);box-shadow:0 0 12px rgba(255,60,60,.7)}
.bar.armor{height:9px;width:78%}
.bar.armor > i{background:repeating-linear-gradient(90deg,var(--armor) 0 34px,transparent 34px 38px);box-shadow:none}
.ammo{position:absolute;right:36px;bottom:32px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ammo .nums{display:flex;align-items:baseline;gap:8px}
.ammo .mag{font-family:var(--fd);font-style:italic;font-weight:700;font-size:84px;line-height:.8;text-shadow:0 0 24px color-mix(in srgb,var(--glow) 50%,transparent)}
.ammo .mag.warn{color:var(--warn);text-shadow:0 0 24px rgba(255,176,32,.6)}
.ammo .res{font-family:var(--fd);font-weight:600;font-size:26px;color:var(--mut)}
.pips{display:flex;gap:4px}
.pips i{width:8px;height:20px;background:var(--num);transform:skewX(-14deg)}
.pips i.spent{opacity:.25}.pips i.warn{background:var(--warn)}
/* Field 2026-08-30: at 11px muted this was unreadable at a glance and Tony could not tell which
   weapon was equipped. It is primary information, so it is sized like primary information. */
.ammo .wn{font-family:var(--fd);font-weight:700;font-size:24px;letter-spacing:.14em;color:var(--ink);display:flex;align-items:baseline;gap:8px;text-shadow:0 0 16px color-mix(in srgb,var(--glow) 35%,transparent)}
.ammo .wn .slot{font-size:10px;font-weight:600;letter-spacing:.22em;color:var(--mut)}
/* ALT weapon swap: the gun will not fire until it finishes, so say so, centre-screen and unmissable. */
.swapping{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:6;pointer-events:none}
.swapping .big{font-family:var(--fd);font-style:italic;font-weight:700;font-size:52px;letter-spacing:.06em;color:var(--warn);text-shadow:0 0 30px rgba(255,176,32,.55);animation:swapPulse .5s ease-in-out infinite alternate}
.swapping .sub{font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.26em;color:var(--mut)}
.swapping .track{width:210px;height:4px;background:rgba(255,255,255,.14);overflow:hidden}
.swapping .track i{display:block;height:100%;background:var(--warn);width:0}
@keyframes swapPulse{from{opacity:.55}to{opacity:1}}
.reload{transform:skewX(-12deg);background:var(--warn);color:#1a1200;font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:.26em;padding:3px 18px;animation:blink .7s infinite}
.reload.solid{animation:none}
.firevig{position:absolute;inset:0;box-shadow:inset 0 0 140px -20px rgba(255,40,40,.55);animation:hudglow 1s infinite;pointer-events:none}
.takingfire{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
.takingfire .r{width:6px;height:6px;border:1px solid var(--bad);border-radius:50%}
.takingfire .t{font-family:var(--fd);font-style:italic;font-weight:700;font-size:22px;letter-spacing:.3em;color:var(--bad);text-indent:.3em;animation:blink .5s infinite}
.battwarn{position:absolute;top:96px;right:48px;font-size:10px;letter-spacing:.16em;color:var(--warn);font-weight:700}
/* cam look-through */
#frame.cam .clockplate{background:rgba(4,8,14,.6)}
#frame.cam .scrim-t{position:absolute;top:0;left:0;right:0;height:80px;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
#frame.cam .scrim-b{position:absolute;bottom:0;left:120px;right:0;height:110px;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent)}
#frame.cam .ident,#frame.cam .topright,#frame.cam .stats,#frame.cam .vitals,#frame.cam .ammo{text-shadow:0 2px 10px rgba(0,0,0,.95)}
#frame.cam .bar{background:rgba(0,0,0,.5)}
#frame.cam .edgeglow,#frame.cam .strip,#frame.cam .scan{display:none}
.scrim-t,.scrim-b{display:none}#frame.cam .scrim-t,#frame.cam .scrim-b{display:block}

/* ============ night ============ */
[data-env="night"] .clockplate{border:0;background:none;top:28px}
[data-env="night"] .clockplate .t{font-size:22px;font-weight:600;color:var(--mut);text-shadow:none}
[data-env="night"] .clockplate .m,[data-env="night"] .ident,[data-env="night"] .topright,[data-env="night"] .reticle,[data-env="night"] .pips,[data-env="night"] .firevig,[data-env="night"] .takingfire{display:none}
/* night ops strips the chrome, but which gun you are holding is not chrome — keep it, unlit */
[data-env="night"] .ammo .wn{font-size:17px;color:var(--num);text-shadow:none}
[data-env="night"] .ammo .wn .slot{display:none}
/* night ops is light discipline: a 52px pulsing amber overlay would locate the player */
[data-env="night"] .swapping .big{font-size:22px;color:var(--num);text-shadow:none;animation:none}
[data-env="night"] .swapping .sub,[data-env="night"] .swapping .track{display:none}
[data-env="night"] .vitals .hp{font-style:normal;font-size:76px;text-shadow:none;animation:none;color:var(--num)}
[data-env="night"] .vitals .sh{display:none}
[data-env="night"] .bar{height:5px;transform:none;border:0;padding:0;background:#120505}
[data-env="night"] .bar > i{background:var(--health);box-shadow:none}
[data-env="night"] .bar.armor{height:4px;width:70%}[data-env="night"] .bar.armor > i{background:var(--armor)}
[data-env="night"] .ammo .mag{font-style:normal;font-size:76px;text-shadow:none;color:var(--num)}
[data-env="night"] .ammo .res{font-size:20px}
[data-env="night"] .stats{display:flex;top:30px;left:36px;right:auto;bottom:auto;font-size:11px;letter-spacing:.24em}   /* was stacked on .ammo's corner (brx-opus night audit 2026-08-26) */
.nightlab{display:none;position:absolute;bottom:34px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.34em;color:var(--mut);font-weight:600}
[data-env="night"] .nightlab{display:block}
[data-env="night"] .hplab{display:inline;font-size:11px;letter-spacing:.24em;color:var(--mut);font-weight:600}
.hplab{display:none}

/* ============ moments (overlay) ============ */
.mo{position:absolute;inset:0}
.tminus{background:#04070c}
.tminus .hz{position:absolute;left:0;right:0;height:26px;background:repeating-linear-gradient(-45deg,var(--warn) 0 22px,#0a0a0a 22px 44px);opacity:.9;animation:hzin .25s ease-out}
.tminus .hz.t{top:0}.tminus .hz.b{bottom:0}
.tminus .glow{position:absolute;inset:0;box-shadow:inset 0 0 160px -40px var(--team)}
.tminus .c{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);display:flex;align-items:center;gap:44px}
.tminus .lab{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tminus .lab .h{font-family:var(--fd);font-style:italic;font-weight:700;font-size:26px;letter-spacing:.3em;color:var(--warn);white-space:nowrap}
.tminus .lab .s{font-size:12px;letter-spacing:.2em;color:var(--mut);font-weight:600;white-space:nowrap}
.tminus .n{font-family:var(--fd);font-style:italic;font-weight:700;font-size:230px;line-height:.8;text-shadow:0 0 60px color-mix(in srgb,var(--glow) 60%,transparent)}
.tminus .n.punch{animation:punch .45s ease-out}
.tminus .n.mm{font-size:150px}
.tminus .r{display:flex;flex-direction:column;gap:6px;align-items:center;white-space:nowrap}
.chip{background:var(--team);color:var(--team-ink);font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.14em;padding:4px 16px;transform:skewX(-12deg)}
.chip .unskew{display:inline-block;transform:skewX(12deg)}
.tminus .r .s{font-size:12px;letter-spacing:.2em;color:var(--mut);font-weight:600;text-align:center;white-space:nowrap}
.whiteout{position:absolute;inset:0;background:#fff;animation:whiteout .08s linear forwards}
.kill{background:radial-gradient(circle at 50% 42%,rgba(22,38,74,.9) 0%,rgba(6,10,20,.94) 55%,rgba(3,4,8,.97) 100%);animation:killin .18s ease-out;pointer-events:none}
.kill .rays{position:absolute;left:50%;top:44%;width:700px;height:700px;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--glow) 13%,transparent) 0deg 6deg,transparent 6deg 16deg);-webkit-mask-image:radial-gradient(circle,#000 0%,transparent 60%);mask-image:radial-gradient(circle,#000 0%,transparent 60%);animation:raysspin 30s linear infinite,burst .5s ease-out}
.kill .ring1{position:absolute;left:50%;top:44%;width:220px;height:220px;transform:translate(-50%,-50%);border:2px solid color-mix(in srgb,var(--glow) 60%,transparent);border-radius:50%;animation:ringpulse 2.4s ease-in-out infinite,ringgrow .6s ease-out}
.kill .ring2{position:absolute;left:50%;top:44%;width:340px;height:340px;transform:translate(-50%,-50%);border:1px solid color-mix(in srgb,var(--glow) 25%,transparent);border-radius:50%}
.kill .c{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.kill .elim{background:var(--warn);color:#1a1200;font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.26em;padding:3px 20px;transform:skewX(-12deg)}
.kill .k{font-family:var(--fd);font-style:italic;font-weight:700;font-size:96px;line-height:.82;letter-spacing:.04em;text-shadow:0 0 70px var(--glow),0 0 18px color-mix(in srgb,var(--glow) 70%,transparent);animation:slam .35s cubic-bezier(.2,1.4,.4,1),shimmer 1.2s .4s ease-in-out}
.kill .cf{font-family:var(--fd);font-weight:700;font-size:38px;letter-spacing:.52em;text-indent:.52em;color:var(--glow);text-shadow:0 0 30px var(--glow)}
.kill .bars{display:flex;gap:8px;margin-top:8px}
.kill .bars i{height:5px;transform:skewX(-24deg);display:block}
.kill .foot{position:absolute;bottom:40px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px}
.kill .vt{color:#1a1400;font-family:var(--fd);font-weight:700;font-size:14px;letter-spacing:.14em;padding:3px 14px;transform:skewX(-12deg)}
.kill .by{font-size:10px;letter-spacing:.26em;color:var(--mut);font-weight:600}
.kill.out{animation:hitout .3s ease-in forwards}
.down{background:radial-gradient(ellipse 120% 90% at 50% 45%,#160709 0%,#0b0305 60%,#040102 100%);animation:redflood .3s ease-out}
.down .wash{position:absolute;inset:0;box-shadow:inset 0 0 180px -30px rgba(255,40,40,.5)}
.down .ghost{display:none}
.down .recap{position:absolute;left:36px;right:36px;bottom:22px;display:flex;justify-content:center;align-items:flex-end;gap:56px;white-space:nowrap}
.down .recap .rc{display:flex;flex-direction:column;align-items:center;gap:4px}
.down .recap .rl{font-size:12px;letter-spacing:.26em;color:var(--mut);font-weight:700}
.down .recap .rv{font-size:12px;letter-spacing:.14em;color:var(--mut);font-weight:700;display:flex;align-items:baseline;gap:6px}
.down .recap .rv b{color:var(--num);font-family:var(--fd);font-size:22px;letter-spacing:.02em;font-weight:700}
.down .recap .tms{display:flex;gap:4px}
.down .recap .tm{display:inline-block;padding:3px 12px;transform:skewX(-12deg);font-size:12px;letter-spacing:.14em}.down .recap .tm .unskew{display:inline-block;transform:skewX(12deg)}
.down .recap .tm b{font-family:var(--fd);font-size:18px;color:inherit;margin-left:2px}
.down .recap .tm.mine{outline:2px solid var(--num);outline-offset:1px}
.down .ghost .l{position:absolute;left:36px;bottom:32px;font-family:var(--fd);font-style:italic;font-weight:700;font-size:84px;line-height:.8}
.down .ghost .r{position:absolute;right:36px;bottom:32px;font-family:var(--fd);font-style:italic;font-weight:700;font-size:84px;line-height:.8}
.down .c{position:absolute;top:46%;left:50%;transform:translate(-50%,-52%);display:flex;align-items:center;gap:48px}
.down .l2{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.down .t{font-family:var(--fd);font-style:italic;font-weight:700;font-size:64px;letter-spacing:.14em;color:var(--bad);text-shadow:0 0 40px rgba(255,60,60,.6)}
.down .kb{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.14em;color:var(--mut);font-weight:600}
.down .kb b{font-family:var(--fd);font-weight:700;padding:2px 12px;transform:skewX(-12deg);display:inline-block}
.down .n{font-family:var(--fd);font-style:italic;font-weight:700;font-size:190px;line-height:.8;animation:heartbeat 1s infinite}
.down .lab{font-size:12px;letter-spacing:.34em;color:var(--mut);font-weight:600;text-align:center;white-space:nowrap}
.redeploy{background:#04070c}
.redeploy .wipe{position:absolute;top:0;bottom:0;left:-8%;width:56%;background:linear-gradient(90deg,var(--team),color-mix(in srgb,var(--team) 40%,transparent));transform:skewX(-14deg);animation:wipein .28s ease-out}
.redeploy .slash{position:absolute;top:0;bottom:0;left:46%;width:3%;background:var(--num);opacity:.9;transform:skewX(-14deg)}
.redeploy .r{position:absolute;top:50%;left:55%;right:20px;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;animation:trackin .35s .15s both ease-out;min-width:0}
.redeploy .r .t{display:block;overflow:hidden;font-family:var(--fd);font-style:italic;font-weight:700;font-size:56px;letter-spacing:.06em;line-height:.9;text-shadow:0 0 40px color-mix(in srgb,var(--glow) 50%,transparent);white-space:nowrap;animation:slam .4s .1s both cubic-bezier(.2,1.4,.4,1)}
.redeploy .kit{display:flex;gap:10px;margin-top:6px;animation:kitin .35s .4s both ease-out}
@keyframes kitin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.redeploy .kit .ki{display:flex;align-items:center;gap:8px;border:1px solid var(--edge);background:var(--plate);padding:4px 10px 4px 4px;min-width:0}
.redeploy .kit .ki .th{width:54px;height:34px;background-size:cover;background-position:center;border:1px solid var(--edge);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--glow)}
.redeploy .kit .ki .th svg{width:24px;height:24px}
.redeploy .kit .ki .kk{font-size:10px;letter-spacing:.24em;color:var(--mut);font-weight:700}
.redeploy .kit .ki .kn{font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.redeploy .beam{position:absolute;top:0;bottom:0;width:120px;left:-20%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-14deg);animation:beam .55s .1s ease-out both;pointer-events:none}
@keyframes beam{from{left:-20%;opacity:1}to{left:110%;opacity:0}}
.redeploy .r .h{font-family:var(--fd);font-weight:600;font-size:18px;letter-spacing:.3em;color:var(--ok)}
.redeploy .r .s{font-size:12px;letter-spacing:.16em;color:var(--mut);font-weight:600}
.redeploy .l{position:absolute;top:50%;left:10%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;color:var(--team-ink)}
.redeploy .l .cs{font-family:var(--fd);font-style:italic;font-weight:700;font-size:34px;letter-spacing:.1em}
.redeploy .l .sq{font-family:var(--fd);font-weight:700;font-size:14px;letter-spacing:.26em}
.redeploy.out{animation:hitout .3s ease-in forwards}
/* RELOADING takeover (#15): the gun refuses fire until the mag is back; the HUD says so, big, for the weapon's reload time. */
.reloading{background:rgba(3,5,10,.82);animation:hitin .12s ease-out;pointer-events:none}
.reloading .c{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:12px}
.reloading .t{font-family:var(--fd);font-style:italic;font-weight:700;font-size:72px;letter-spacing:.1em;color:var(--warn);text-shadow:0 0 40px rgba(255,176,32,.5);line-height:.9;white-space:nowrap}
.reloading .s{font-size:12px;letter-spacing:.3em;color:var(--mut);font-weight:700;white-space:nowrap}
.reloading .track{width:360px;height:10px;background:rgba(255,255,255,.1);border:1px solid var(--edge);transform:skewX(-14deg);overflow:hidden}
.reloading .track i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--warn) 0 18px,color-mix(in srgb,var(--warn) 55%,transparent) 18px 22px);width:0;transition:width .12s linear}
.reloading .n{font-family:var(--fd);font-weight:700;font-size:28px;color:var(--num);letter-spacing:.04em}
.reloading.out{animation:hitout .2s ease-in forwards}
[data-env="night"] .reloading{background:#000}[data-env="night"] .reloading .t{color:var(--num);text-shadow:none}[data-env="night"] .reloading .track i{background:var(--num)}
/* SWITCHING WEAPON takeover + the ACTIVE confirm (review 2026-09-04 #40). Same family as RELOADING. */
.switching{background:rgba(3,5,10,.82);animation:hitin .12s ease-out;pointer-events:none}
.switching .c{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:14px}
.switching .t{font-family:var(--fd);font-style:italic;font-weight:700;font-size:56px;letter-spacing:.1em;color:var(--warn);text-shadow:0 0 40px rgba(255,176,32,.5);line-height:.9;white-space:nowrap}
.switching .pair{display:flex;align-items:center;gap:22px}
.switching .arr{font-size:22px;color:var(--warn);letter-spacing:.1em;animation:blink 1s infinite}
.wt{display:flex;flex-direction:column;align-items:center;gap:4px;width:220px;padding:8px 10px 10px;border:1px solid var(--edge);background:var(--plate);transform:skewX(-8deg)}
.wt > *{transform:skewX(8deg)}
.wt .th{width:190px;height:72px;background-size:cover;background-position:center;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;color:var(--glow)}
.wt .th.none{color:var(--mut);font-size:28px}.wt .th.perk svg{width:40px;height:40px}
.wt .wl{font-size:10px;letter-spacing:.3em;color:var(--mut);font-weight:700;margin-top:4px}
.wt .wn{font-family:var(--fd);font-weight:700;font-size:20px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.wt.from{opacity:.45;filter:grayscale(.6)}
.wt.to{border-color:var(--warn);box-shadow:0 0 28px -8px var(--warn)}.wt.to .wl{color:var(--warn)}
.wt.on{border-color:var(--ok);box-shadow:0 0 34px -6px var(--ok)}.wt.on .wl{color:var(--ok)}
.switching .track{width:360px;height:10px;background:rgba(255,255,255,.1);border:1px solid var(--edge);transform:skewX(-14deg);overflow:hidden}
.switching .track i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--warn) 0 18px,color-mix(in srgb,var(--warn) 55%,transparent) 18px 22px);width:0;transition:width .12s linear}
.switched{background:rgba(3,5,10,.7);animation:hitin .1s ease-out;pointer-events:none}
.switched .c{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.switched .in{display:flex;flex-direction:column;align-items:center;gap:10px;animation:slam .3s cubic-bezier(.2,1.4,.4,1)}   /* the slam lives on an inner box so it cannot override the centring transform */
.switched .s{font-size:11px;letter-spacing:.3em;color:var(--ok);font-weight:700}
.switched.out{animation:hitout .25s ease-in forwards}
#frame[data-takeover="switch"] #chips{opacity:0}
[data-env="night"] .switching,[data-env="night"] .switched{background:#000}[data-env="night"] .switching .t{color:var(--num);text-shadow:none}
[data-env="night"] .wt .th{background-image:none!important;background:#000}[data-env="night"] .wt.to,[data-env="night"] .wt.on{box-shadow:none;border-color:var(--num)}
[data-env="night"] .switching .track i{background:var(--num)}
/* HIT TAKEN -- one fade in, one fade out. NEVER a repeating flash: this feedback lives on the
   phone precisely because holding the gun's LEDs needs ~30Hz repaints that strobe, and flicker in
   the 10-25Hz band is the photosensitive-epilepsy trigger range (experiment-log 2026-09-02). */
.hit{pointer-events:none}
.hit .vig{position:absolute;inset:0;box-shadow:inset 0 0 200px -20px rgba(255,40,40,.85);background:radial-gradient(ellipse 130% 100% at 50% 50%,transparent 45%,rgba(120,0,0,.35) 100%);animation:hitin .12s ease-out}
.hit .hc{position:absolute;top:66%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.hit .dmg{font-family:var(--fd);font-style:italic;font-weight:700;font-size:58px;line-height:.8;color:var(--bad);text-shadow:0 0 40px rgba(255,60,60,.7);animation:slam .28s cubic-bezier(.2,1.4,.4,1)}
.hit .src{font-family:var(--fd);font-weight:700;font-size:13px;letter-spacing:.2em;padding:3px 14px;transform:skewX(-12deg)}
.hit.out{animation:hitout .42s ease-in forwards}
/* GAINING a pool. Colour matches poolgauge.py so one mapping is learned across gun and HUD. */
.gain{pointer-events:none}
.gain .gv{position:absolute;inset:0;animation:hitin .14s ease-out}
.gain.health .gv{box-shadow:inset 0 0 170px -30px rgba(60,230,120,.7)}
.gain.armor  .gv{box-shadow:inset 0 0 170px -30px rgba(170,110,255,.7)}
.gain.shield .gv{box-shadow:inset 0 0 170px -30px rgba(60,220,230,.7)}
.gain .gc{position:absolute;top:66%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.gain .amt{font-family:var(--fd);font-style:italic;font-weight:700;font-size:48px;line-height:.8;animation:slam .3s cubic-bezier(.2,1.4,.4,1)}
.gain.health .amt{color:var(--ok);text-shadow:0 0 34px rgba(60,230,120,.6)}
.gain.armor  .amt{color:#b07cff;text-shadow:0 0 34px rgba(170,110,255,.6)}
.gain.shield .amt{color:#4fdce6;text-shadow:0 0 34px rgba(60,220,230,.6)}
.gain .lab{font-size:12px;letter-spacing:.34em;color:var(--mut);font-weight:600}
.gain.out{animation:hitout .5s ease-in forwards}
@keyframes hitin{from{opacity:0}to{opacity:1}}
@keyframes hitout{to{opacity:0}}
/* Night: keep the information, drop the glare. You must still know you are being shot. */
[data-env="night"] .hit .vig,[data-env="night"] .gain .gv{box-shadow:none;background:none}
[data-env="night"] .hit .dmg,[data-env="night"] .gain .amt{text-shadow:none}
/* Reduced motion: show the same information, without the transitions. */
/* `#frame`, not `.frame`: the element carries an ID and no such class exists, so the first
   version of this rule matched nothing at all and .takingfire kept blinking. */
@media (prefers-reduced-motion:reduce){#frame *,.mo,.mo *{animation:none!important;transition:none!important}.whiteout{display:none}}   /* without its fade the whiteout is a harder pop, not a gentler one (UX review 2026-09-03) */
/* Night: the shooter-team chip is set INLINE (a team colour), and inline styles win over CSS.
   Class-driven at night instead, so it stops being the brightest object on a black HUD. */
[data-env="night"] .hit .src,[data-env="night"] .down .recap .tm,[data-env="night"] .down .kb b{background:#2a0d0d!important;color:#ff8a8a!important;box-shadow:none}   /* inline day colours would be the brightest thing on a night screen */
[data-env="night"] .gain.armor .amt{color:#7a5aa8}
[data-env="night"] .gain.shield .amt{color:#3a8f96}
[data-env="night"] .mo{animation:none!important}
[data-env="night"] .kill,[data-env="night"] .whiteout{display:none}
[data-env="night"] .down{background:#000}[data-env="night"] .down .wash,[data-env="night"] .down .ghost{display:none}
[data-env="night"] .tminus{background:#000}[data-env="night"] .tminus .hz,[data-env="night"] .tminus .glow{display:none}
[data-env="night"] .redeploy .wipe,[data-env="night"] .redeploy .slash{display:none}

/* ============ setup screens ============ */
.idle .l{position:absolute;top:0;bottom:0;left:0;width:46%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px}
.idle .wm{font-family:var(--fd);font-style:italic;font-weight:700;font-size:54px;letter-spacing:.16em;text-indent:.16em}
.idle .wm b{color:var(--glow)}
.idle .sub{font-size:11px;letter-spacing:.4em;color:var(--mut);font-weight:600}
.bigbtn{height:60px;width:260px;background:var(--glow);color:#04121e;font-family:var(--fd);font-weight:700;font-size:20px;letter-spacing:.16em;transform:skewX(-12deg)}
.bigbtn .unskew{display:inline-block;transform:skewX(12deg)}
.bigbtn.ghost{background:transparent;border:1px solid var(--edge);color:var(--mut);height:44px;width:220px;font-size:14px}
.idle .r{position:absolute;top:0;bottom:0;right:0;width:54%;background:var(--plate2);border-left:1px solid var(--edge);padding:26px 36px 26px 26px;display:flex;flex-direction:column;gap:10px}
.idle .sc{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--glow);font-weight:600;letter-spacing:.14em}
.idle .sc i{width:8px;height:8px;background:var(--glow);border-radius:50%;animation:blink 1.2s infinite}
.tagrow{display:flex;justify-content:space-between;align-items:center;background:var(--plate);border:1px solid var(--edge);padding:12px 16px;transform:skewX(-6deg);pointer-events:auto;min-height:46px}
.tagrow.used{opacity:.55}
.tagrow .nm{display:inline-block;transform:skewX(6deg);font-family:ui-monospace,monospace;font-size:16px;font-weight:700}
.tagrow .nm b{color:var(--glow);font-weight:700}
.tagrow .sig{display:inline-flex;transform:skewX(6deg);align-items:flex-end;gap:2px}
.tagrow .sig i{width:4px;background:var(--edge);display:block}
.tagrow .sig i.on{background:var(--ok)}
.tagrow .sig b{color:var(--mut);font-size:11px;margin-left:6px;font-weight:700}
.tagrow .inuse{display:inline-block;transform:skewX(6deg);color:var(--warn);font-size:11px;font-weight:700;letter-spacing:.1em}
.idle .help{font-size:12px;color:var(--mut);line-height:1.5;margin-top:auto}
.idle .list{display:flex;flex-direction:column;gap:10px;overflow:hidden auto;max-height:230px;padding:0 4px}
.lobby .top{position:absolute;top:30px;left:36px;display:flex;flex-direction:column;gap:4px}
.lobby .cs{font-family:var(--fd);font-style:italic;font-weight:700;font-size:44px;letter-spacing:.08em;line-height:.9}
.lobby .row{display:flex;align-items:center;gap:8px}
.lobby .chip{font-size:12px;padding:2px 12px}
.lobby .gid{font-family:ui-monospace,monospace;font-size:12px;color:var(--mut)}
.lobby .plates{position:absolute;top:126px;left:36px;right:36px;display:flex;flex-wrap:wrap;gap:10px}
.plate{background:var(--plate);border:1px solid var(--edge);padding:10px 18px;transform:skewX(-8deg)}
.plate .in{transform:skewX(8deg)}
.plate .h{font-family:var(--fd);font-weight:700;font-size:22px;letter-spacing:.04em}
.plate .s{font-size:11px;color:var(--mut);letter-spacing:.14em;font-weight:600}
.lobby .foot{position:absolute;left:36px;right:36px;bottom:34px;display:flex;align-items:center;gap:20px}
.ready{flex:1;height:60px;background:var(--ok);color:#04120a;font-family:var(--fd);font-style:italic;font-weight:700;font-size:26px;white-space:nowrap;letter-spacing:.2em;transform:skewX(-10deg);box-shadow:0 0 40px -8px var(--ok)}
.ready .unskew{display:inline-block;transform:skewX(10deg)}
.ready.off{background:var(--plate);color:var(--num);border:1px solid var(--edge);box-shadow:none}
.ready.wait{background:var(--plate);color:var(--mut);border:1px solid var(--edge);box-shadow:none;font-size:20px}
.ready.wait.on{background:var(--ok);color:#04120a;border:none;box-shadow:0 0 40px -8px var(--ok)}
.lobby .note{font-size:13px;color:var(--mut);font-weight:600;max-width:200px;line-height:1.5}
.lobby .foot .note.join{max-width:230px;font-size:12px;line-height:1.4}
.lobby .tr{position:absolute;top:30px;right:48px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lobby .status{font-size:11px;letter-spacing:.2em;color:var(--mut);font-weight:600;text-align:right;white-space:nowrap}
.lobby .status b{color:var(--ok)}
.lobby .status .bad{color:var(--bad)}
.mcin{display:flex;gap:6px;align-items:center;pointer-events:auto}
.mcin input{width:236px;height:34px;background:var(--plate2);border:1px solid var(--edge);color:var(--num);font:14px ui-monospace,monospace;padding:0 10px}
.qrbtn{white-space:nowrap;width:auto;align-self:center;margin-top:0;height:34px;padding:0 14px;background:#131b26;color:#ffc947;border:1px solid #3a4a61;font:700 11px ui-monospace,monospace;letter-spacing:.22em}
.mcin button{height:34px;padding:0 12px;background:var(--glow);color:#04121e;font-size:13px;letter-spacing:.14em;font-weight:700;position:relative}
.mcin button::after,.qrbtn::after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:44px}   /* 44px tap rows on a 34px visual */
.qrbtn{position:relative}
.overbtn{position:absolute;pointer-events:auto}
.small{font-size:11px;letter-spacing:.16em;color:var(--mut);font-weight:600}

/* ============ chips / prompts ============ */
.chipbar{position:absolute;top:100px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;white-space:nowrap}
#frame[data-takeover="reload"] #chips{opacity:0}   /* the takeover owns the screen */
.plate.slot .s .nw{white-space:nowrap;letter-spacing:.06em}
.down .n.nn{font-size:96px;line-height:1;font-style:normal;animation:none;color:var(--mut)}   /* the ▣ glyph painted 49px below its line box and through the label */
#frame[data-screen="lobby"] .chipbar{top:98px;flex-direction:row;gap:8px}   /* the band between the callsign block and the plates */
#frame[data-screen="lo"] .chipbar{top:auto;bottom:70px;flex-direction:row;gap:8px}   /* loadout browser: over the faded list end, clear of tabs, filters and the action bar */
#frame[data-screen="panel"] .chipbar{top:2px;flex-direction:row;gap:8px}   /* briefing / result: the strip above the content */
#frame[data-screen="lo"] .pill,#frame[data-screen="panel"] .pill{font-size:10px;letter-spacing:.14em;padding:5px 12px}
#frame[data-screen="lobby"] .pill{font-size:10px;letter-spacing:.14em;padding:5px 12px}
#frame[data-screen="lobby"] button.pill{min-height:0;position:relative}#frame[data-screen="lobby"] button.pill::after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:44px}
.pill{font-size:11px;letter-spacing:.2em;font-weight:700;padding:4px 14px;transform:skewX(-10deg);background:var(--plate);border:1px solid var(--edge);color:var(--mut)}
.pill .unskew{display:inline-block;transform:skewX(10deg)}
/* a pill that is also a control: same look, real tap target (min 44px per the tap audit) */
button.pill{font-family:inherit;cursor:pointer;min-height:44px}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.bad{border-color:var(--bad);color:var(--bad);animation:blink 1.4s infinite}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.prompt{position:absolute;left:50%;top:140px;transform:translateX(-50%) skewX(-10deg);background:var(--warn);color:#1a1200;font-family:var(--fd);font-weight:700;padding:8px 28px;white-space:nowrap}
.prompt .unskew{display:flex;flex-direction:column;align-items:center;transform:skewX(10deg);line-height:1.1}
.prompt .pl{font-family:var(--fl);font-size:11px;letter-spacing:.3em;font-weight:700;opacity:.8}
.prompt .pi{font-size:26px;letter-spacing:.14em}
.infobtn{position:absolute;top:2px;right:2px;width:36px;height:36px;border:1px solid var(--edge);color:var(--mut);font:600 13px var(--fl);display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:5}
/* ≥44px tap area; the ⓘ visual stays 26px */
.infobtn::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px}
[data-env="night"] .infobtn{color:var(--mut);border-color:var(--edge)}

/* ============ diagnostics ============ */
#diag{position:absolute;top:0;right:0;bottom:0;width:60%;background:rgba(4,8,14,.96);border-left:1px solid var(--edge);padding:20px 24px;overflow:auto;font:11px/1.5 ui-monospace,monospace;color:var(--mut);display:none}
#diag.open{display:block}
#diag h3{margin:12px 0 4px;font:700 11px var(--fl);letter-spacing:.2em;color:var(--glow)}
#diag .kv{display:grid;grid-template-columns:150px 1fr;gap:2px 10px}
#diag .ok{color:var(--ok)}#diag .bad{color:var(--bad)}
#diag .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#diag .btns button{font:700 12px var(--fl);letter-spacing:.14em;padding:8px 14px;border:1px solid var(--edge);color:var(--num);min-height:40px}
#diag .btns button.danger{border-color:var(--bad);color:var(--bad)}
#diag pre{white-space:pre-wrap;word-break:break-all;margin:0;max-height:160px;overflow:auto;background:#000;padding:6px}
#diag .close{position:absolute;top:14px;right:16px;font:700 14px var(--fl);color:var(--num);padding:6px 10px;border:1px solid var(--edge)}

/* ============ keyframes ============ */
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes hudglow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@keyframes raysspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes ringpulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5}50%{transform:translate(-50%,-50%) scale(1.06);opacity:.3}}
@keyframes hzin{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes punch{from{transform:scale(1.15)}to{transform:scale(1)}}
@keyframes whiteout{from{opacity:1}to{opacity:0}}
@keyframes killin{from{opacity:0}to{opacity:1}}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.2)}to{transform:translate(-50%,-50%) scale(1)}}
@keyframes ringgrow{from{transform:translate(-50%,-50%) scale(.3)}to{transform:translate(-50%,-50%) scale(1)}}
@keyframes slam{0%{transform:scale(1.8);opacity:0}60%{transform:scale(.96) translate(2px,-1px);opacity:1}80%{transform:scale(1.02) translate(-2px,1px)}100%{transform:scale(1)}}
@keyframes shimmer{0%{filter:brightness(1)}40%{filter:brightness(1.6) hue-rotate(20deg)}100%{filter:brightness(1)}}
@keyframes collapse{to{transform:scale(.05);opacity:0}}
@keyframes redflood{from{opacity:0}to{opacity:1}}
@keyframes heartbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.04)}24%{transform:scale(1)}}
@keyframes wipein{from{transform:translateX(-110%) skewX(-14deg)}to{transform:translateX(0) skewX(-14deg)}}
@keyframes trackin{from{opacity:0;transform:translate(24px,-50%)}to{opacity:1;transform:translate(0,-50%)}}
@keyframes wipeout{to{transform:translateX(120%);opacity:0}}

/* end-of-match result screen — flex column so nothing can stack on short viewports (2026-08-26) */
.result{display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:12px;padding:18px 32px;overflow:hidden}
.result .banner{text-align:center;font-family:var(--fd);font-style:italic;font-weight:700;font-size:40px;letter-spacing:.18em;color:var(--num);transform:skewX(-8deg);text-shadow:0 0 40px rgba(122,190,255,.35)}
.result .banner .unskew{display:inline-block;transform:skewX(8deg)}
.result .rstats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.result .rstats .cell{min-width:0;border:1px solid var(--edge);background:var(--plate);padding:10px 4px;text-align:center;transform:skewX(-8deg)}
.result .rstats .cell b{display:block;font-family:var(--fd);font-weight:700;font-size:30px;color:var(--num);transform:skewX(8deg);white-space:nowrap}
.result .rstats .cell span{display:block;margin-top:3px;font-size:9.5px;letter-spacing:.18em;color:var(--mut);font-weight:600;transform:skewX(8deg);white-space:nowrap}
.result .sess{text-align:center;font-size:12px;letter-spacing:.24em;color:var(--mut);font-weight:600}
.result .foot{position:static;display:flex;flex-direction:column;gap:6px;align-items:center}
.result .foot .ready{max-width:420px;width:100%;margin:0 auto}
.result .syncline{font-size:11px;letter-spacing:.2em;font-weight:700}
.result .syncline.ok{color:var(--ok)}.result .syncline.warn{color:var(--warn)}
/* connected screen: unmistakable MC state (bench 2026-08-25) */
.mclinked{flex:1;display:flex;align-items:center;justify-content:center;min-height:96px;border:1px solid var(--ok);color:var(--ok);font-family:var(--fd);font-style:italic;font-weight:700;font-size:28px;letter-spacing:.2em;transform:skewX(-10deg);box-shadow:0 0 40px -12px var(--ok)}
.mclinked .unskew{display:inline-block;transform:skewX(10deg)}

/* kit-out try-out panel + loadout weapon thumb (2026-08-26) */
.tryout{position:absolute;top:118px;left:36px;right:36px;display:flex;gap:16px;border:1px solid var(--edge);background:var(--plate);padding:8px 18px;transform:skewX(-8deg)}   /* slanted like the plates and the buttons beside it (review #28) */
.tryout > *{transform:skewX(8deg)}
.tryout .art{flex:0 0 220px;height:104px;background-size:cover;background-position:center;border:1px solid var(--edge)}
.tryout .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center}
.tryout .facts{margin-top:2px;line-height:1.4}
.tryout .lbl{font-size:11px;letter-spacing:.24em;color:var(--warn);font-weight:700}
.tryout .nm{font-family:var(--fd);font-style:italic;font-weight:700;font-size:24px;letter-spacing:.06em;color:var(--num)}
.tryout .ln{font-size:12px;letter-spacing:.14em;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tryout .tb{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.2em;color:var(--mut);font-weight:600}
.tryout .tb span{width:104px;flex:0 0 104px}   /* fits RATE OF FIRE / AMMO CARRIED / KILL SPEED without wrapping */
.tryout .tb span{width:34px}
.tryout .tb i{flex:1;height:6px;background:var(--inset,#0a1626);border:1px solid var(--edge);display:block}
.tryout .tb b{display:block;height:100%;background:var(--glow)}
.plate.wart{display:flex;align-items:stretch;gap:0;padding:0;overflow:hidden}
.plate.wart .thumb{flex:0 0 96px;background-size:cover;background-position:center}
/* ============ A9 loadout: slot plates (KITTED) + the LOADOUT browser (docs/spec/loadout.md §4.5) ============ */
.plate.slot{display:flex;gap:12px;align-items:center;flex:0 0 288px;min-height:78px;padding:8px 14px;position:relative;pointer-events:auto}
.lobby .plates > .plate:not(.slot){flex:1 1 120px;min-width:0}
.lobby .plates > .plate:not(.slot) .h,.lobby .plates > .plate:not(.slot) .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate.slot .thumb{flex:0 0 84px;height:56px;border:1px solid var(--edge);background-size:cover;background-position:center;transform:skewX(8deg)}
.plate.slot .thumb.perk,.plate.slot .thumb.none{display:flex;align-items:center;justify-content:center;color:var(--glow);background:var(--plate2)}
.plate.slot .thumb.perk svg{width:40px;height:40px}
.plate.slot .thumb.none span{font-size:24px;color:var(--mut)}
.plate.slot .in{min-width:0;flex:1}
.plate.slot .k{font-size:11px;letter-spacing:.26em;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.plate.slot .k .lock{display:inline-flex}.lockg{width:14px;height:14px;vertical-align:-2px}.lolock .big .lockg{width:20px;height:20px;vertical-align:-3px}
.plate.slot .k .cue{margin-left:auto;color:var(--glow);font-size:16px;line-height:1}
.plate.slot .h{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate.slot .s{font-size:10.5px;letter-spacing:.1em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate.slot.tap{border-color:var(--glow);box-shadow:0 0 22px -12px var(--glow)}
.plate.slot.locked{opacity:.75}
.lobby .platehint{flex:0 0 100%;padding-left:8px;margin-top:-2px;font-size:11px;letter-spacing:.24em;color:var(--mut);font-weight:700}
.tryout .tact{flex:0 0 170px;display:flex;flex-direction:column;justify-content:center;gap:8px;pointer-events:auto}
.tryout .tact .small{line-height:1.4;letter-spacing:.08em}
.lobtn{height:48px;min-width:130px;padding:0 22px;font-family:var(--fd);font-weight:700;font-size:20px;letter-spacing:.16em;transform:skewX(-10deg);background:var(--glow);color:#04121e;pointer-events:auto}
.lobtn .unskew{display:inline-block;transform:skewX(10deg)}
.lobtn.ghost,.lobtn.done{background:var(--plate);color:var(--num);border:1px solid var(--edge)}
.lobtn.try{background:var(--warn);color:#1a1200}
.lo .lotop{position:absolute;top:0;left:36px;right:36px;height:62px;display:flex;align-items:flex-end;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--edge)}
.lotab{height:48px;min-width:210px;padding:0 18px;background:var(--plate2);border:1px solid var(--edge);color:var(--mut);transform:skewX(-10deg);text-align:left;pointer-events:auto}
.lotab .unskew{display:flex;flex-direction:column;transform:skewX(10deg);line-height:1.1}
.lotab .k{font-size:11px;letter-spacing:.26em;font-weight:700}
.lotab .v{font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:.06em;color:var(--num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.lotab.on{background:var(--team);border-color:var(--team);color:var(--team-ink)}
.lotab.on .v{color:var(--team-ink)}
.lo .who{margin-left:auto;display:flex;align-items:baseline;gap:10px;padding:0 16px 6px 0}
.lo .who .cs{font-family:var(--fd);font-style:italic;font-weight:700;font-size:22px;letter-spacing:.08em;line-height:1}
.lo .who .num{font-family:var(--fd);font-weight:700;font-size:16px;color:var(--glow)}
.lo .lobody{position:absolute;top:70px;left:36px;right:36px;bottom:74px;display:flex;gap:16px}
.lo .lolist{flex:0 0 404px;overflow:hidden auto;display:flex;flex-direction:column;gap:6px;padding:0 6px 0 4px;pointer-events:auto}
/* WEAPONS | PERKS | NONE. Field 2026-09-01: "the perks menu is really small and hard to see, it
   was hard to figure out how to open the perks menu". These are the only way to reach perks, so
   they are sized as the primary control they are, not as a filter chip. */
.lofilt{display:flex;gap:8px;margin-bottom:8px;flex:0 0 auto}
.fch{height:46px;min-width:0;flex:0 0 auto;padding:0 16px;background:var(--plate2);border:1px solid var(--edge);color:var(--ink);font-size:13px;letter-spacing:.14em;font-weight:700;transform:skewX(-10deg);position:relative;pointer-events:auto;white-space:nowrap}
.fch .unskew{display:inline-block;transform:skewX(10deg)}
.fch.on{background:var(--num);color:#04121e;border-color:var(--num)}
.fch.none{margin-left:auto}
.fch.none.on{background:var(--plate);color:var(--ok);border-color:var(--ok)}
.fch.pend{border-color:var(--glow);color:var(--glow)}
/* the ::after tap-area hack is gone: the chip is 46px tall now, so the control IS the tap target */
.lrow{display:flex;align-items:center;gap:12px;min-height:50px;padding:5px 12px 5px 6px;background:var(--plate);border:1px solid var(--edge);transform:skewX(-6deg);flex:0 0 auto;pointer-events:auto}
.lrow > *{transform:skewX(6deg)}
.lrow .thumb{flex:0 0 66px;height:36px;background-size:cover;background-position:center;border:1px solid var(--edge)}
.lrow .thumb.perk{display:flex;align-items:center;justify-content:center;color:var(--glow);background:var(--plate2)}
.lrow .thumb.perk svg{width:30px;height:30px}
.lrow .nm{font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.lrow .nm2{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.05}
.lrow .nm2 b{font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .nm2 small{font-size:11px;letter-spacing:.16em;color:var(--mut);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .role{font-size:11px;letter-spacing:.16em;color:var(--mut);font-weight:700;white-space:nowrap;flex:0 3 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}   /* the NAME wins the row: the role label gives way first */
.lrow .mag{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.08em;min-width:52px;text-align:right}
.lrow .st{width:18px;text-align:center;font-size:16px;color:var(--ok);font-weight:700}
.lrow.fo{background:rgba(95,214,255,.08)}
.lrow.eq{border-color:var(--ok)}
.lrow.pend{border-color:var(--glow);animation:blink 1s infinite}
.lrow.rej{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.lotab.locked{opacity:.55;cursor:default}
.locount{font-size:10px;letter-spacing:.22em;color:var(--mut);font-weight:700;padding:2px 4px;flex:0 0 auto}
.lo .lolist{-webkit-mask-image:linear-gradient(#000 86%,transparent);mask-image:linear-gradient(#000 86%,transparent);padding-bottom:28px}
.eqtag{font-family:var(--fl);font-style:normal;font-size:10px;letter-spacing:.2em;color:var(--ok);border:1px solid var(--ok);padding:2px 7px;margin-left:8px;vertical-align:middle;font-weight:700}
.lo .lodetail{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;overflow:hidden auto;padding-bottom:34px;-webkit-mask-image:linear-gradient(#000 90%,transparent);mask-image:linear-gradient(#000 90%,transparent)}
.lo .lodetail > *{flex:0 0 auto}
.lodetail .caution{color:var(--bad);font-family:var(--fm,monospace);font-size:11px;letter-spacing:.08em;margin-top:4px}
.lo .lodetail .art{height:84px;border:1px solid var(--edge);background-size:cover;background-position:center;flex:0 0 auto}
.lo .lodetail .art.perk{display:flex;align-items:center;justify-content:center;color:var(--glow);background:var(--plate2)}
.lo .lodetail .art.perk svg{width:64px;height:64px}
.lo .lodetail .rolechip{font-family:var(--fl);font-style:normal;font-size:11px;letter-spacing:.18em;color:var(--mut);vertical-align:middle;margin-left:6px}
.lo .lodetail .nm{font-family:var(--fd);font-style:italic;font-weight:700;font-size:24px;letter-spacing:.06em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.lo .lodetail .ln{font-size:11px;letter-spacing:.14em;color:var(--mut);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lo .lodetail .tb{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.2em;color:var(--mut);font-weight:600}
.lo .lodetail .tb span{width:104px;flex:0 0 104px}   /* fits RATE OF FIRE / AMMO CARRIED / KILL SPEED without wrapping */
/* the real numbers that sit under the ranked bars (field 2026-08-30) */
.tb span em{font-style:normal;opacity:.7}
.facts{font-size:11px;letter-spacing:.12em;color:var(--mut);margin-top:6px;line-height:1.7}
.facts b{color:var(--ink);font-weight:700}
.lo .lodetail .tb span{width:34px}
.lo .lodetail .tb i{flex:1;height:6px;background:var(--inset,#0a1626);border:1px solid var(--edge);display:block}
.lo .lodetail .tb b{display:block;height:100%;background:var(--glow)}
.lo .lodetail .desc{font-size:12px;line-height:1.4;color:var(--mut);font-weight:600;overflow-wrap:normal;hyphens:none}   /* the whole text; the pane scrolls (#9) */

.lo .lobar{position:absolute;left:36px;right:36px;bottom:14px;height:52px;display:flex;align-items:center;gap:12px}
.lo .ackslot{flex:1;min-width:0;display:flex}
.ackchip{font-size:12px;letter-spacing:.2em;font-weight:700;padding:8px 4px;transform:skewX(-10deg);background:none;border:0;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ackchip .unskew{display:inline-block;transform:skewX(10deg)}
.ackchip.ok{color:var(--ok)}
.ackchip.bad{color:var(--bad)}
.ackchip.warn{color:var(--warn)}
.plate .h.tab{letter-spacing:0;font-size:17px;white-space:nowrap}
.lolock{padding:24px 18px;border:1px solid var(--edge);background:var(--plate);display:flex;flex-direction:column;gap:10px}
.lolock .big{font-family:var(--fd);font-weight:700;font-size:22px;letter-spacing:.1em}
.lolock .s{font-size:13px;color:var(--mut);font-weight:600;line-height:1.5}
.lolock .cur{font-family:var(--fd);font-weight:700;font-size:18px;color:var(--glow);letter-spacing:.06em}
/* night: no artwork (the phone must not become a flashlight), same tokens otherwise */
[data-env="night"] .plate.slot .thumb,[data-env="night"] .lrow .thumb,[data-env="night"] .lo .lodetail .art{background-image:none!important;background:#000;border-color:var(--edge)}
[data-env="night"] .lotab.on{background:var(--team);color:#000}
[data-env="night"] .lrow.eq,[data-env="night"] .eqtag{border-color:var(--num)}
[data-env="night"] .lrow .st,[data-env="night"] .ackchip.ok,[data-env="night"] .eqtag,[data-env="night"] .fch.none.on{color:var(--num)}
[data-env="night"] .fch.none.on{border-color:var(--num)}
[data-env="night"] .fch.on{background:var(--mut);color:#000;border-color:var(--mut)}
[data-env="night"] .lrow.fo{background:#0d0303}
[data-env="night"] .lo .lodetail .tb i,[data-env="night"] .tryout .tb i{background:#120505;border-color:#1a0a0a}
[data-env="night"] .lo .lodetail .tb b,[data-env="night"] .tryout .tb b{background:var(--num)}
[data-env="night"] .lrow.rej{border-color:var(--bad);box-shadow:none}
[data-env="night"] .lo .lolist{-webkit-mask-image:none;mask-image:none}
[data-env="night"] .lobtn,[data-env="night"] .lobtn.try{background:var(--plate2);color:var(--num);border:1px solid var(--edge)}
[data-env="night"] .plate.slot.tap{box-shadow:none;border-color:var(--edge)}
.plate.wart .in{padding:10px 10px 10px 12px}   /* the subtitle line needs the width (MAG 300 · RESERVE 600) */

/* ---------- A10 §4.1 / §4.6: setting-up state + BRIEFING ---------- */
.lobby .setup{flex:1;display:flex;align-items:center;gap:18px;min-height:76px;border:1px solid var(--edge);background:var(--plate);padding:14px 22px;transform:skewX(-8deg)}
.lobby .setup .in{transform:skewX(8deg);display:flex;flex-direction:column;gap:6px}
.lobby .setup .t{font-family:var(--fd);font-style:italic;font-weight:700;font-size:24px;letter-spacing:.14em;color:var(--num);white-space:nowrap}
.lobby .setup .s{font-size:13px;color:var(--mut);font-weight:600;line-height:1.4}
.lobby .setup .pulse{display:flex;gap:6px;transform:skewX(8deg)}
.lobby .setup .pulse i{width:10px;height:10px;background:var(--glow);opacity:.25;animation:setupdot 1.8s infinite}
.lobby .setup .pulse i:nth-child(2){animation-delay:.3s}.lobby .setup .pulse i:nth-child(3){animation-delay:.6s}
@keyframes setupdot{0%,100%{opacity:.2}30%{opacity:1}}
.briefbtn{margin-top:2px;border:1px solid var(--edge);color:var(--mut);font-family:var(--fd);font-weight:700;font-size:12px;letter-spacing:.2em;padding:0 14px;min-height:36px;transform:skewX(-10deg);pointer-events:auto}
.briefbtn .unskew{display:inline-block;transform:skewX(10deg)}
.bf{overflow:hidden}
.bf .bfart{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.55;animation:bfart 1.2s ease-out both}
.bf .bfveil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,4,7,.96) 0%,rgba(3,4,7,.86) 46%,rgba(3,4,7,.35) 100%),linear-gradient(0deg,rgba(3,4,7,.95) 0%,transparent 45%)}
.bf .bfbody{position:absolute;top:26px;left:36px;right:36px;bottom:104px;display:flex;flex-direction:column;gap:8px;max-width:560px}
.bf .r{animation:bfin .45s cubic-bezier(.2,.8,.2,1) both}
.bf .r1{animation-delay:.08s}.bf .r2{animation-delay:.16s}.bf .r3{animation-delay:.24s}.bf .r4{animation-delay:.32s}.bf .r5{animation-delay:.12s}   /* the CTA lands early — it is the control, never the last thing to appear */
@keyframes bfin{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes bfart{from{opacity:0;transform:scale(1.06)}to{opacity:.55;transform:none}}
.bf .bfk{display:flex;align-items:center;gap:10px}
.bf .bfk .lab{font-size:11px;letter-spacing:.3em;color:var(--mut);font-weight:700}
.bf .bfname{font-family:var(--fd);font-style:italic;font-weight:700;font-size:46px;line-height:.92;letter-spacing:.06em;text-shadow:0 0 30px color-mix(in srgb,var(--glow) 45%,transparent);max-height:88px;overflow:hidden}
.bf .bfdesc{font-size:12.5px;line-height:1.45;color:var(--num);font-weight:600;opacity:.9;max-width:520px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bf .bfrules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 10px;max-width:540px}
.bf .bfrules .cell{display:flex;flex-direction:column;gap:1px;padding:5px 9px;background:var(--plate);border:1px solid var(--edge);min-width:0}
.bf .bfrules .k{font-size:11px;letter-spacing:.26em;color:var(--mut);font-weight:700}
.bf .bfrules .v{font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bf .bfload{display:flex;gap:10px;align-items:baseline;font-size:12px;line-height:1.35;color:var(--num);font-weight:600;max-width:540px}
.bf .bfload .k{flex:0 0 auto;font-size:11px;letter-spacing:.26em;color:var(--glow);font-weight:700;padding-top:2px}
.bf .bffoot{position:absolute;left:36px;right:36px;bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.bf .who{display:flex;align-items:baseline;gap:10px}.bf .who .cs{font-family:var(--fd);font-style:italic;font-weight:700;font-size:22px;letter-spacing:.08em}.bf .who .num{font-family:var(--fd);font-weight:700;color:var(--glow);font-size:16px}
.bf .cta{display:flex;align-items:center;gap:16px}
.bf .ready.go{flex:0 0 auto;height:64px;font-size:26px;padding:0 34px;min-width:300px;background:var(--glow);color:#04121e;box-shadow:0 0 40px -8px var(--glow)}
.bf .cta .note{max-width:190px;text-align:left}
/* short viewport (≈330): tighter briefing */
@media (max-height:360px){.bf .bfname{font-size:38px}.bf .bfdesc{-webkit-line-clamp:1}.bf .bfbody{gap:6px;bottom:90px}.bf .ready.go{height:54px;font-size:22px}}
/* night: no art, no glow, no white — the red ramp only */
[data-env="night"] .bf .bfart{display:none}
[data-env="night"] .bf .bfveil{background:#000}
[data-env="night"] .bf .bfname{text-shadow:none;color:var(--num)}
[data-env="night"] .bf .bfdesc,[data-env="night"] .bf .bfload,[data-env="night"] .bf .bfrules .v{color:var(--num)}
[data-env="night"] .bf .bfload .k,[data-env="night"] .bf .who .num{color:var(--warn)}
[data-env="night"] .bf .ready.go{background:var(--plate2);color:var(--num);border:1px solid var(--num);box-shadow:none}
[data-env="night"] .bf .r,[data-env="night"] .bf .bfart{animation:none}
[data-env="night"] .lobby .setup .pulse i{background:var(--num)}
[data-env="night"] .briefbtn{border-color:var(--mut);color:var(--num)}
#info{min-width:36px;min-height:36px;font-size:15px}   /* the 44px ::after is the tap target; the visual sits in the corner gutter */
</style>
</head>
<body>
  <div id="stage">
    <div id="frame" data-team="blue">
      <div id="cam"></div>
      <div id="hud"></div>
