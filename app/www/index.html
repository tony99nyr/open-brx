.hitwpn.last .hw::before{content:'LAST HIT \00B7  '}
.hitwpn.out{animation:hitout .4s ease-in forwards}
.hit .dmg{font-family:var(--fd);font-style:italic;font-weight:700;font-size:58px;line-height:.8;color:var(--bad);text-shadow:0 0 40px rgba(255,60,60,.7);animation:slam .28s cubic-bezier(.2,1.4,.4,1)}
.hit .src{font-family:var(--fd);font-weight:700;font-size:13px;letter-spacing:.2em;padding:3px 14px;transform:skewX(-12deg)}
.hit.out{animation:hitout .42s ease-in forwards}
/* GAINING a pool. Colour matches poolgauge.py so one mapping is learned across gun and HUD. */
.gain{pointer-events:none}
.gain .gv{position:absolute;inset:0;animation:hitin .14s ease-out}
.gain.health .gv{box-shadow:inset 0 0 170px -30px rgba(60,230,120,.7)}
.gain.armor  .gv{box-shadow:inset 0 0 170px -30px rgba(170,110,255,.7)}
.gain.shield .gv{box-shadow:inset 0 0 170px -30px rgba(60,220,230,.7)}
.gain .gc{position:absolute;top:66%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.gain .amt{font-family:var(--fd);font-style:italic;font-weight:700;font-size:48px;line-height:.8;animation:slam .3s cubic-bezier(.2,1.4,.4,1)}
.gain.health .amt{color:var(--ok);text-shadow:0 0 34px rgba(60,230,120,.6)}
.gain.armor  .amt{color:#b07cff;text-shadow:0 0 34px rgba(170,110,255,.6)}
.gain.shield .amt{color:#4fdce6;text-shadow:0 0 34px rgba(60,220,230,.6)}
.gain .lab{font-size:12px;letter-spacing:.34em;color:var(--mut);font-weight:600}
.gain.out{animation:hitout .5s ease-in forwards}
@keyframes hitin{from{opacity:0}to{opacity:1}}
@keyframes hitout{to{opacity:0}}
/* Night: keep the information, drop the glare. You must still know you are being shot. */
[data-env="night"] .hit .vig,[data-env="night"] .gain .gv{box-shadow:none;background:none}
[data-env="night"] .hit .dmg,[data-env="night"] .gain .amt{text-shadow:none}
/* Reduced motion: show the same information, without the transitions. */
/* `#frame`, not `.frame`: the element carries an ID and no such class exists, so the first
   version of this rule matched nothing at all and .takingfire kept blinking. */
@media (prefers-reduced-motion:reduce){#frame *,.mo,.mo *{animation:none!important;transition:none!important}.whiteout{display:none}
  #frame .svm .svdly::after,#frame .svm .svfl::after{display:none;animation:none!important}}   /* `*` never reaches a pseudo-element */   /* without its fade the whiteout is a harder pop, not a gentler one (UX review 2026-09-03) */
/* Night: the shooter-team chip is set INLINE (a team colour), and inline styles win over CSS.
   Class-driven at night instead, so it stops being the brightest object on a black HUD. */
[data-env="night"] .hit .src,[data-env="night"] .down .recap .tm,[data-env="night"] .down .kb b,[data-env="night"] .bdteam .tm{background:#2a0d0d!important;color:#ff8a8a!important;box-shadow:none}   /* inline day colours would be the brightest thing on a night screen */
[data-env="night"] .gain.armor .amt{color:#7a5aa8}
[data-env="night"] .gain.shield .amt{color:var(--num);text-shadow:none}[data-env="night"] .gain.shield .gv{box-shadow:none}   /* was teal #3a8f96 (spec B4); the toast now shows only where no shield meter is up, e.g. a perk grant in a game with no shield */
[data-env="night"] .mo{animation:none!important}
[data-env="night"] .whiteout{display:none}
/* QA-05 night: the same callout card, dim red on black, no glow, no motion, no green (spec B4). */
[data-env="night"] .co[data-tone="enemy"],[data-env="night"] .co[data-tone="ours"],[data-env="night"] .co[data-tone="item"]{--co:#c9484a}[data-env="night"] .co[data-tone="mate"],[data-env="night"] .co[data-tone="theirs"]{--co:#a8782a}
[data-env="night"] .co .cob{background:#120505;border-color:#3a1414;animation:none}
[data-env="night"] .co *{animation:none!important}   /* night is still (B4): the medal lines show at once instead of arriving one by one */
[data-env="night"] .co .nm{color:var(--num);text-shadow:none}[data-env="night"] .co .sw{background:#5a2222!important}
[data-env="night"] .co .medal{background:#2a0c0c!important;color:#ef6868!important;box-shadow:none!important;border:1px solid #5a1c1c}
/* ---- QA lane B (2026-09-23): the live HUD at night. Red and amber on black, no green, no flash, no strobe (spec B4). ---- */
/* QA-22/QA-02: the link status stays at night; the NO GUN dot is the brightest red on the screen, steady */
[data-env="night"] .topright{color:var(--num)}
[data-env="night"] .topright .dot{background:#5a2222;box-shadow:none}
[data-env="night"] .topright .dot.off{background:#ff5a5a;box-shadow:none;animation:none;width:12px;height:12px}
[data-env="night"] .topright .dot.ws{background:var(--warn);box-shadow:none}
[data-env="night"] .topright .dot.warn{background:#c98a2e;box-shadow:none;width:12px;height:12px}
[data-env="night"] .batt .shell{border-color:var(--num)}[data-env="night"] .batt .fill{background:var(--num)}
/* QA-17: no green on the live HUD at night (WEAPONS HOT, ALT = RELOAD, CONFIRMED BY YOUR GUN) */
#frame[data-env="night"][data-screen="live"] .chipbar .pill.ok:not(.callout){border-color:var(--num);color:var(--num)}
[data-env="night"] .alive{--ok:var(--num)}
[data-env="night"] .switched .s,[data-env="night"] .wt.on .wl{color:var(--num)}
/* QA-02 at night */
[data-env="night"] .staletag{border-color:#ef6868;color:#ef6868}
[data-env="night"] .pill.bad.gunlost{background:#2a0c0c;border-color:#ef6868;color:#ef6868}
/* QA-06: taking fire, low HP and the kill banner, dim and still */
[data-env="night"] .takingfire .t{color:var(--num);animation:none;text-shadow:none}
[data-env="night"] .takingfire .r{border-color:var(--num)}
[data-env="night"] .firevig{box-shadow:inset 0 0 90px -20px #4a0c0c;animation:none}
[data-env="night"] .bar.low{animation:none}
[data-env="night"] .lowtag{background:#2a0c0c;color:#ef6868;border:1px solid #ef6868}
[data-env="night"] .hitwpn.last .hw{color:var(--num)}
[data-env="night"] .spawnshield{background:#0d0303;border-color:var(--num)}
[data-env="night"] .spawnshield .k{color:var(--num)}
[data-env="night"] .aimfx.stun{background:#120505;border-color:var(--warn)}
[data-env="night"] .aimfx.stun .k,[data-env="night"] .aimfx.stun .t{color:#e0a143}

[data-env="night"] .down{background:#000}[data-env="night"] .down .wash,[data-env="night"] .down .ghost{display:none}
[data-env="night"] .tminus{background:#000}[data-env="night"] .tminus .hz,[data-env="night"] .tminus .glow{display:none}
[data-env="night"] .redeploy .wipe,[data-env="night"] .redeploy .slash{display:none}

/* ============ setup screens ============ */
.idle .l{position:absolute;top:0;bottom:0;left:0;width:46%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px}
.idle .wm{font-family:var(--fd);font-style:italic;font-weight:700;font-size:54px;letter-spacing:.16em;text-indent:.16em}
.idle .wm b{color:var(--glow)}
.idle .sub{font-size:11px;letter-spacing:.4em;color:var(--mut);font-weight:600}
.bigbtn{height:60px;width:260px;background:var(--glow);color:#04121e;font-family:var(--fd);font-weight:700;font-size:20px;letter-spacing:.16em;transform:skewX(-12deg)}
.bigbtn .unskew{display:inline-block;transform:skewX(12deg)}
.bigbtn.ghost{background:transparent;border:1px solid var(--edge);color:var(--mut);height:44px;width:220px;font-size:14px}
.idle .r{position:absolute;top:0;bottom:0;right:0;width:54%;background:var(--plate2);border-left:1px solid var(--edge);padding:26px 36px 26px 26px;display:flex;flex-direction:column;gap:10px}
.idle .sc{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--glow);font-weight:600;letter-spacing:.14em}
.idle .sc i{width:8px;height:8px;background:var(--glow);border-radius:50%;animation:blink 1.2s infinite}
.idle .sc.bad{color:var(--bad)}
/* QA-12 (2026-09-23): night turned --glow transparent and took the MAC tails and the SCANNING line with it, so two
   guns with one name looked identical (B1 needs the tail). The tail is part of the row a player taps: full --num.
   The header is a label: dim --mut, and its dot holds still (no blink at night). */
[data-env="night"] .tagrow .nm b,[data-env="night"] .tagrow .sig b{color:var(--num)}
[data-env="night"] .idle .sc:not(.bad){color:var(--mut)}
[data-env="night"] .idle .sc:not(.bad) i{background:var(--mut);animation:none}
.idle .sc[hidden]{display:none}   /* game day 2026-09-19: no SCANNING line while no picker scan runs */
.idle .sc.bad i{background:var(--bad);animation:blink .9s infinite}
.idle .small.bad{color:var(--bad)}
.idle .r .bigbtn.ghost{width:auto;align-self:flex-start;padding:0 18px}
.tagrow{display:flex;justify-content:space-between;align-items:center;background:var(--plate);border:1px solid var(--edge);padding:12px 16px;transform:skewX(-6deg);pointer-events:auto;min-height:56px}
.tagrow.used{opacity:.55}
.tagrow .nm{display:inline-block;transform:skewX(6deg);font-family:ui-monospace,monospace;font-size:16px;font-weight:700}
.tagrow .nm b{color:var(--glow);font-weight:700}
.tagrow .sig{display:inline-flex;transform:skewX(6deg);align-items:flex-end;gap:2px}
.tagrow .sig i{width:4px;background:var(--edge);display:block}
.tagrow .sig i.on{background:var(--ok)}
[data-env="night"] .tagrow .sig i.on{background:var(--num)}   /* QA-17 (merge review): no green at night, the signal bars too */
.tagrow .sig b{color:var(--mut);font-size:11px;margin-left:6px;font-weight:700}
.tagrow .inuse{display:inline-block;transform:skewX(6deg);color:var(--warn);font-size:11px;font-weight:700;letter-spacing:.1em}
.idle .help{font-size:12px;color:var(--mut);line-height:1.5;margin-top:auto}
/* F340: the Location-off state (Android 11 and older). A 56 px action, a 13 px reason line. */
.idle .locoff{display:flex;flex-direction:column;gap:12px;flex:1;padding-right:40px;box-sizing:border-box}   /* clears the day/night switch in the right gutter */
.idle .locoff .locwhy{font-size:13px;line-height:1.5;color:var(--bad)}
.idle .r .bigbtn.locbtn{height:56px;width:auto;align-self:flex-start;padding:0 20px;font-size:15px;letter-spacing:.12em}
.idle .list{display:flex;flex-direction:column;gap:10px;overflow:hidden auto;max-height:230px;padding:0 4px}
/* F258: the picker's boxes are fixed and patched in place, so `hidden` has to beat the class rules
   that set an explicit display (a UA `[hidden]{display:none}` loses to `.tagrow .sig` and friends).
   These rules carry one more attribute selector than the display rules above them, so they win. */
.idle .list .taggers,.idle .list .others{display:flex;flex-direction:column;gap:10px}
/* the "other devices" fold: everything the picker could not rank as a tagger, one tap away */
.othertog{background:none;border:0;color:var(--mut);font-size:11px;letter-spacing:.16em;font-weight:600;
  text-align:left;padding:10px 4px;min-height:36px;cursor:pointer;transform:skewX(-6deg)}
.othertog .unskew{display:inline-block;transform:skewX(6deg)}
.idle .list [hidden],.tagrow [hidden]{display:none}
/* app 0.4.2: the picker's "Connecting to <gun>" block, shown from the tap until the link is up or fails */
.idle .list .connecting{display:flex;flex-direction:column;gap:8px;background:var(--plate);border:1px solid var(--glow);padding:14px 16px;transform:skewX(-6deg)}
.idle .list .connecting > *{transform:skewX(6deg)}
.idle .list .connecting .cn{font-family:ui-monospace,monospace;font-size:16px;font-weight:700;color:var(--glow)}
.idle .list .connecting .cst{font-size:12px;color:var(--mut);letter-spacing:.06em}
.idle .list .connecting .cbar{position:relative;height:4px;background:var(--edge);overflow:hidden}
/* Office test 2026-09-19 (Pixel 4/5): the moving segment used to sweep from left:-30% to left:100% at
   width:30% -- at the RIGHT end that is the whole 30%-wide bar sitting entirely outside the box, relying on
   `overflow:hidden` alone to keep it off the UI to the right. The bar now stays INSIDE 0%-100% for the
   whole animation, so it can never overlap regardless of how a given WebView clips overflow. */
.idle .list .connecting .cbar i{position:absolute;top:0;bottom:0;width:22%;background:var(--glow);animation:connsweep 1.1s ease-in-out infinite}
@keyframes connsweep{from{left:0}to{left:78%}}
.idle .list .connecting.bad{border-color:var(--bad)}
.idle .list .connecting.bad .cn{color:var(--bad)}
.idle .list .connecting.bad .cbar{display:none}
.idle .list .connecting[hidden]{display:none}
.lobby .top{position:absolute;top:30px;left:36px;display:flex;flex-direction:column;gap:4px}
.lobby .cs{font-family:var(--fd);font-style:italic;font-weight:700;font-size:44px;letter-spacing:.08em;line-height:.9}
.lobby .row{display:flex;align-items:center;gap:8px}
.lobby .chip{font-size:12px;padding:2px 12px}
.lobby .gid{font-family:ui-monospace,monospace;font-size:12px;color:var(--mut)}
.lobby .plates{position:absolute;top:126px;left:36px;right:36px;display:flex;flex-wrap:wrap;gap:10px}
.plate{background:var(--plate);border:1px solid var(--edge);padding:10px 18px;transform:skewX(-8deg)}
.plate .in{transform:skewX(8deg)}
.plate .h{font-family:var(--fd);font-weight:700;font-size:22px;letter-spacing:.04em}
.plate .s{font-size:11px;color:var(--mut);letter-spacing:.14em;font-weight:600}
.lobby .foot{position:absolute;left:36px;right:36px;bottom:34px;display:flex;align-items:center;gap:20px}
.ready{flex:1;height:60px;background:var(--ok);color:#04120a;font-family:var(--fd);font-style:italic;font-weight:700;font-size:26px;white-space:nowrap;letter-spacing:.2em;transform:skewX(-10deg);box-shadow:0 0 40px -8px var(--ok)}
.ready .unskew{display:inline-block;transform:skewX(10deg)}
.ready.off{background:var(--glow);color:#04121e;border:0;box-shadow:0 0 40px -8px var(--glow)}   /* QA-19: READY UP is the screen's one action, so it wears the filled forward look (BUILD MY KIT, REVIEW KIT), not a ghost plate; READY ✓ stays --ok green */
.ready:disabled{opacity:.45;cursor:default}   /* QA-08: READY UP while MC refuses this phone */
.ready.wait{background:var(--plate);color:var(--mut);border:1px solid var(--edge);box-shadow:none;font-size:20px;cursor:default}   /* F117: `.wait` is now the INERT button only (STANDING BY). A real control never wears it. */
.ready.wait.on{background:var(--ok);color:#04120a;border:none;box-shadow:0 0 40px -8px var(--ok)}
/* QA-17/QA-19 night: no green anywhere on the kit, lobby, briefing or result screens (spec B4), and no filled
   bright button. `--ok` takes the night ink inside .lobby (every one of those screens is a .lobby). The action
   (READY UP, READY FOR NEXT MATCH, OK) is the strongest thing on screen: a 2px lifted-red frame on a dim red
   fill. A confirmed READY ✓ is quieter: a 1px frame, no fill. STANDING BY stays the plate. */
[data-env="night"] .lobby{--ok:var(--num)}
[data-env="night"] .lobby .ready.off,[data-env="night"] .result .rfoot .ready:not(.ghost){background:#5c1616;color:#f08080;border:2px solid #e06a6a;box-shadow:none}   /* polish round 1: filled, so the one action outranks the near-black plates at night too */
[data-env="night"] .lobby .ready[aria-pressed="true"],[data-env="night"] .lobby .ready.wait.on{background:transparent;color:var(--num);border:1px solid var(--num);box-shadow:none}
.lobby .note{font-size:13px;color:var(--mut);font-weight:600;max-width:200px;line-height:1.5}
/* A27/A30: the host locked kits under this player, or MC refused a pick. It LEADS the screen -- one line
   sitting directly above the footer's button, never a silent screen swap and never buried in the note. */
.lobby .kitlock{position:absolute;left:0;right:0;bottom:100%;margin-bottom:8px;font-size:13px;letter-spacing:.14em;color:var(--warn);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lobby .foot .note.join{max-width:230px;font-size:12px;line-height:1.4}
.lobby .tr{position:absolute;top:30px;right:48px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lobby .status{font-size:11px;letter-spacing:.2em;color:var(--mut);font-weight:600;text-align:right;white-space:nowrap}
.lobby .status b{color:var(--ok)}
.lobby .status .bad{color:var(--bad)}
.lobby .status .prog{color:var(--warn)}   /* QA-13: in progress (CONNECTING…, SYNCING…) is amber; red is kept for a real failure */
.mcin{display:flex;gap:6px;align-items:center;pointer-events:auto}
.mcin input{width:236px;height:56px;background:var(--plate2);border:1px solid var(--edge);color:var(--num);font:14px ui-monospace,monospace;padding:0 10px}
.qrbtn{white-space:nowrap;width:auto;align-self:center;margin-top:0;height:56px;padding:0 14px;background:#131b26;color:#ffc947;border:1px solid #3a4a61;font:700 14px ui-monospace,monospace;letter-spacing:.12em}
.mcin button{height:56px;padding:0 14px;background:var(--glow);color:#04121e;font-size:14px;letter-spacing:.14em;font-weight:700;position:relative}
/* QA-11 (2026-09-23): the address field, CONNECT and SCAN QR are 56px tall (44px on screen at the SE's 0.79 scale).
   The old 34px visual + 44px ::after measured 27px (visual) and 35px (hit) on an SE. */
/* QA-01 (2026-09-23): night paints --glow transparent, so a filled accent button lost its fill AND kept dark ink:
   SET MY GUN and CONNECT measured 1.1:1. At night they wear the BUILD MY KIT treatment: red outline, red text. */
[data-env="night"] .bigbtn:not(.ghost),[data-env="night"] .mcin button{background:transparent;color:var(--num);border:1px solid var(--num)}
[data-env="night"] .bigbtn.ghost,[data-env="night"] .qrbtn{color:var(--num)}
[data-env="night"] .qrbtn{background:transparent;border-color:var(--num)}
[data-env="night"] .mcin input::placeholder{color:var(--num);opacity:1}
.qrbtn{position:relative}
.overbtn{position:absolute;pointer-events:auto}
.small{font-size:11px;letter-spacing:.16em;color:var(--mut);font-weight:600}

/* ============ chips / prompts ============ */
.chipbar{position:absolute;top:100px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;white-space:nowrap}
#frame[data-takeover="reload"] #chips{opacity:0}   /* the takeover owns the screen */
.plate.slot .s .nw{white-space:nowrap;letter-spacing:.06em}
.down .n.nn{font-size:96px;line-height:1;font-style:normal;animation:none;color:var(--mut);text-indent:0}   /* the ✕/▣ glyphs are upright: no lean, no nudge */
.down .dn{display:flex;flex-direction:column;align-items:center;gap:6px}   /* one declaration: a `gap:2px` rule sat above this one and was overwritten by it on every render */
.down .ins{font-family:var(--fd);font-style:italic;font-weight:700;font-size:26px;letter-spacing:.08em;white-space:nowrap;text-align:center;color:var(--num)}.down .ins.on{color:var(--ok)}
.down .near.hold i{animation:holdfill 1.2s linear both}@keyframes holdfill{from{width:0}to{width:100%}}
.down .n.nn.on,.down .lab.on{color:var(--ok)}.down .lab b{color:var(--num);font-family:var(--fd);font-size:15px;letter-spacing:.02em}
.down .near{width:260px;height:10px;margin-top:6px;background:rgba(255,255,255,.1);border:1px solid var(--edge);transform:skewX(-14deg);overflow:hidden}
.down .near i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--warn) 0 18px,color-mix(in srgb,var(--warn) 55%,transparent) 18px 22px);transition:width .3s}
.down .near.on i{background:var(--ok);width:100%}
/* 2026-09-19: the timed-respawn warning. Level 1 a line, 2 larger and pulsing, 3 a full-width band flashing at 1 Hz
   (well below any flicker band). It sits between the DOWN block and the recap, and never covers the countdown. */
.down .safe{position:absolute;left:0;right:0;top:4%;display:flex;justify-content:center;pointer-events:none}
.down .safe span{font-family:var(--fd);font-weight:700;letter-spacing:.16em;white-space:nowrap;color:var(--warn)}
.down .safe.w1 span{font-size:16px}
.down .safe.w2 span{font-size:26px;animation:heatpulse 1s ease-in-out infinite}
.down .safe.w3{top:0;padding:6px 56px;background:var(--bad);animation:safeflash 1s steps(1,end) infinite}
.down .safe.w3 span{font-size:30px;color:#fff;white-space:normal;text-align:center}
@keyframes safeflash{0%{background:var(--bad)}50%{background:#5a1010}}   /* the band flashes, the words stay readable */
[data-env="night"] .down .safe.w3{background:#2a0d0d}[data-env="night"] .down .safe.w3 span{color:#ff8a8a}
[data-env="night"] .down .near i,[data-env="night"] .down .near.on i{background:var(--num)}[data-env="night"] .down .n.nn.on,[data-env="night"] .down .lab.on,[data-env="night"] .down .ins.on{color:var(--num)}
.bigbtn.ghost.util{height:40px;width:200px;font-size:12px;letter-spacing:.2em}   /* the ▣ glyph painted 49px below its line box and through the label */
#frame[data-screen="lobby"] .chipbar{top:98px;flex-direction:row;gap:8px}   /* the band between the callsign block and the plates */
#frame[data-screen="lo"] .chipbar{top:auto;bottom:70px;flex-direction:row;gap:8px}   /* loadout browser: over the faded list end, clear of tabs, filters and the action bar */
#frame[data-screen="panel"] .chipbar{top:2px;flex-direction:row;gap:8px}   /* briefing / result: the strip above the content */
/* QA-14: on the result screen the centred strip sat on the title (MC NOT REACHED · SEE MISSION CONTROL). The pills
   go to the top right, clear of the ⓘ column, and TEAMS/PLAYERS drops to the bottom of the header to make room.
   The MC-range pill steps aside here: the footer's status line already says it. */
#frame[data-screen="panel"]:has(.lobby.result) .chipbar{top:2px;left:auto;right:58px;transform:none}
#frame:has(.lobby.result) .pill.mcr{display:none}
#frame[data-screen="lo"] .pill,#frame[data-screen="panel"] .pill{font-size:11px;letter-spacing:.14em;padding:5px 12px}
#frame[data-screen="lobby"] .pill{font-size:11px;letter-spacing:.14em;padding:5px 12px}
#frame[data-screen="lobby"] button.pill{min-height:0;position:relative}#frame[data-screen="lobby"] button.pill::after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:56px}   /* HUD QA R2-05: 56 frame px = 44 px on the SE */
#frame[data-screen="lobby"] button.pill,#frame[data-screen="lobby"] .pill[data-headset]{font-size:14px;letter-spacing:.08em}   /* R2-05/R2-07: 11 px on the SE screen, not 8.7 */
.lobby .note .warnnote{color:var(--warn);font-weight:700}
[data-env="night"] .pill.bad[data-headset],[data-env="night"] .chipbar button.pill.warn{animation:none;border-color:#ef6868;color:#ef6868}   /* R2-05: the bright night red, and no blink at night */
.pill{font-size:11px;letter-spacing:.2em;font-weight:700;padding:4px 14px;transform:skewX(-10deg);background:var(--plate);border:1px solid var(--edge);color:var(--mut)}
.pill .unskew{display:inline-block;transform:skewX(10deg)}
/* a pill that is also a control: same look, real tap target (min 44px per the tap audit) */
button.pill{font-family:inherit;cursor:pointer;min-height:44px;pointer-events:auto}   /* #chips is pointer-events:none, so a pill button has to opt back in or its tap never lands */
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.bad{border-color:var(--bad);color:var(--bad);animation:blink 1.4s infinite}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.prompt{position:absolute;left:50%;top:140px;transform:translateX(-50%) skewX(-10deg);background:var(--warn);color:#1a1200;font-family:var(--fd);font-weight:700;padding:8px 28px;white-space:nowrap}
.prompt .unskew{display:flex;flex-direction:column;align-items:center;transform:skewX(10deg);line-height:1.1}
.prompt .pl{font-family:var(--fl);font-size:11px;letter-spacing:.3em;font-weight:700;opacity:.8}
.prompt .pi{font-size:26px;letter-spacing:.14em}
.infobtn{position:absolute;top:2px;right:2px;width:36px;height:36px;border:1px solid var(--edge);color:var(--mut);font:600 13px var(--fl);display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:5}
/* QA-11 (2026-09-23): a 56px tap area (44px on screen on an SE) on a 36px visual. The frame clips anything above its
   top edge (an SE letterboxes it), so the ⓘ's area hangs from the frame top (0-56) and #skin sits below it (top 66, not
   42: its area is 56-112). The two areas meet and never overlap. */
.infobtn::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px}
#info::after{top:-2px;transform:translateX(-50%)}
#info .infog{width:20px;height:20px;display:block;pointer-events:none}   /* QA-28: drawn, not the U+24D8 glyph */
[data-env="night"] .infobtn{color:var(--num);border-color:var(--edge)}   /* QA-01: --mut was 2.7:1 */

/* ============ diagnostics ============ */
#diag{position:absolute;top:0;right:0;bottom:0;width:60%;background:#04080e;border-left:1px solid var(--edge);overflow:hidden;font:11px/1.5 ui-monospace,monospace;color:var(--mut);display:none;flex-direction:column;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#diag.open{display:flex}
#diag .dbody{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:20px 24px 10px;-webkit-overflow-scrolling:touch}   /* F122: the readouts scroll, the actions do not */
#diag h3{margin:12px 0 4px;font:700 11px var(--fl);letter-spacing:.2em;color:var(--glow)}
#diag .kv{display:grid;grid-template-columns:150px 1fr;gap:2px 10px}
#diag .ok{color:var(--ok)}#diag .bad{color:var(--bad)}
#diag .btns{flex:0 0 auto;display:flex;gap:6px;flex-wrap:nowrap;padding:5px 20px calc(5px + env(safe-area-inset-bottom,0px));background:#02050a;border-top:1px solid var(--edge)}   /* ONE row: wrapped it ran to 117px — 30% of a 390px panel — and pushed the log it sits under out of sight */   /* F122: SHARE LOG is the only way to flush the BLE frame ring and it sat BELOW a growing log — it is now always on screen */
#diag .btns button{flex:0 1 auto;min-width:0;white-space:nowrap;font:700 11px var(--fl);letter-spacing:.06em;padding:8px 10px;border:1px solid var(--edge);color:var(--num);min-height:44px;background:rgba(12,28,44,.85)}   /* one-handed, in the dark: the repo's upper tap-target bound, not its lower one */
#diag .btns button.danger{border-color:var(--bad);color:var(--bad)}
#diag pre{white-space:pre-wrap;word-break:break-all;margin:0;max-height:160px;overflow:auto;background:#000;padding:6px}
/* F156/F135 (field 2026-09-12): SCAN QR + the typed address, reachable from every phase — fixed at the top of
   the panel (never scrolls away with the readouts below it), the same way SHARE LOG is fixed at the bottom. */
/* QA-24 (2026-09-23): the ✕ is gone (CLOSE in the action row is the one close), so the block starts at the top, and
   SCAN QR shares the address row: the readouts below get back ~70px. */
#diag .mcjoin{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:16px 24px 12px;border-bottom:1px solid var(--edge)}
#diag .mcjoin>*{grid-column:1/-1}#diag .mcjoin>.mcin{grid-column:1}#diag .mcjoin>.qrbtn{grid-column:2}
#diag .mcjoin>#dg-discovered:empty,#diag .mcjoin>#dg-mcjoinhint:empty{display:none}
#diag .mcjoinnote{font:700 11px var(--fl);letter-spacing:.14em;color:var(--glow)}
#diag .mcjoin .mcin input{width:auto;flex:1 1 auto;min-width:0}
#diag .mcjoin .qrbtn{align-self:center}
/* Polish-loop pass 1 (2026-09-12): what CONNECT/SCAN QR are for, normally — or, armed/live only, the
   two-tap warning (`.warn`) `hud.js`'s `_click` swaps it for. Empty when there is nothing to say (put()
   never touches an unchanged section, so an empty string here collapses it to no visible gap). */
#diag .mcjoinhint{font:11px/1.4 ui-monospace,monospace;color:var(--mut)}
#diag .mcjoinhint .warn{color:var(--warn);font-weight:700}
/* Bench 2026-09-17: RELINK GUN's LIVE confirm line, just above the button row. Empty = no gap. */
#diag .gunhint{flex:0 0 auto;padding:6px 20px 0;font:11px/1.4 ui-monospace,monospace;background:#02050a;border-top:1px solid var(--edge)}
/* QA-01/QA-24 night: red on black. The day panel's blue-black fills dropped the action row to 3.7:1, and --glow
   (transparent at night) hid the PREFLIGHT headings and the MISSION CONTROL line. */
[data-env="night"] #diag,[data-env="night"] #diag .btns,[data-env="night"] #diag .gunhint,[data-env="night"] #diag .btns button{background:#000}
[data-env="night"] #diag h3,[data-env="night"] #diag .mcjoinnote{color:var(--num)}
#diag .gunhint:empty{display:none}
#diag .gunhint .warn{color:var(--warn);font-weight:700}
#diag .btns button:disabled{opacity:.55}
/* Polish-loop pass 1: a LAN-sweep hit MC, offered rather than auto-joined — one tap accepts it. Same row
   in the pre-join screen (`.lobby .discoveredrow`, glow-styled like the rest of that screen) and the ⓘ
   panel (dark/monospace, `#diag .discoveredrow`) — absent (not merely empty) when nothing was found, so it
   never reserves space of its own. */
.discoveredrow{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;background:rgba(57,224,124,.12);border:1px solid var(--ok);color:var(--ok);font-weight:700;font-size:12px;letter-spacing:.1em;text-align:center;pointer-events:auto;cursor:pointer}
#diag .discoveredrow{font-family:ui-monospace,monospace}
/* `.foot` is a single-row flex line (mcin/qrbtn/note share it) — a flex ITEM here just squeezes into that
   row and wraps its own text across several narrow lines. Same fix as `.kitlock` right above it: lift it
   out of the flex flow into its own row directly above `.foot`. */
.lobby .foot .discoveredrow{position:absolute;left:0;right:0;bottom:100%;margin-bottom:10px;font-family:var(--fl);letter-spacing:.04em;white-space:nowrap;font-size:14px}   /* HUD QA R2-06: 11 px on the SE screen, was 8.7 */
/* HUD QA R2-06: an UNVERIFIED host is a warning, not a trusted row: amber and a drawn glyph by day, the bright night red pair
   at night. Every row leaves green at night (spec B4). */
.discoveredrow{gap:8px}
.discoveredrow .dwarn{flex:0 0 auto;width:16px;height:14px}
.discoveredrow.warn{background:rgba(255,176,32,.12);border-color:var(--warn);color:var(--warn)}
[data-env="night"] .discoveredrow{background:#140505;border-color:var(--num);color:var(--num)}
[data-env="night"] .discoveredrow.warn{background:#2a0c0c;border-color:#ef6868;color:#ef6868}

/* ============ shot-ready cue (bench 2026-09-17) ============
   hud.js `_shotCue`: after a shot from a weapon with >= 400 ms between rounds the frame carries data-cool="on"
   (the gauge dims) until the round is due, then "ready" for 250 ms (one green shine across the gauge). Opacity,
   filter and transform only. Reduced motion and night get a brief brightness step instead of the moving shine. */
.ammo .pips{position:relative;transition:opacity 90ms linear,filter 90ms linear}
#frame[data-cool="on"] .ammo .pips{opacity:.5;filter:saturate(.35)}
.ammo .pips::after{content:'';position:absolute;top:-4px;bottom:-4px;left:0;width:34%;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,transparent,rgba(90,255,150,.85) 50%,transparent);transform:translateX(-100%)}
#frame[data-cool="ready"] .ammo .pips::after{animation:readyshine 250ms ease-out both}
@keyframes readyshine{0%{opacity:0;transform:translateX(-100%)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(300%)}}
[data-env="night"] .ammo .pips::after{display:none}
/* night hides the pips of a small magazine, so the round digits carry the cue there too */
#frame[data-env="night"] .ammo .mag{transition:opacity 90ms linear,filter 90ms linear}
#frame[data-env="night"][data-cool="on"] .ammo .mag{opacity:.5}
#frame[data-env="night"][data-cool="ready"] .ammo .pips,#frame[data-env="night"][data-cool="ready"] .ammo .mag{filter:brightness(1.3)}
@media (prefers-reduced-motion:reduce){.ammo .pips::after{display:none}#frame[data-cool="ready"] .ammo .pips{filter:brightness(1.5)}}

/* ============ live scores overlay (bench 2026-09-17) ============
   hud.js `_board`: opened from the player name (PLAYERS) or the match clock (TEAMS). The panel sits between the
   HP digits and the ammo column; a tap outside it or on the ✕ closes it. The chip bar hides while it is open. */
.bdscrim{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.28)}
/* Office test 2026-09-19: the game-time readout is `.clockplate` (top:26px, ~44px tall with its
   30px digits), so a panel starting at top:62px sat under its last few pixels. Moved below it with a
   clean gap. */
.bdpanel{position:absolute;z-index:6;left:50%;top:80px;transform:translateX(-50%);width:420px;max-height:258px;display:flex;flex-direction:column;background:var(--plate2);border:1px solid var(--edge);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.bdhead{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 10px;border-bottom:1px solid var(--edge)}
.bdseg{display:flex}
.bdseg .sg{min-height:44px;padding:0 12px;border:1px solid var(--edge);background:var(--plate);color:var(--mut);font-weight:700;font-size:12px;letter-spacing:.16em;transform:skewX(-8deg)}
.bdseg .sg+.sg{border-left:0}.bdseg .sg .unskew{transform:skewX(8deg)}
.bdseg .sg.on{background:var(--team);color:var(--team-ink);border-color:var(--team)}
.bdage{flex:1;text-align:right;font-size:11px;letter-spacing:.14em;color:var(--mut);font-weight:700;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.bdage.stale{color:var(--warn)}
.bdx{flex:0 0 44px;height:44px;font-size:20px;color:var(--num);border:1px solid var(--edge);background:var(--plate)}
.bdbody{overflow:hidden auto;min-height:0;padding:6px 10px 8px}
.bdr{display:grid;grid-template-columns:22px minmax(0,1fr) 30px 30px 30px 44px;column-gap:8px;align-items:center;font-size:14px;padding:3px 4px;border-bottom:1px solid rgba(42,78,110,.35)}
.bdr.rank{grid-template-columns:22px minmax(0,1fr) 60px}
.bdr.bdh{font-size:11px;letter-spacing:.14em;color:var(--mut);font-weight:700}
.bdr > span:not(.pn){text-align:right}
.bdr .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;letter-spacing:.06em}
/* Office test 2026-09-19 (Teams tab): the row's own padding-left was 4px, 1px clear of the 3px active-
   player bar this box-shadow draws inset -- the name almost touched it. */
.bdr.me{color:var(--glow);background:rgba(95,214,255,.12);box-shadow:inset 3px 0 0 var(--glow);padding-left:10px}
.bdteams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bdteam{display:flex;flex-direction:column;gap:3px;border:1px solid var(--edge);padding:6px;min-width:0}
.bdteam.mine{border-color:var(--team)}
.bdteam .tm{align-self:flex-start;padding:2px 11px;font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.14em;transform:skewX(-12deg);max-width:100%;overflow:hidden}
.bdr.tp{grid-template-columns:minmax(0,1fr) auto;font-size:13px}
.bdcap,.bdnone{font-size:11px;letter-spacing:.14em;color:var(--mut);font-weight:700;padding-top:6px}
/* Bench 2026-09-17: `button.pill{pointer-events:auto}` (above) opts back in REGARDLESS of its ancestor,
   so hiding #chips with opacity alone still left a hidden RECONNECT/GUN LINK LOST button tappable over
   the panel's own tab row (`#chips` itself is z-index 4, a SIBLING of `#hud`, so it sits above the whole
   #hud subtree -- including the panel's own locally-higher z-index -- everywhere the two overlap). The
   button selector below has to out-specify that opt-in, not just repeat `pointer-events:none` on the
   ancestor: (2 ids + 1 attr + 1 tag + 1 class) beats `button.pill`'s (1 tag + 1 class). */
#frame[data-board] #chips{opacity:0;pointer-events:none}
#frame[data-board] #chips button.pill{pointer-events:none}
[data-env="night"] .bdscrim{background:rgba(0,0,0,.5)}
[data-env="night"] .bdpanel{background:#000;box-shadow:none}
[data-env="night"] .bdr.me{color:var(--num);background:#1a0606;box-shadow:inset 3px 0 0 var(--num)}
[data-env="night"] .bdseg .sg.on{background:#2a0c0c;color:var(--num)}

/* ============ keyframes ============ */
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes hudglow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@keyframes hzin{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes punch{from{transform:scale(1.15)}to{transform:scale(1)}}
@keyframes whiteout{from{opacity:1}to{opacity:0}}
@keyframes slam{0%{transform:scale(1.8);opacity:0}60%{transform:scale(.96) translate(2px,-1px);opacity:1}80%{transform:scale(1.02) translate(-2px,1px)}100%{transform:scale(1)}}
@keyframes shimmer{0%{filter:brightness(1)}40%{filter:brightness(1.6) hue-rotate(20deg)}100%{filter:brightness(1)}}
@keyframes collapse{to{transform:scale(.05);opacity:0}}
@keyframes redflood{from{opacity:0}to{opacity:1}}
@keyframes heartbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.04)}24%{transform:scale(1)}}
@keyframes wipein{from{transform:translateX(-110%) skewX(-14deg)}to{transform:translateX(0) skewX(-14deg)}}
@keyframes trackin{from{opacity:0;transform:translate(24px,-50%)}to{opacity:1;transform:translate(0,-50%)}}
@keyframes wipeout{to{transform:translateX(120%);opacity:0}}

/* ============ A24 FINAL RESULTS + MATCH HISTORY (node.md §3.13, game test 2026-09-11 D3) ============
   A flex column: head (fixed) · body (absorbs the remainder and scrolls inside itself) · strips · my-line
   tiles · foot. Nothing here is sized for five cells, two teams or one screen height: the tile row's column
   count is written by the renderer and every list scrolls rather than pushing the footer off the frame.
   EVERY meaning-bearing label is >= 11px — the old `.cell span` was 9.5px, which is what the report was about. */
.result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:5px;padding:10px 26px 9px;overflow:hidden}
.result .rhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:14px;flex:0 0 auto;padding-right:26px}   /* the right column stops clear of the 36px ⓘ corner box */
.result .rkick{grid-column:1;grid-row:1;font-size:11px;letter-spacing:.28em;color:var(--mut);font-weight:700;white-space:nowrap}
.result .rh1{grid-column:1;grid-row:2;font-family:var(--fd);font-style:italic;font-weight:700;letter-spacing:.14em;color:var(--num);transform:skewX(-8deg)}
.result .rh1 .unskew{display:inline-block;transform:skewX(8deg)}
.result .rh1.w{font-size:42px;line-height:1.02;white-space:nowrap;text-shadow:0 0 40px rgba(122,190,255,.35)}
.result .rh1.p{font-size:18px;line-height:1.2;letter-spacing:.1em;color:var(--warn);max-width:560px}
.result .rh1.win{color:var(--ok)}.result .rh1.lose{color:var(--bad)}.result .rh1.draw,.result .rh1.undecided{color:var(--warn)}
.result .rmeta{grid-column:2;grid-row:2;font-size:11px;letter-spacing:.18em;color:var(--mut);font-weight:600;align-self:flex-end;padding-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .rseg{grid-column:3;grid-row:1/span 2;display:flex;align-self:end;pointer-events:auto}   /* QA-14: bottom of the header, so a pill in the top-right strip clears it */
.result .rseg .sg{min-height:38px;padding:0 15px;border:1px solid var(--edge);background:var(--plate);color:var(--mut);font-family:var(--fd);font-weight:700;font-size:14px;letter-spacing:.18em;transform:skewX(-8deg)}
.result .rseg .sg+.sg{border-left:0}
.result .rseg .sg .unskew{display:inline-block;transform:skewX(8deg)}
.result .rseg .sg.on{background:var(--team);color:var(--team-ink);border-color:var(--team)}
.result .rbody{flex:1 1 auto;min-height:0;overflow:hidden}
/* --- waiting for the push: what the screen knows, and never an outcome --- */
.result .rwait{display:flex;flex-direction:column;justify-content:center;gap:8px;height:100%;border-left:3px solid var(--warn);padding:6px 16px}   /* QA-14: no dashed empty panel; the words sit in the middle of the body on one amber rule */
.result .rwait .wl{font-size:15px;line-height:1.45;color:var(--num);max-width:660px}
.result .rwait .wl.dim{color:var(--mut);font-size:13px}
/* --- TEAM view --- */
.result .rteams{display:grid;gap:10px;height:100%;min-height:0}
/* Bench 2026-09-18 (Tony), third pass: on YOUR team the left edge is the team colour and the names sat hard
   against it. 9px of padding did not fix it and nor did 15px, because distance was only half of it:
   a 1px SATURATED line beside text reads as a collision at any small gap. So the left edge becomes a rail
   (the 1px border plus a 3px inset shadow, which costs no layout) and the contents stand 17px clear of its
   inner face -- one line-height of the 13px names, the point at which a column stops looking pinned to a rule.
   Both cards take the same 20px so the two lists still line up with each other. */
.result .rteam{display:flex;flex-direction:column;gap:5px;min-height:0;border:1px solid var(--edge);background:var(--plate);padding:7px 12px 7px 20px}
.result .rteam.mine{border-color:var(--team);box-shadow:inset 3px 0 0 var(--team)}
/* The chip leans (skewX -12deg), so its bounding box juts ~4px further left than the padding edge and left
   the card with two left edges. The margin puts its leading corner back on the one the list uses. */
.result .rteam .tm{display:inline-block;align-self:flex-start;margin-left:4px;padding:2px 11px;font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.14em;transform:skewX(-12deg);max-width:calc(100% - 4px);overflow:hidden}   /* -4px: the margin must come out of the chip's own width, not out of the card's right gutter */
.result .rteam .tm .unskew{display:inline-block;transform:skewX(12deg);white-space:nowrap}
.result .rteam .tm b{font-size:21px;margin-left:5px}
.result .thold{font-size:11px;letter-spacing:.18em;color:var(--mut);font-weight:600;white-space:nowrap}
.result .thold b{color:var(--num);font-family:var(--fd);font-size:15px}
.result .tpl{flex:1 1 auto;min-height:0;overflow:hidden auto}
.result .tph{display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.14em;color:var(--mut);font-weight:700;border-bottom:1px solid var(--edge);padding-bottom:3px;margin-bottom:2px;white-space:nowrap}
.result .tp{display:flex;justify-content:space-between;gap:10px;font-size:13px;letter-spacing:.05em;padding:1px 0}
.result .tp .pn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result .tp .pv{color:var(--mut);white-space:nowrap}
.result .tp.me,.result .tp.me .pv{color:var(--glow)}
/* Office test 2026-09-19: K/D/A used to be one "K · D · A" / "5 · 2 · 1" string, right-aligned as a
   whole -- the header letters never sat over their own number once a value ran to two digits. Each stat
   now gets its own fixed-width, right-aligned cell, so the header and every row share the same three
   column positions regardless of digit count. */
.result .tph .kda,.result .tp .kda{display:inline-flex;gap:6px}
.result .tph .kda i,.result .tp .kda i{display:inline-block;width:14px;text-align:right;font-style:normal}
.result .tp.none{display:block;color:var(--mut);font-size:11px;letter-spacing:.16em;font-weight:600}
/* --- PLAYER view (the leaderboard) --- */
.result .rlb{display:flex;flex-direction:column;height:100%;min-height:0}
.result .lbh,.result .lbr{display:grid;grid-template-columns:24px minmax(0,1fr) 36px 36px 36px 44px 50px 46px minmax(0,1.1fr);align-items:center;column-gap:8px;padding-left:6px}
.result .lbh{font-size:11px;letter-spacing:.14em;color:var(--mut);font-weight:700;border-bottom:1px solid var(--edge);padding-bottom:4px;flex:0 0 auto}
.result .lbrows{flex:1 1 auto;min-height:0;overflow:hidden auto}
.result .lbr{font-size:14px;padding:3px 0;border-bottom:1px solid rgba(42,78,110,.35)}
.result .lbr.me{color:var(--glow);background:rgba(95,214,255,.08)}
/* QA-07: night sets --glow to transparent, so the player's own row (TEAMS and PLAYERS) painted its text in the
   colour of its own background, 1:1. At night the row takes a dim red band, a --num edge and a lifted red ink
   that clears 4.5:1 on that band; every cell (medals, a provisional ACC) takes the same ink. */
[data-env="night"] .result .lbr.me,[data-env="night"] .result .tp.me{background:#1a0606;box-shadow:inset 3px 0 0 var(--num)}
[data-env="night"] .result .lbr.me,[data-env="night"] .result .lbr.me .c,[data-env="night"] .result .tp.me,[data-env="night"] .result .tp.me .pv{color:#e06a6a}
[data-env="night"] .result .tp.me{padding-left:6px}
.result .lbh .c,.result .lbr .c{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.result .lbh .c.n,.result .lbr .c.n,.result .lbh .c.m,.result .lbr .c.m{text-align:left}
.result .lbr .c.n .dot{display:inline-block;width:7px;height:7px;margin-right:6px;vertical-align:middle}
.result .lbr .c.m{font-size:11px;letter-spacing:.08em;color:var(--warn);font-weight:600}
.result .lbr .c.prov{color:var(--mut)}
.result .lbnone{font-size:12px;letter-spacing:.14em;color:var(--mut);padding:16px 2px;font-weight:600}
/* --- strips: possession · honors · the unofficial post-whistle tally --- */
.result .rstrip{display:flex;align-items:center;gap:10px;flex:0 0 auto;font-size:11px;letter-spacing:.14em;font-weight:600;min-height:18px;overflow:hidden}
.result .rstrip .k{color:var(--mut);white-space:nowrap}
.result .rstrip .v{display:flex;gap:7px;overflow:hidden;min-width:0}
.result .rstrip .ch{border:1px solid var(--edge);padding:0 7px;white-space:nowrap;color:var(--num);overflow:hidden;text-overflow:ellipsis;line-height:18px}
.result .rstrip .ch b{font-family:var(--fd);font-size:12px}
.result .rstrip.hon .ch{color:var(--warn);border-color:var(--warn)}
.result .rstrip.after .k{color:var(--warn)}
.result .rstrip.after .ch{border-style:dashed;color:var(--mut)}
/* --- this player's own line, as a LIST of tiles (never five fixed cells) --- */
.result .rstats{display:grid;gap:8px;flex:0 0 auto}
.result .rstats .cell{min-width:0;border:1px solid var(--edge);background:var(--plate);padding:4px 4px 5px;text-align:center;transform:skewX(-8deg)}
.result .rstats .cell b{display:block;font-family:var(--fd);font-weight:700;font-size:22px;line-height:1.05;color:var(--num);transform:skewX(8deg);white-space:nowrap}
.result .rstats .cell span{display:block;margin-top:1px;font-size:11px;letter-spacing:.1em;color:var(--mut);font-weight:600;transform:skewX(8deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* --- footer --- */
.result .rfoot{position:static;left:auto;right:auto;bottom:auto;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:16px;flex:0 0 auto}
.result .rfoot .fl{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 auto}   /* the blinking RETURN line sat a pixel off the sync line under it (design-result-pending.png) */
.result .rfoot .ready{flex:0 0 auto;width:auto;min-width:180px;height:44px;font-size:21px;margin:0}
.result .rfoot .ready.ghost{background:transparent;color:var(--mut);border:1px solid var(--edge);box-shadow:none}
.result .syncline{font-size:11px;letter-spacing:.2em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .syncline.ok{color:var(--ok)}.result .syncline.warn{color:var(--warn)}
.result .sess{font-size:11px;letter-spacing:.16em;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .mcvline{font-size:11px;letter-spacing:.14em;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Blinks only while the result is NOT in — which is exactly when walking back to MC is the thing to do (D3). */
.result .retmc{font-size:13px;letter-spacing:.2em;color:var(--warn);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:retblink 1.1s steps(1,end) infinite}
@keyframes retblink{0%,55%{opacity:1}56%,100%{opacity:.22}}
/* --- MATCH HISTORY --- */
.result.hist .hlist{height:100%;overflow:hidden auto}
.result.hist .hr{display:grid;grid-template-columns:66px 92px 112px minmax(0,1fr) 92px 46px;align-items:center;column-gap:10px;font-size:13px;padding:3px 0;border-bottom:1px solid rgba(42,78,110,.35)}
.result.hist .hr.hh{font-size:11px;letter-spacing:.14em;color:var(--mut);font-weight:700;border-bottom:1px solid var(--edge);padding-bottom:4px}
.result.hist .hr .c{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.result.hist .hr .c.k,.result.hist .hr .c.b{text-align:right}
.result.hist .hr .c.s{color:var(--mut)}
.result.hist .hr .c.o{font-weight:700;letter-spacing:.1em}
.result.hist .hr .c.o.win{color:var(--ok)}.result.hist .hr .c.o.lose{color:var(--bad)}
.result.hist .hr .c.o.draw,.result.hist .hr .c.o.undecided{color:var(--warn)}
.result.hist .hr .c.o.none{color:var(--mut);font-weight:600;font-size:11px}
.result.hist .rfoot .sess{white-space:normal;line-height:1.35}
/* the over screen's way back in (A24) */
.lobby .overbtns{display:flex;gap:8px;pointer-events:auto}
.lobby .overbtns .briefbtn{min-height:38px}
.lobby .status b.oc.lose{color:var(--bad)}.lobby .status b.oc.draw,.lobby .status b.oc.undecided{color:var(--warn)}
/* A31: the compiled "win is confirmed at MC" line — on ARMED above the T-minus, and on the DOWN screen at cap-1 */
.mo.tminus .mcv{position:absolute;top:34px;left:52px;right:52px;text-align:center;pointer-events:none}   /* clear of the 26px hazard stripe — over it the line was unreadable */
.mo.tminus .mcv span{display:inline-block;max-width:100%;font-size:12px;letter-spacing:.18em;color:var(--mut);font-weight:700;background:rgba(3,6,12,.82);border:1px solid var(--edge);padding:3px 12px}
.down .recap{flex-wrap:wrap;row-gap:6px}
.down .recap .capwarn{flex:0 0 100%;text-align:center;font-size:12px;letter-spacing:.16em;color:var(--warn);font-weight:700;transform:skewX(-10deg)}
.down .recap .capwarn .unskew{display:inline-block;transform:skewX(10deg);white-space:normal}
/* The death screen (2026-09-23, src/hud/deathscreen.js; Tony: "what were we killed by and just a few callouts").
   Left: DOWN, the killer and the final hit, then four callouts. Right: the countdown or the station hint. Bottom: the
   game strip. Icons are inline SVG in currentColor (emoji would render in colour on Android). */
.down .c{top:44px;bottom:92px;left:32px;right:64px;transform:none;justify-content:space-between;gap:20px}   /* 92: the pill band (68-90) and the game strip stay clear */
.down .dsx{display:flex;flex-direction:column;gap:26px;flex:0 0 460px;min-width:0;align-self:stretch;justify-content:center}
.down .dsx .l2{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:18px;row-gap:6px;align-items:center}   /* DOWN beside the killer and the final hit */
.down .dsx .l2 > .t,.down .dsx .l2 > .tt{grid-row:1 / span 2}.down .dsx .l2 > .kb{grid-column:2;justify-self:start}.down .dsx .l2 > #dnlife{grid-column:2}
.down .dsx .t{font-size:48px;line-height:1}.down .dsx .tt{height:48px;width:190px;min-width:0}.down .dsx .tt.rec{width:300px}.down .dsx .tt.rec .t{font-size:32px}.down .dsx .tt .t{left:0;right:auto}.down .dsx .tt .t2{font-size:24px;text-align:left}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}   /* read aloud, not drawn */
.down .ic{width:1em;height:1em;flex:none;vertical-align:-.12em}
.down .dsx .kb{font-size:18px;gap:8px;color:var(--bad)}.down .dsx .kb b{font-size:16px}
.down .fh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;white-space:nowrap}
.down .fh .fw{font-size:14px;letter-spacing:.12em;color:var(--num);font-weight:700}
.down .fh .fd{display:inline-flex;align-items:center;gap:5px;font-size:15px;color:var(--mut)}.down .fh .fd b{font-family:var(--fd);font-size:24px;line-height:1;color:var(--bad)}
.down .pk,.down .cr{font-style:normal;font-size:11px;letter-spacing:.14em;font-weight:700;padding:0 4px;border:1px solid var(--edge);color:var(--mut)}.down .cr{border-color:var(--warn);color:var(--warn)}
.down .dco{display:flex;gap:30px}   /* only the callouts that have a value are drawn, left to right */
.down .co{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:7px;align-items:center}
.down .co .ic{grid-row:1 / span 2;width:20px;height:20px;color:var(--mut)}.down .co.tk .ic{color:var(--bad)}.down .co.dl .ic{color:var(--ok)}
.down .co b{font-family:var(--fd);font-size:32px;line-height:1;color:var(--num);white-space:nowrap}
.down .co .cl{font-size:11px;letter-spacing:.22em;color:var(--mut);font-weight:700}
.down .co.unsure b{color:var(--mut)}   /* a relay may still be missing: the number is what arrived so far */
.down .co b{position:relative;justify-self:start}.down .co .us{position:absolute;left:100%;top:0;margin-left:3px;line-height:0}   /* out of the line box: every number keeps one baseline */.down .co.unsure .us .ic{width:13px;height:13px;color:var(--warn)}[data-env="night"] .down .co.unsure .us .ic{color:#ff8a8a}
.down .dnk{grid-column:1 / -1;font-size:12px;letter-spacing:.14em;color:var(--mut);font-weight:700}
.down .recap{bottom:18px;gap:34px;align-items:center}
.down .recap .rv{font-size:13px;gap:6px;align-items:center}.down .recap .rv b{font-size:22px}.down .recap .rv .ic{width:15px;height:15px;color:var(--mut)}
.down .recap .cap{font-family:var(--fd);font-size:16px;color:var(--mut);letter-spacing:.04em}.down .recap .ld{font-size:12px;letter-spacing:.12em;color:var(--mut);margin-left:6px}.down .recap .ld b{font-size:16px}
.down .recap .ag{font-style:normal;font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--warn);margin-left:4px}
.down .recap .tm .ic{width:12px;height:12px;vertical-align:-.1em}
.down .recap .capwarn{position:absolute;left:0;right:0;bottom:calc(100% + 10px)}   /* the A31 line rides in the pill band, so the strip never grows into the callouts */
[data-env="night"] .down .dsx .kb,[data-env="night"] .down .fh .fd b,[data-env="night"] .down .co .ic{color:#ff8a8a}[data-env="night"] .down .cr,[data-env="night"] .down .recap .ag{color:#ff8a8a;border-color:#ff8a8a}
/* the countdown / station column takes what the 460px left column leaves, and its copy wraps inside it */
.down .c > .dn{flex:1 1 0;min-width:0}.down .c > .dn .ins{white-space:normal;font-size:22px;line-height:1.1}.down .c > .dn .lab{white-space:normal}.down .c > .dn .near{max-width:100%}
/* the spawn-kill warning (levels 2 and 3) is bigger than level 1: the killer starts under it, never beneath it */
.down:has(.safe.w2) .c,.down:has(.safe.w3) .c{top:72px}
#frame[data-down] .chipbar{top:auto;bottom:74px;left:32px;transform:none;flex-direction:row;gap:8px}   /* the death screen: the band between THIS LIFE and THE GAME NOW */
/* connected screen: unmistakable MC state (bench 2026-08-25) */
.mclinked{flex:1;display:flex;align-items:center;justify-content:center;min-height:96px;padding:0 22px;border:1px solid var(--ok);color:var(--ok);font-family:var(--fd);font-style:italic;font-weight:700;font-size:28px;letter-spacing:.2em;transform:skewX(-10deg);box-shadow:0 0 40px -12px var(--ok)}
/* F137 (field 2026-09-12): no padding + no nowrap let "MC LINKED ✓ — WAITING FOR KIT-OUT" wrap to two
   UNCENTRED lines (the flex box centres the BLOCK, not each wrapped line) with the first touching the
   border. nowrap+overflow:hidden restores the measure-then-shrink contract every other long-string button
   in this file already uses (`.redeploy .r .t`, `_fitBriefing`) — `_fitMcLinked` (hud.js) does the shrinking. */
.mclinked .unskew{display:inline-block;min-width:0;max-width:100%;overflow:hidden;white-space:nowrap;transform:skewX(10deg)}

/* kit-out try-out panel + loadout weapon thumb (2026-08-26) */
.tryout{position:absolute;top:118px;left:36px;right:36px;display:flex;gap:16px;border:1px solid var(--edge);background:var(--plate);padding:8px 18px;transform:skewX(-8deg)}   /* slanted like the plates and the buttons beside it (review #28) */
.tryout > *{transform:skewX(8deg)}
.tryout .facts{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}   /* F111 made real 2026-09-12: MC's WeaponView facts (dmg · htk · kill · reload) wrapped to two lines and the panel grew into READY UP; one clamped line here, the full detail lives in the rack's ⓘ pane */
.tryout .art{flex:0 0 220px;height:120px;background-color:#0a1626;background-size:contain;background-repeat:no-repeat;background-position:center;border:1px solid var(--edge)}
.tryout .art .wpicfb svg{width:56px;height:56px}
.tryout .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center}
.tryout .facts{margin-top:2px;line-height:1.4}
.tryout .lbl{font-size:11px;letter-spacing:.24em;color:var(--warn);font-weight:700}
.tryout .nm{font-family:var(--fd);font-style:italic;font-weight:700;font-size:24px;letter-spacing:.06em;color:var(--num)}
.tryout .ln{font-size:12px;letter-spacing:.14em;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tryout .tb{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.2em;color:var(--mut);font-weight:600}
.tryout .tb span{width:104px;flex:0 0 104px}   /* fits RATE OF FIRE / AMMO CARRIED / KILL SPEED without wrapping */
.tryout .tb span{width:34px}
.tryout .tb i{flex:1;height:6px;background:var(--inset,#0a1626);border:1px solid var(--edge);display:block}
.tryout .tb b{display:block;height:100%;background:var(--glow)}
.plate.wart{display:flex;align-items:stretch;gap:0;padding:0;overflow:hidden}
.plate.wart .thumb{flex:0 0 96px;background-size:cover;background-position:center}
/* ============ A9 loadout: slot plates (KITTED) + the LOADOUT browser (docs/spec/loadout.md §4.5) ============ */
.plate.slot{display:flex;gap:10px;align-items:center;flex:0 0 250px;min-height:78px;padding:8px 10px;position:relative;pointer-events:auto}   /* A14: three plates in the 772px row */
.lobby .plates > .plate:not(.slot){flex:1 1 120px;min-width:0}
.lobby .plates > .plate:not(.slot) .h,.lobby .plates > .plate:not(.slot) .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Weapon art: an <img>, not a CSS background, because a background-image has no onerror hook — a
   missing jpg (`weaponArt` in hud.js) swaps to a generic glyph instead of showing an empty box. Both
   are sized to fill whatever box they sit in, so every weapon-art spot below only sets the glyph's
   own svg size, the same way it already sizes the equivalent perk glyph. */
.wpic{display:block;width:100%;height:100%;object-fit:contain}
.wpicfb{display:none;width:100%;height:100%;align-items:center;justify-content:center;color:var(--glow)}
.plate.slot .thumb{flex:0 0 72px;height:54px;border:1px solid var(--edge);background-color:#0a1626;background-size:contain;background-repeat:no-repeat;background-position:center;transform:skewX(8deg)}
.plate.slot .thumb.perk,.plate.slot .thumb.none{display:flex;align-items:center;justify-content:center;color:var(--glow);background:var(--plate2)}
.plate.slot .thumb.perk svg{width:36px;height:36px}
.plate.slot .thumb.none span{font-size:24px;color:var(--mut)}
.plate.slot .thumb .wpicfb svg{width:36px;height:36px}
.plate.slot .in{min-width:0;flex:1}
.plate.slot .k{font-size:11px;letter-spacing:.26em;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.plate.slot .k .lock{display:inline-flex}.lockg{width:14px;height:14px;vertical-align:-2px}.lolock .big .lockg{width:20px;height:20px;vertical-align:-3px}
.plate.slot .k .cue{margin-left:auto;color:var(--glow);font-size:16px;line-height:1}
.plate.slot .h{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate.slot.pk .thumb.perk{color:var(--perk,#c48bff)}.plate.slot.pk.tap{border-color:var(--perk,#c48bff);box-shadow:0 0 22px -12px var(--perk,#c48bff)}
.lobby .hpar{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--mut);margin-left:6px;white-space:nowrap}
.plate.slot .s{font-size:11px;letter-spacing:.03em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate.slot.tap{border-color:var(--glow);box-shadow:0 0 22px -12px var(--glow)}
.plate.slot.locked{opacity:.75}
.lobby .platehint{flex:0 0 100%;padding-left:8px;margin-top:-2px;font-size:11px;letter-spacing:.24em;color:var(--mut);font-weight:700}
.tryout .tact{flex:0 0 170px;display:flex;flex-direction:column;justify-content:center;gap:8px;pointer-events:auto}
.tryout .tact .small{line-height:1.4;letter-spacing:.08em}
.lobtn{height:48px;min-width:130px;padding:0 22px;font-family:var(--fd);font-weight:700;font-size:20px;letter-spacing:.16em;transform:skewX(-10deg);background:var(--glow);color:#04121e;pointer-events:auto}
.lobtn .unskew{display:inline-block;transform:skewX(10deg)}
.lobtn.ghost,.lobtn.done{background:var(--plate);color:var(--num);border:1px solid var(--edge)}
.lobtn.try{background:var(--warn);color:#1a1200}   /* the host-pushed try-out panel's own button */
.lobtn.review{background:var(--glow);color:#04121e}   /* A26: REVIEW KIT is the FORWARD action, not a caution */
.lo .lotop{position:absolute;top:0;left:36px;right:36px;height:62px;display:flex;align-items:flex-end;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--edge)}
.lotab{height:48px;min-width:186px;padding:0 18px;background:var(--plate2);border:1px solid var(--edge);color:var(--mut);transform:skewX(-10deg);text-align:left;pointer-events:auto}
.lotab .unskew{display:flex;flex-direction:column;transform:skewX(10deg);line-height:1.1}
.lotab .k{font-size:11px;letter-spacing:.26em;font-weight:700}
.lotab .v{font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:.06em;color:var(--num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:166px}
.lotab.on{background:var(--team);border-color:var(--team);color:var(--team-ink)}
.lotab.on .v{color:var(--team-ink)}
.lo .who{margin-left:auto;display:flex;align-items:baseline;gap:10px;padding:0 16px 6px 0}
.lo .who .cs{font-family:var(--fd);font-style:italic;font-weight:700;font-size:22px;letter-spacing:.08em;line-height:1}
.lo .who .num{font-family:var(--fd);font-weight:700;font-size:16px;color:var(--glow)}
.lo .lobody{position:absolute;top:70px;left:36px;right:36px;bottom:74px;display:flex;gap:16px}
.lo .lolist{flex:0 0 436px;overflow:hidden auto;display:flex;flex-direction:column;gap:6px;padding:0 6px 0 4px;pointer-events:auto}   /* A26 widened it by 32px: every row now carries its own 40px ⓘ, and the weapon NAME must not be the cell that pays for it (the detail pane keeps 320px, measured against its longest name) */
/* WEAPONS | PERKS | NONE. Field 2026-09-01: "the perks menu is really small and hard to see, it
   was hard to figure out how to open the perks menu". These are the only way to reach perks, so
   they are sized as the primary control they are, not as a filter chip. */
.lofilt{display:flex;gap:8px;margin-bottom:8px;padding-top:5px;flex:0 0 auto}   /* QA-11: room inside the scroller for the chips' 56 px hit box; the scroller clipped its top 5 px */
.fch{height:46px;min-width:0;flex:0 0 auto;padding:0 16px;background:var(--plate2);border:1px solid var(--edge);color:var(--ink);font-size:14px;letter-spacing:.14em;font-weight:700;transform:skewX(-10deg);position:relative;pointer-events:auto;white-space:nowrap}
.fch .unskew{display:inline-block;transform:skewX(10deg)}
.fch.on{background:var(--num);color:#04121e;border-color:var(--num)}
.fch.none{margin-left:auto}
.fch.none.on{background:var(--plate);color:var(--ok);border-color:var(--ok)}
.fch.pend{border-color:var(--glow);color:var(--glow)}
/* the ::after tap-area hack is gone: the chip is 46px tall now, so the control IS the tap target */
.lrow{display:flex;align-items:center;gap:10px;min-height:56px;padding:5px 6px 5px 6px;background:var(--plate);border:1px solid var(--edge);transform:skewX(-6deg);flex:0 0 auto;pointer-events:auto}
.lrow > *{transform:skewX(6deg)}
.lrow .thumb{flex:0 0 66px;height:36px;background-color:#0a1626;background-size:contain;background-repeat:no-repeat;background-position:center;border:1px solid var(--edge)}
.lrow .thumb.perk{display:flex;align-items:center;justify-content:center;color:var(--glow);background:var(--plate2)}
.lrow .thumb.perk svg{width:30px;height:30px}
.lrow .thumb .wpicfb svg{width:30px;height:30px}
.lrow .nm{font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.lrow .nm2{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.05}
.lrow .nm2 b{font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.lrow .role{font-size:11px;letter-spacing:.16em;color:var(--mut);font-weight:700;white-space:nowrap;flex:0 3 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}   /* the NAME wins the row: the role label gives way first */

/* A26: tapping a row EQUIPS AND ARMS it, so reading one without committing needs its own control. 40x40 so it
   is a real tap target on a phone, and it sits inside the row's own skew like every other cell. */
/* F145 (field 2026-09-12): the ⓘ read as tappable but sat at 40px with no expanded hit area, immediately
   against the row's own much larger tap zone (`onPickItem`) — a finger a couple px off the visual glyph
   landed on the row and equipped the weapon instead of opening its detail. `::after` is the SAME
   invisible-44px-hit-target trick `.infobtn`/`.qrbtn`/`.mcin button` already use in this file; it stays a
   CHILD of `.linfo` so a tap inside it still resolves (and delegates) to `.linfo`, never to the row under it. */
.lrow .linfo{flex:0 0 40px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--edge);color:var(--mut);padding:0;position:relative;pointer-events:auto}

.lrow.warn{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}.lrow.warn .st{color:var(--warn)}   /* A14: first tap of the ALT-button confirm */

.lo .lodetail .art.perk{display:flex;align-items:center;justify-content:center;color:var(--glow);background:var(--plate2)}

.lo .lodetail .ln{font-size:11px;letter-spacing:.14em;color:var(--mut);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lo .lodetail .ln.pk{white-space:normal;line-height:1.35}   /* a perk's effect line is a sentence, not MAG/RESERVE figures — it wraps rather than being cut */
.lo .lodetail .tb{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.2em;color:var(--mut);font-weight:600}

/* the real numbers that sit under the ranked bars (field 2026-08-30) */

.facts{font-size:11px;letter-spacing:.12em;color:var(--mut);margin-top:6px;line-height:1.7}

/* QA-18: night hides the weapon photo (above), which left an empty black box on every plate, row and the hero

/* ---------- A10 §4.1 / §4.6: setting-up state + BRIEFING ---------- */
.lobby .setup{flex:1;display:flex;align-items:center;gap:18px;min-height:76px;border:1px solid var(--edge);background:var(--plate);padding:14px 22px;transform:skewX(-8deg)}

.lobby .setup .t{font-family:var(--fd);font-style:italic;font-weight:700;font-size:24px;letter-spacing:.14em;color:var(--num);white-space:nowrap}
.lobby .setup .s{font-size:13px;color:var(--mut);font-weight:600;line-height:1.4}
.lobby .setup .pulse{display:flex;gap:6px;transform:skewX(8deg)}
.lobby .setup .pulse i{width:10px;height:10px;background:var(--glow);opacity:.25;animation:setupdot 1.8s infinite}
.lobby .setup .pulse i:nth-child(2){animation-delay:.3s}.lobby .setup .pulse i:nth-child(3){animation-delay:.6s}
@keyframes setupdot{0%,100%{opacity:.2}30%{opacity:1}}
.briefbtn{position:relative;margin-top:2px;border:1px solid var(--edge);color:var(--mut);font-family:var(--fd);font-weight:700;font-size:14px;letter-spacing:.2em;padding:0 14px;min-height:36px;transform:skewX(-10deg);pointer-events:auto}
.briefbtn .unskew{display:inline-block;transform:skewX(10deg)}
/* QA-11: 44 px on screen after the SE's 0.79 scale is 56 frame px. The kit, loadout and result controls keep
   their drawn size (the 390 px frame has no height to give) and take an invisible 56 px hit box, the same trick
   `.infobtn`/`.qrbtn`/`.linfo` already use. A list row is a real 56 px box instead: a hit box that spilled
   into the next row would steal its taps. */
.briefbtn::after,.lotab::after,.fch::after,.lobtn::after,.result .rseg .sg::after,.result .rfoot .ready::after{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:56px}
.lotab,.lobtn,.result .rseg .sg,.result .rfoot .ready{position:relative}
.bf{overflow:hidden}
.bf .bfart{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.55;animation:bfart 1.2s ease-out both}
.bf .bfveil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,4,7,.96) 0%,rgba(3,4,7,.86) 46%,rgba(3,4,7,.35) 100%),linear-gradient(0deg,rgba(3,4,7,.95) 0%,transparent 45%)}
.bf .bfbody{position:absolute;top:26px;left:36px;right:36px;bottom:96px;display:flex;flex-direction:column;gap:6px;max-width:560px;overflow:hidden}   /* F110 (review): the rows are flex:0 0 auto, so the body became purely ADDITIVE — a two-line name over a wrapped loadout line ran straight into .bffoot. The rows below are each clamped to fit this 268px box; this is the backstop. */
.bf .r{flex:0 0 auto;min-height:0;animation:bfin .45s cubic-bezier(.2,.8,.2,1) both}   /* F110: flex items SHRINK by default, so .bfname/.bfdesc were sized below their own content and their overflow:hidden sheared the text. The box never overflowed, which is why no overflow check caught it. Every row now keeps its content height and the type below is sized to the 268px box. */
.bf .r1{animation-delay:.08s}.bf .r2{animation-delay:.16s}.bf .r3{animation-delay:.24s}.bf .r4{animation-delay:.32s}.bf .r5{animation-delay:.12s}   /* the CTA lands early — it is the control, never the last thing to appear */
@keyframes bfin{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes bfart{from{opacity:0;transform:scale(1.06)}to{opacity:.55;transform:none}}
.bf .bfk{display:flex;align-items:center;gap:10px}
.bf .bfk .lab{font-size:11px;letter-spacing:.3em;color:var(--mut);font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* F110: a long host ruleset wrapped this kicker to two lines and pushed everything below it down */
.bf .bfname{font-family:var(--fd);font-style:italic;font-weight:700;font-size:40px;line-height:1.24;letter-spacing:.06em;text-shadow:0 0 30px color-mix(in srgb,var(--glow) 45%,transparent);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}   /* line-height 1.24 IS Saira Condensed's glyph box (measured): anything tighter clips the descenders inside overflow:hidden */
.bf .bfdesc{font-size:12.5px;line-height:1.45;height:36.25px;color:var(--num);font-weight:600;opacity:.9;max-width:520px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}   /* exactly the two lines the clamp shows — a height, not a max-height, so the row cannot be squeezed to one */
.bf .bfrules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 10px;max-width:540px}
.bf .bfrules .cell{display:flex;flex-direction:column;gap:1px;padding:4px 9px;background:var(--plate);border:1px solid var(--edge);min-width:0}
.bf .bfrules .k{font-size:11px;letter-spacing:.26em;color:var(--mut);font-weight:700}
.bf .bfrules .v{font-family:var(--fd);font-weight:700;font-size:14px;line-height:1.2;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bf .bfload{display:flex;gap:10px;align-items:baseline;font-size:12px;line-height:1.35;color:var(--num);font-weight:600;max-width:540px}
.bf .bfload .v{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}   /* F110: the host writes this line and it is the LAST row — unclamped it grew straight into the CTA footer */
.bf .bfload .k{flex:0 0 auto;font-size:11px;letter-spacing:.26em;color:var(--glow);font-weight:700;padding-top:2px;padding-left:2px}   /* integration pass 2026-09-23: the L sat on .bfbody's overflow edge and was clipped ("OADOUT") */
/* QA-20: the mode art is a render with a fake HUD baked in (a 04:52 TIME REMAINING clock on tdm.jpg), which read as
   live data behind a real briefing. Blurred, it stays atmosphere and no number in it can be read. */

/* HUD QA R2-07 (2026-09-24, QA-21 again): the in-game labels were 11 frame px, which is 8.7 px on the SE's 0.79 frame. The
   floor is 11 px ON SCREEN, so 14 frame px: the identity and clock labels, the link cluster, the slot word, the stats, the
   powerup hint and chip, the death screen's columns and recap, and the live pills. Letter-spacing gives back the width. */

/* HUD QA gate "a persistent KOTH hill state on the live HUD": the hill chip rides in the clock plate, in the owner's colour, day
   and night. The callout card says the hill changed hands; this says who holds it now. */
.clockplate .hillnow{display:inline-flex;align-items:center;gap:5px;font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:.08em;color:var(--mut)}
.clockplate .hillnow .ic{width:15px;height:15px}
.clockplate .hillnow[data-owner="blue"]{color:var(--team-blue)}.clockplate .hillnow[data-owner="red"]{color:var(--team-red)}
.clockplate .hillnow[data-owner="yellow"]{color:var(--team-yellow)}.clockplate .hillnow[data-owner="green"]{color:var(--team-green)}
[data-env="night"] .clockplate .hillnow{color:var(--num)!important}
.down .recap .tm b{font-size:18px}
/* HUD QA R2-08: the redeploy instruction is 14 px on the SE screen (18 frame px), and at night the bright night red, still */
.down .safe.w1 span{font-size:18px}
[data-env="night"] .down .safe span{color:#ef6868}
[data-env="night"] .down .safe.w2 span,[data-env="night"] .down .safe.w3{animation:none}
/* HUD QA R2-20: by day the armour number sat unlabelled beside the health number. Its label shows by day too (the HP label
   stays a night-only aid: the big number is health by its size and colour). */
.vitals .hplab.armorlabel{display:inline;font-size:14px;letter-spacing:.16em;color:var(--armor);font-weight:700;opacity:.85}
[data-env="night"] .vitals .hplab.armorlabel{opacity:1;color:var(--mut);font-weight:600}
</style>
</head>
<body>
  <div id="stage">
    <div id="frame" data-team="blue">
      <div id="hud"></div>
      <div id="overlay"></div>
      <div id="chips"></div>
      <button id="info" class="infobtn" aria-label="diagnostics">ⓘ</button>
      <button id="skin" class="infobtn" data-act="onToggleNight" role="switch" aria-checked="false" aria-label="night"></button>
      <div id="diag"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
