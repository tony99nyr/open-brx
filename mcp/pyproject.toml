[project]
name = "brx-mcp"
version = "0.1.0"
description = "MCP server giving Claude Code direct BLE control of Battle Company BRX taggers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "bleak>=0.22",
    "mcp>=1.2",
]

[project.scripts]
brx-mcp = "brx_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["brx_mcp"]
