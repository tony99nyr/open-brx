[project]
name = "brx-mcp"
version = "0.1.0"
description = "MCP server giving Claude Code direct BLE control of Battle Company BRX taggers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "bleak>=0.22",
    "mcp>=2,<3",
]

# Two venvs, two extras (CLAUDE.md "Environment"): the WSL `.venv` runs Mission Control and needs
# `mc`; the Windows venv (`C:\Users\Tony\.brx-mcp\venv`) runs the bench tools and needs `bench`.
# Neither venv is a plain `pip install -e ./mcp` today (both are hand-built per CLAUDE.md), but this
# is the accurate dependency list for whichever install path replaces that by hand.
[project.optional-dependencies]
mc = ["websockets>=13", "starlette", "uvicorn", "zeroconf"]
# `matplotlib`: `tools/soundbank_analyze.py` imports it for the spectrogram/envelope plots and was
# the one undeclared third-party import in tools/ (found 2026-09-12 by tests/test_optional_deps.py).
bench = ["numpy", "pillow", "pyserial", "librosa", "faster-whisper", "matplotlib"]

[project.scripts]
brx-mcp = "brx_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["brx_mcp"]

[tool.setuptools.package-data]
brx_mcp = ["data/*.json", "mc/*.json", "stage/*.html"]

[tool.pyright]
# The static-type gate for the server (2026-09-12, contract-DRY follow-up F42.10). `standard` mode: the
# hints already on 81% of defs are checked, not just decorative. `mcp/tests/test_pyright.py` runs this and
# fails on any error; CI installs pyright for its second (with-extras) pass. Regenerate nothing: the
# generated contract files are TS/JS and out of scope here.
include = ["brx_mcp"]
# The bench stage drives the phone from raw JSON (stage.py); typing it is its own job -- FOLLOWUPS F42.14.
exclude = ["brx_mcp/stage"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# `serial` / `bleak` are optional on the machine running the checker (WSL has no Bluetooth).
reportMissingModuleSource = false

