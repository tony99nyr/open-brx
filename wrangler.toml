# Cloudflare Workers static-site config.
# Serves ONLY the webapp/ folder (ble-test.html, mission-control.html, later the
# PWA + BRX manual) — the rest of the (private) repo is NOT published.
# No `main` script → assets-only static site.
name = "open-brx"
compatibility_date = "2024-11-01"

[assets]
directory = "./webapp"
not_found_handling = "404-page"   # serves webapp/404.html with a 404 status

# The site is GENERATED from docs/manual/*.md by `npm run build` at the repo root.
# ⚠ TODAY THE BUILT PAGES ARE STILL COMMITTED and Cloudflare serves ./webapp exactly as pushed.
# This [build] block is only used by `wrangler deploy` from a machine. Push-to-deploy uses the build
# command set in the Cloudflare DASHBOARD, and that is NOT SET YET:
#   Workers & Pages -> open-brx -> Settings -> Build -> Build command: npm run build
# Until it is set, do not stop committing webapp/ (FOLLOWUPS B24). See docs/site/SIMPLIFY-PLAN.md §6.
[build]
command = "npm run build"
