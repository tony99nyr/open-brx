# Cloudflare Workers static-site config.
# Serves ONLY the webapp/ folder (ble-test.html, mission-control.html, later the
# PWA + BRX manual) — the rest of the (private) repo is NOT published.
# No `main` script → assets-only static site.
name = "open-brx"
compatibility_date = "2024-11-01"

[assets]
directory = "./webapp"
not_found_handling = "404-page"   # serves webapp/404.html with a 404 status

# The site is GENERATED from docs/manual/*.md. `npm run build` at the repo root renders it into
# webapp/ before deploy, so the built pages are no longer committed (docs/site/SIMPLIFY-PLAN.md §3.8).
# For push-to-deploy this command must also be set in the Cloudflare dashboard:
#   Workers & Pages -> open-brx -> Settings -> Build -> Build command: npm run build
[build]
command = "npm run build"
