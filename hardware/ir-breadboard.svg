<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'DejaVu Sans','Segoe UI',sans-serif">
  <rect width="940" height="660" fill="#f6f5f1"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#1c2733">BRX IR Bench — ESP32-S3 wiring</text>
  <text x="30" y="60" font-size="13" fill="#5b6670">Matches hardware/esp32-ir-bridge/ir_capture.ino (RX) + ir_emit.ino (TX). Board: ESP32-S3-DevKitC-1 (N16R8).</text>

  <!-- power rails -->
  <rect x="300" y="96" width="600" height="7" rx="3" fill="#d64545"/>
  <text x="906" y="102" font-size="12" fill="#d64545" font-weight="700">3V3</text>
  <rect x="300" y="600" width="600" height="7" rx="3" fill="#2b2f36"/>
  <text x="906" y="606" font-size="12" fill="#2b2f36" font-weight="700">GND</text>

  <!-- ESP32-S3 board -->
  <rect x="40" y="150" width="200" height="320" rx="10" fill="#14304a"/>
  <text x="140" y="185" font-size="16" font-weight="700" fill="#eaf1f7" text-anchor="middle">ESP32-S3</text>
  <text x="140" y="205" font-size="12" fill="#9fb6c8" text-anchor="middle">DevKitC-1 · N16R8</text>
  <text x="140" y="452" font-size="10" fill="#7f97ab" text-anchor="middle">USB → Mac (serial)</text>

  <!-- pin tabs -->
  <g font-size="12" font-weight="700">
    <rect x="240" y="216" width="54" height="22" rx="3" fill="#d64545"/><text x="267" y="231" fill="#fff" text-anchor="middle">3V3</text>
    <rect x="240" y="250" width="54" height="22" rx="3" fill="#2b2f36"/><text x="267" y="265" fill="#fff" text-anchor="middle">GND</text>
    <rect x="240" y="300" width="60" height="22" rx="3" fill="#e0a020"/><text x="270" y="315" fill="#3a2c00" text-anchor="middle">GPIO4</text>
    <rect x="240" y="360" width="60" height="22" rx="3" fill="#2f7fd6"/><text x="270" y="375" fill="#fff" text-anchor="middle">GPIO5</text>
    <rect x="240" y="420" width="60" height="22" rx="3" fill="#3a9b57"/><text x="270" y="435" fill="#fff" text-anchor="middle">GPIO6</text>
  </g>

  <!-- ============ RX: VS1838B ============ -->
  <rect x="560" y="150" width="170" height="110" rx="8" fill="#efe7d6" stroke="#b9ab8c"/>
  <text x="645" y="176" font-size="14" font-weight="700" fill="#3a3324" text-anchor="middle">VS1838B</text>
  <text x="645" y="194" font-size="11" fill="#6b6350" text-anchor="middle">38 kHz IR receiver</text>
  <g font-size="11" font-weight="700" fill="#3a3324">
    <circle cx="560" cy="222" r="4" fill="#e0a020"/><text x="572" y="226">OUT</text>
    <circle cx="600" cy="222" r="4" fill="#d64545"/><text x="612" y="240" text-anchor="middle">VCC</text>
    <circle cx="640" cy="222" r="4" fill="#2b2f36"/><text x="652" y="240" text-anchor="middle">GND</text>
  </g>

  <!-- RX wires -->
  <polyline points="300,311 430,311 430,222 556,222" fill="none" stroke="#e0a020" stroke-width="3"/>
  <text x="360" y="305" font-size="11" fill="#a9791a">OUT → GPIO4</text>
  <polyline points="600,226 600,99" fill="none" stroke="#d64545" stroke-width="3"/>
  <polyline points="640,226 640,603" fill="none" stroke="#2b2f36" stroke-width="3"/>
  <!-- decoupling cap -->
  <line x1="612" y1="120" x2="612" y2="132" stroke="#2b2f36" stroke-width="2"/>
  <line x1="606" y1="132" x2="618" y2="132" stroke="#2b2f36" stroke-width="2"/>
  <line x1="606" y1="138" x2="618" y2="138" stroke="#2b2f36" stroke-width="2"/>
  <line x1="612" y1="138" x2="612" y2="150" stroke="#2b2f36" stroke-width="2"/>
  <line x1="612" y1="150" x2="640" y2="150" stroke="#2b2f36" stroke-width="2"/>
  <text x="600" y="118" font-size="10" fill="#5b6670" text-anchor="end">0.1µF</text>

  <!-- ============ TX: IR LED via 2N2222 ============ -->
  <text x="560" y="330" font-size="13" font-weight="700" fill="#1c2733">IR emit (drive for range)</text>

  <!-- 330Ω base resistor -->
  <rect x="360" y="362" width="40" height="16" rx="3" fill="#caa46a" stroke="#8a6d3b"/>
  <text x="380" y="356" font-size="10" fill="#5b6670" text-anchor="middle">330Ω</text>
  <polyline points="300,371 360,371" fill="none" stroke="#2f7fd6" stroke-width="3"/>
  <text x="312" y="365" font-size="10" fill="#2f7fd6">GPIO5</text>
  <polyline points="400,371 470,371" fill="none" stroke="#2f7fd6" stroke-width="3"/>

  <!-- 2N2222 -->
  <circle cx="500" cy="430" r="30" fill="#dfe3e7" stroke="#8b95a0"/>
  <text x="500" y="478" font-size="11" font-weight="700" fill="#3a3324" text-anchor="middle">2N2222</text>
  <text x="472" y="366" font-size="10" fill="#5b6670" text-anchor="middle">B</text>
  <text x="506" y="404" font-size="10" fill="#5b6670">C</text>
  <text x="506" y="462" font-size="10" fill="#5b6670">E</text>
  <line x1="470" y1="371" x2="500" y2="430" stroke="#3a3f45" stroke-width="2"/> <!-- base -->
  <line x1="500" y1="400" x2="500" y2="360" stroke="#3a3f45" stroke-width="2"/> <!-- collector up -->
  <line x1="500" y1="460" x2="500" y2="603" stroke="#2b2f36" stroke-width="3"/> <!-- emitter → GND -->

  <!-- IR LED between 3V3 (via 100Ω) and collector -->
  <rect x="480" y="150" width="40" height="16" rx="3" fill="#caa46a" stroke="#8a6d3b"/>
  <text x="500" y="144" font-size="10" fill="#5b6670" text-anchor="middle">100Ω</text>
  <polyline points="500,99 500,150" fill="none" stroke="#d64545" stroke-width="3"/>
  <polyline points="500,166 500,190" fill="none" stroke="#3a3f45" stroke-width="2"/>
  <!-- LED symbol -->
  <polygon points="490,190 510,190 500,208" fill="#8a2b2b"/>
  <line x1="490" y1="208" x2="510" y2="208" stroke="#8a2b2b" stroke-width="3"/>
  <text x="524" y="203" font-size="11" fill="#3a3324">IR LED 940nm</text>
  <polyline points="500,208 500,360" fill="none" stroke="#3a3f45" stroke-width="2"/>
  <text x="512" y="290" font-size="10" fill="#5b6670">anode→3V3, cathode→C</text>

  <!-- ============ Status LED GPIO6 ============ -->
  <rect x="360" y="512" width="40" height="16" rx="3" fill="#caa46a" stroke="#8a6d3b"/>
  <text x="380" y="506" font-size="10" fill="#5b6670" text-anchor="middle">220Ω</text>
  <polyline points="300,431 340,431 340,520 360,520" fill="none" stroke="#3a9b57" stroke-width="3"/>
  <text x="312" y="425" font-size="10" fill="#3a9b57">GPIO6</text>
  <polyline points="400,520 440,520" fill="none" stroke="#3a9b57" stroke-width="3"/>
  <polygon points="440,512 440,528 456,520" fill="#2f7f3f"/>
  <line x1="456" y1="512" x2="456" y2="528" stroke="#2f7f3f" stroke-width="3"/>
  <text x="466" y="524" font-size="10" fill="#3a3324">status LED (visible)</text>
  <polyline points="456,520 456,603" fill="none" stroke="#2b2f36" stroke-width="3"/>

  <!-- notes -->
  <rect x="30" y="500" width="200" height="130" rx="8" fill="#fff" stroke="#d8d3c6"/>
  <text x="42" y="522" font-size="12" font-weight="700" fill="#1c2733">Notes</text>
  <text x="42" y="542" font-size="10.5" fill="#3a3f45">• N16R8: avoid GPIO 26–37</text>
  <text x="42" y="558" font-size="10.5" fill="#3a3f45">  (SPI-flash + octal PSRAM).</text>
  <text x="42" y="576" font-size="10.5" fill="#3a3f45">• RX idles HIGH; 1st edge</text>
  <text x="42" y="590" font-size="10.5" fill="#3a3f45">  HIGH→LOW = mark begins.</text>
  <text x="42" y="608" font-size="10.5" fill="#3a3f45">• 940nm from kit; BRX RX is</text>
  <text x="42" y="622" font-size="10.5" fill="#3a3f45">  wideband 38kHz — should trig.</text>
</svg>
